<script>
(function(){
/* ==========================================================================
   GRAVE RUSH 3D  -  a Grave Rush remake in the style of SNES-era Doom
   One file. Raycast "fake 3D" renderer, sprite enemies, co-op over PeerJS.

   Sections
     01 core      constants, helpers, canvas, input
     02 font      5x5 font (from Grave Rush), 3x5 HUD font, big HUD digits
     03 audio     NES/SNES-ish synth sfx + music, stereo positional
     04 art       procedural textures, sprites, first-person guns, face, HUD bar
     05 data      weapons, zombies, perks, the 15 Grave Rush arenas + 3D themes
     06 render    raycaster, flats, sky, billboards, view weapon
     07 sim       host-side game simulation (players, zombies, rounds, shop)
     08 net       PeerJS host/join, input + snapshot protocol
     09 ui        status bar, overlays, menus, lobby
     10 main      mode machine and frame loop
   ========================================================================== */
'use strict';
const VERSION = '1.0.0';
const SW = 256, SH = 224;            // full screen (SNES)
const VH = 176;                      // 3D view height, status bar below
const BAR_Y = VH, BAR_H = SH - VH;
const PIXEL_ASPECT = 8 / 7;          // SNES pixels are a little wider than tall
const FOV_PLANE = 1.0;               // tan(45deg) -> 90 degree horizontal FOV
const MAX_PLAYERS = 4;

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
cvs.width = SW; cvs.height = SH;
ctx.imageSmoothingEnabled = false;

function fit() {
  const aw = SW * PIXEL_ASPECT;
  let s = Math.min(window.innerWidth / aw, window.innerHeight / SH);
  if (s >= 2) s = Math.floor(s * 4) / 4;
  cvs.style.width = Math.floor(aw * s) + 'px';
  cvs.style.height = Math.floor(SH * s) + 'px';
}
window.addEventListener('resize', fit);

/* ---------------------------------------------------------------- helpers */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => (a + Math.random() * (b - a + 1)) | 0;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = Math.round;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const TAU = Math.PI * 2;
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function hash2(x, y, s) { let h = (x * 374761393 + y * 668265263 + (s || 0) * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* colors are packed little-endian ABGR so they drop straight into ImageData */
function hexI(h, a) {
  if (typeof h === 'number') return h;
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return ((((a === undefined ? 255 : a) & 255) << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | ((n >> 16) & 255)) >>> 0;
}
const cR = c => c & 255, cG = c => (c >> 8) & 255, cB = c => (c >> 16) & 255, cA = c => c >>> 24;
const rgbI = (r, g, b, a) => ((((a === undefined ? 255 : a) & 255) << 24) | ((clamp(b, 0, 255) | 0) << 16) | ((clamp(g, 0, 255) | 0) << 8) | (clamp(r, 0, 255) | 0)) >>> 0;

function mixI(a, b, t) { return rgbI(lerp(cR(a), cR(b), t), lerp(cG(a), cG(b), t), lerp(cB(a), cB(b), t), 255); }

/* ---------------------------------------------------------------- input */
const keys = {}, pressed = {};
const mouse = { x: SW / 2, y: SH / 2, left: false, right: false, leftP: false, rightP: false, dx: 0, locked: false, wheel: 0 };
const typed = [];                    // characters typed this frame (for text fields)
const PREVENT = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace', 'Quote', 'Slash']);
let audioInitHook = () => { };
let onBlurHook = null, onUnlockHook = null;
window.addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (e.key && e.key.length === 1) typed.push(e.key);
  if (PREVENT.has(e.code) || (e.code === 'Escape' && mouse.locked)) e.preventDefault();
  audioInitHook();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouse.left = mouse.right = false;
  if (typeof onBlurHook === 'function') onBlurHook();
});
function setMouse(e) {
  const r = cvs.getBoundingClientRect();
  if (!r.width) return;
  mouse.x = (e.clientX - r.left) * SW / r.width;
  mouse.y = (e.clientY - r.top) * SH / r.height;
}
window.addEventListener('mousemove', e => {
  if (mouse.locked) mouse.dx += e.movementX || 0;
  else setMouse(e);
});
cvs.addEventListener('mousedown', e => {
  if (!mouse.locked) setMouse(e);
  audioInitHook();
  if (e.button === 0) { mouse.left = true; mouse.leftP = true; }
  if (e.button === 2) { mouse.right = true; mouse.rightP = true; }
  e.preventDefault();
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) mouse.left = false;
  if (e.button === 2) mouse.right = false;
});
cvs.addEventListener('wheel', e => { mouse.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
cvs.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('pointerlockchange', () => {
  mouse.locked = document.pointerLockElement === cvs;
  mouse.dx = 0;
  if (!mouse.locked && typeof onUnlockHook === 'function') onUnlockHook();
});
let lockFailed = false;
document.addEventListener('pointerlockerror', () => { lockFailed = true; });
function requestLock() {
  if (mouse.locked || !cvs.requestPointerLock) return;
  try { const p = cvs.requestPointerLock(); if (p && p.catch) p.catch(() => { lockFailed = true; }); } catch (e) { lockFailed = true; }
}

/* ---------------------------------------------------------------- storage */
const store = {
  get(k, d) { try { const v = localStorage.getItem('gr3d_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gr3d_' + k, JSON.stringify(v)); } catch (e) { } },

const settings = Object.assign({ sens: 5, detail: 'low', bob: true, music: true, vol: 7, name: '' }, store.get('settings', {}));
function saveSettings() { store.set('settings', settings); }

/* ==========================================================================
   02 FONT
   ========================================================================== */
/* the original Grave Rush 5x5 font */
const FONT_SRC = {

  'V': '10001 10001 10001 01010 00100', 'W': '10001 10001 10101 11011 10001', 'X': '10001 01010 00100 01010 10001',
  'Y': '10001 01010 00100 00100 00100', 'Z': '11111 00010 00100 01000 11111',
  '0': '01110 10011 10101 11001 01110', '1': '00100 01100 00100 00100 01110', '2': '01110 10001 00110 01000 11111',
  '3': '11110 00001 01110 00001 11110', '4': '10010 10010 11111 00010 00010', '5': '11111 10000 11110 00001 11110',
  '6': '01110 10000 11110 10001 01110', '7': '11111 00001 00010 00100 00100', '8': '01110 10001 01110 10001 01110',
  '9': '01110 10001 01111 00001 01110',
  '.': '00000 00000 00000 00000 00100', ',': '00000 00000 00000 00100 01000', ':': '00000 00100 00000 00100 00000',
  '!': '00100 00100 00100 00000 00100', '?': '01110 00001 00110 00000 00100', '+': '00000 00100 01110 00100 00000',
  '-': '00000 00000 01110 00000 00000', '/': '00001 00010 00100 01000 10000', '%': '10001 00010 00100 01000 10001',
  '$': '01111 10100 01110 00101 11110', '[': '01110 01000 01000 01000 01110', ']': '01110 00010 00010 00010 01110',

  ' ': '00000 00000 00000 00000 00000',
};
const FONT = {};
for (const k in FONT_SRC) FONT[k] = FONT_SRC[k].split(' ');

/* compact 3x5 face for the status bar labels */
const TINY_SRC = {
  A: '010 101 111 101 101', B: '110 101 110 101 110', C: '011 100 100 100 011', D: '110 101 101 101 110',
  E: '111 100 110 100 111', F: '111 100 110 100 100', G: '011 100 101 101 011', H: '101 101 111 101 101',
  I: '111 010 010 010 111', J: '001 001 001 101 010', K: '101 101 110 101 101', L: '100 100 100 100 111',
  M: '101 111 111 101 101', N: '110 101 101 101 101', O: '010 101 101 101 010', P: '110 101 110 100 100',
  Q: '010 101 101 110 011', R: '110 101 110 101 101', S: '011 100 010 001 110', T: '111 010 010 010 010',

  Y: '101 101 010 010 010', Z: '111 001 010 100 111',
  0: '111 101 101 101 111', 1: '010 110 010 010 111', 2: '110 001 010 100 111', 3: '110 001 010 001 110',
  4: '101 101 111 001 001', 5: '111 100 110 001 110', 6: '011 100 111 101 111', 7: '111 001 010 010 010',

  '+': '000 010 111 010 000', '-': '000 000 111 000 000', '%': '101 001 010 100 101', '$': '011 110 010 011 110',
  '.': '000 000 000 000 010', ':': '000 010 000 010 000', '/': '001 001 010 100 100', '[': '110 100 100 100 110',

  '(': '010 100 100 100 010', ')': '010 001 001 001 010', '#': '101 111 101 111 101', '*': '000 101 010 101 000',

  '_': '000 000 000 000 111', ' ': '000 000 000 000 000',

const TINY = {};
for (const k in TINY_SRC) TINY[k] = TINY_SRC[k].split(' ');

const glyphCache = {};
function makeGlyph(rows, gw, color, sc, shadow) {

/* ---------- skies (panorama 512 x 112) */
function makeSky(o) {
  const W = 512, H = 112, p = new Pix(W, H), R = mulberry(o.seed || 1);
  const top = hexI(o.top), mid = hexI(o.mid), bot = hexI(o.bot);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let t = y / H + (bayer(x, y) - 0.5) * 0.06;
    const band = Math.floor(t * 10) / 10;                 // SNES-style colour bands
    p.d[y * W + x] = band < 0.55 ? mixI(top, mid, band / 0.55) : mixI(mid, bot, (band - 0.55) / 0.45);
  }
  for (let i = 0; i < (o.stars || 0); i++) { const x = R() * W | 0, y = R() * H * 0.7 | 0; p.px(x, y, mixI(hexI('#ffffff'), top, R() * 0.6)); }
  if (o.moon) {
    const [mx, my, mr] = o.moon;
    p.ell(mx, my, mr + 3, mr + 3, mixI(hexI(o.moonGlow || '#4c5c8c'), p.get(mx, my), 0.5));
    p.ell(mx, my, mr, mr, (x, y, nx, ny) => { const v = 0.75 + fbm(x, y, 3, 5) * 0.3 - (nx > 0.3 ? 0.15 : 0); return rampAt(ramp(['#a8a898', '#d4d4c0', '#f4f4e4', '#ffffff']), v, x, y); });
  }
  if (o.clouds) for (let i = 0; i < o.clouds; i++) {
    const cx = R() * W, cy = 18 + R() * 40, len = 30 + R() * 60, c = hexI(o.cloud);
    for (let k = 0; k < len; k++) { const x = (cx + k) % W, th = 2 + Math.sin(k / len * Math.PI) * 4; for (let j = 0; j < th; j++) if (bayer(x | 0, cy + j | 0) < 0.65) p.px(x, cy + j - th / 2, c); }
  }
  const S = hexI(o.sil || '#05050a');
  const silAt = (x, h) => { for (let y = H - h; y < H; y++) p.px(x, y, S); };
  for (let x = 0; x < W; x++) {
    const xs = x / W * TAU;
    let h = (o.hills || 0) * (0.5 + 0.3 * Math.sin(xs * 3 + 1) + 0.2 * Math.sin(xs * 7));
    if (o.trees) { const k = x % 9; h = Math.max(h, o.trees * (0.6 + 0.4 * vnoise(x, 0, 6, 3)) - Math.abs(k - 4) * 2.2 + (hash2(Math.floor(x / 9), 1, 7) * 8)); }
    if (o.city) { const b = Math.floor(x / 14); h = Math.max(h, o.city * (0.35 + hash2(b, 0, 3) * 0.65)); }
    if (o.mesa) { h = Math.max(h, o.mesa * clamp(Math.sin(xs * 2 + 0.4) * 2.4 - 0.6, 0, 1) * (0.9 + 0.1 * vnoise(x, 0, 4, 1))); }
    if (h > 0) silAt(x, h | 0);
  }
  if (o.city) for (let i = 0; i < 160; i++) { const x = R() * W | 0, b = Math.floor(x / 14), bh = o.city * (0.35 + hash2(b, 0, 3) * 0.65); const y = H - 3 - R() * (bh - 6); if (H - y < bh - 2 && x % 14 > 1 && x % 14 < 12) p.px(x, y, hexI(R() < 0.7 ? '#fcd070' : '#a0c8ff')); }
  if (o.deadTrees) for (let i = 0; i < o.deadTrees; i++) {
    const x0 = R() * W, h = 26 + R() * 30;
    p.line(x0, H, x0, H - h, S, 2);
    for (let k = 0; k < 5; k++) { const y = H - h * (0.4 + R() * 0.6), d = (R() < 0.5 ? -1 : 1) * (5 + R() * 10); p.line(x0, y, x0 + d, y - 4 - R() * 8, S, 1); }
  }
  if (o.church) { const x0 = o.church; p.rect(x0, H - 30, 22, 30, S); p.poly([[x0 + 4, H - 30], [x0 + 11, H - 52], [x0 + 18, H - 30]], S); p.rect(x0 + 10, H - 60, 2, 9, S); p.rect(x0 + 7, H - 57, 8, 2, S); p.rect(x0 + 9, H - 24, 4, 6, hexI('#fcc048')); }
  if (o.barn) { const x0 = o.barn; p.rect(x0, H - 26, 30, 26, S); p.poly([[x0 - 2, H - 26], [x0 + 15, H - 38], [x0 + 32, H - 26]], S); p.rect(x0 + 40, H - 46, 9, 46, S); p.ell(x0 + 44.5, H - 46, 4.5, 4, S); p.rect(x0 + 12, H - 16, 6, 6, hexI('#fca048')); }
  if (o.sign) { const x0 = o.sign; p.rect(x0 + 12, H - 40, 2, 40, S); p.rect(x0, H - 52, 34, 13, S); bigText(p, 'MOTEL', x0 + 2, H - 49, hexI('#f84868')); }
  return { w: W, h: H, d: p.d, pix: p };
}

/* ---------------------------------------------------------------- billboard sprites (64 px per world unit) */
const SPU = 64;
const OUTLINE = hexI('#0c0a10');
/* resample a sprite: rotate by ang around its foot point, scale, into a new canvas */
function xform(src, ang, sx, sy, W, H, dx, dy) {
  const p = new Pix(W, H), ca = Math.cos(-ang), sa = Math.sin(-ang);
  const px0 = src.w / 2, py0 = src.h;                     // pivot = bottom centre of source
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const X = (x + 0.5 - dx) / sx, Y = (y + 0.5 - dy) / sy;
    const u = X * ca - Y * sa + px0, v = X * sa + Y * ca + py0;
    const c = src.get(Math.floor(u), Math.floor(v));
    if (cA(c)) p.d[y * W + x] = c;
  }
  return p;
}
function eyes(p, x, y, gap, col, sz) {
  const C = FB(hexI(col)); sz = sz || 1;
  p.rect(x - gap - sz + 1, y, sz, sz, C); p.rect(x + gap, y, sz, sz, C);
}

function bloodDots(p, x0, y0, w, h, n, seed) {

    p.px(Math.round(cx - mw / 2) + 1, my + 1, hexI('#e8e0c0'));

function zombieFrame(type, f) {

  let p;

    const run = type === 'runner';
    p = new Pix(44, 44);

    const hip = run ? 28 : 27, sh = (run ? 17 : 16) + bob, tw = run ? 12 : 14;

      p.limb(lx, hip + bob, lx + (s ? 0.5 : -0.5), foot - lift[s] - 2, 5.5, 4.5, PA);
      p.rect(Math.round(lx - 2.5), foot - lift[s] - 2, 5, 2, SHOE);

    if (!run) {   // exposed ribs through a torn shirt

      bloodDots(p, cx - tw / 2, sh, tw, hip - sh, 14, 3);
    } else {
      bloodDots(p, cx - tw / 2, sh, tw, hip - sh, 10, 5);
      p.rect(cx - 1, sh, 2, hip - sh, shadeI(SH[0], 0.9));
    }
    p.rect(Math.round(cx - tw / 2 + 1), hip - 1 + bob, tw - 2, 2, shadeI(PA[0], 0.7));   // belt
    // arms
    const shL = [cx - tw / 2 + 1, sh + 2], shR = [cx + tw / 2 - 1, sh + 2];

    else { hL = [cx - 14, sh + 1 - w]; hR = [cx + 14, sh + w]; }

    }

const MENU = { items: [], sel: 0, title: '' };

function menuInput() {

  if (pressed.ArrowUp || pressed.KeyW) { MENU.sel = (MENU.sel + it.length - 1) % it.length; sfx('menu'); }

  if ((pressed.ArrowRight || pressed.KeyD) && cur.adj) { cur.adj(1); sfx('menu'); }

function drawMenu(x0, y0, w, step) {

   ========================================================================== */
let mode = 'boot', paused = false, pauseScreen = 'main', unlockT = 0;

let noticeMsg = '', noticeBack = 'title', joinIntent = 'host';
const playerName = () => (settings.name || 'PLAYER').toUpperCase();

function onGameOver() {
  const me = meP();
  newBest = false;
  if (G.round > best.round) { best.round = G.round; newBest = true; }
  if (me && me.earned > best.score) { best.score = me.earned; newBest = true; }
  store.set('best', best);
  sfx('over');
  releaseLock();
}
onUnlockHook = () => { if (mode === 'play' && !paused && G && !G.over) { paused = true; pauseScreen = 'main'; setPauseMenu(); unlockT = performance.now(); } };
onBlurHook = () => { if (mode === 'play' && NET.mode === 'off' && G && !G.over && !paused) { paused = true; pauseScreen = 'main'; setPauseMenu(); } };
cvs.addEventListener('mousedown', () => { if (mode === 'play' && !paused && G && !G.over && !FX.swapOpen) requestLock(); });

  netClose(); G = null; paused = false; releaseLock(); toTitle();
}
function toTitle() { mode = 'title'; musicMode = 'title'; attractInit(); setTitleMenu(); }
function showNotice(msg, back) { noticeMsg = msg; noticeBack = back || 'title'; mode = 'notice'; G = null; releaseLock(); setMenu([{ label: 'OK', act: () => { if (noticeBack === 'title') toTitle(); else mode = noticeBack; } }]); attractInit(); }

/* ---------------------------------------------------------------- menus */
function setTitleMenu() {
  setMenu([
    { label: 'PLAY SOLO', act: startSolo },
    { label: 'HOST CO-OP', act: () => { joinIntent = 'host'; toName(); } },
    { label: 'JOIN CO-OP', act: () => { joinIntent = 'join'; toName(); } },
    { label: 'HOW TO PLAY', act: () => { mode = 'help'; setMenu([{ label: 'BACK', act: toTitle }]); } },
    { label: 'SETTINGS', act: () => { mode = 'settings'; setSettingsMenu(toTitle); } },
  ]);
}
function setSettingsMenu(back) {
  setMenu([
    { label: () => 'MOUSE SPEED  < ' + settings.sens + ' >', adj: d => { settings.sens = clamp(settings.sens + d, 1, 15); saveSettings(); } },
    { label: () => 'DETAIL  < ' + (settings.detail === 'low' ? 'SNES CHUNKY' : 'SHARP') + ' >', adj: () => { settings.detail = settings.detail === 'low' ? 'high' : 'low'; setDetail(settings.detail); saveSettings(); } },
    { label: () => 'VIEW BOB  < ' + (settings.bob ? 'ON' : 'OFF') + ' >', adj: () => { settings.bob = !settings.bob; saveSettings(); } },
    { label: () => 'MUSIC  < ' + (settings.music ? 'ON' : 'OFF') + ' >', adj: () => { settings.music = !settings.music; saveSettings(); } },
    { label: () => 'VOLUME  < ' + settings.vol + ' >', adj: d => { setVolume(settings.vol + d); saveSettings(); } },
    { label: 'BACK', act: back },
  ]);
}
function setPauseMenu() {
  setMenu([
    { label: 'RESUME', act: () => { paused = false; requestLock(); } },
    { label: 'SETTINGS', act: () => { pauseScreen = 'settings'; setSettingsMenu(() => { pauseScreen = 'main'; setPauseMenu(); }); } },
    { label: 'HOW TO PLAY', act: () => { pauseScreen = 'help'; setMenu([{ label: 'BACK', act: () => { pauseScreen = 'main'; setPauseMenu(); } }]); } },
    { label: NET.mode === 'host' ? 'END GAME FOR EVERYONE' : 'QUIT TO TITLE', act: quitToTitle },
  ]);
}
function toName() {
  mode = 'name'; FIELD_IN.val = (settings.name || '').toUpperCase(); FIELD_IN.max = 10; FIELD_IN.chars = /[A-Z0-9 ]/;
  setMenu([{ label: 'CONTINUE', act: nameDone }, { label: 'BACK', act: toTitle }]);
}
function nameDone() {
  settings.name = FIELD_IN.val.trim() || 'PLAYER'; saveSettings();
  if (joinIntent === 'host') {
    mode = 'connecting'; noticeMsg = 'OPENING A ROOM...'; setMenu([{ label: 'CANCEL', act: quitToTitle }]);
    hostOpen(playerName(), (err) => { if (mode !== 'connecting') return; if (err) showNotice(err); else toLobby(); });
  } else {
    mode = 'join'; FIELD_IN.val = ''; FIELD_IN.max = 5; FIELD_IN.chars = /[A-Z0-9]/;
    setMenu([{ label: 'JOIN', act: joinDone }, { label: 'BACK', act: toTitle }]);
  }
}
function joinDone() {
  const code = FIELD_IN.val.trim();
  if (code.length !== 5) { sfx('deny'); return; }
  mode = 'connecting'; noticeMsg = 'JOINING ROOM ' + code + '...'; setMenu([{ label: 'CANCEL', act: quitToTitle }]);
  guestJoin(code, playerName(), (err) => { if (mode !== 'connecting') return; if (err) showNotice(err); else toLobby(); });
}
function toLobby() {
  mode = 'lobby';
  if (NET.mode === 'host') setMenu([{ label: 'START GAME', act: () => startGame(NET.roster.map(r => ({ id: r.id, name: r.name, slot: r.slot }))) }, { label: 'LEAVE', act: quitToTitle }]);
  else setMenu([{ label: 'LEAVE', act: quitToTitle }]);
}

/* ---------------------------------------------------------------- title attract mode (a live 3D arena) */
const ATT = { z: [], t: 0 };
function freeTile() { for (let i = 0; i < 200; i++) { const tx = 1 + ((Math.random() * (MW - 2)) | 0), ty = 1 + ((Math.random() * (MH - 2)) | 0); if (!M.solid[ty * MW + tx]) return [tx + 0.5, ty + 0.5]; } return [10.5, 7.5]; }
function attractInit() {
  M = buildMap((Math.random() * MAPDEFS.length) | 0);
  ATT.z = [];
  for (let i = 0; i < 10; i++) { const p = freeTile(), t = freeTile(); ATT.z.push({ type: pick(['walker', 'walker', 'walker', 'runner', 'brute', 'bloater']), x: p[0], y: p[1], tx: t[0], ty: t[1], anim: rand(0, 4), spd: rand(0.5, 1) }); }
}
function attractFrame(dt, dim) {
  ATT.t += dt;
  for (const z of ATT.z) {
    const dx = z.tx - z.x, dy = z.ty - z.y, d = Math.hypot(dx, dy);
    if (d < 0.3) { const t = freeTile(); z.tx = t[0]; z.ty = t[1]; continue; }
    const ox = z.x, oy = z.y;
    moveEnt(z, dx / d * z.spd * dt, dy / d * z.spd * dt, PR);
    if (Math.hypot(z.x - ox, z.y - oy) < 0.001) { const t = freeTile(); z.tx = t[0]; z.ty = t[1]; }
    z.anim += dt * 4 * z.spd;
  }
  const a = ATT.t * 0.11;
  CAM.x = 10 + Math.cos(a) * 2.2; CAM.y = 7 + Math.sin(a) * 1.4; CAM.a = a + Math.PI * 0.75; CAM.z = 0.45; CAM.bob = 0;
  renderView(CAM);
  const list = ATT.z.map(z => ({ z, d: (z.x - R.px) * R.dirX + (z.y - R.py) * R.dirY })).sort((p, q) => q.d - p.d);
  for (const s of M.statics) drawSprite(s.spr, s.x, s.y, s.z);
  for (const s of list) drawSprite(Math.floor(s.z.anim) % 2 ? ART.z[s.z.type].w1 : ART.z[s.z.type].w0, s.z.x, s.z.y, 0);
  blitView();
  if (dim) { ctx.fillStyle = 'rgba(8,4,16,' + dim + ')'; ctx.fillRect(0, 0, SW, VH); }
  ctx.drawImage(ART.barPlain, 0, BAR_Y);
}
function drawLogo(y) {
  const s = 'GRAVE RUSH', sc = 4, x = Math.round(SW / 2 - textW(s, sc) / 2), bob = Math.round(Math.sin(performance.now() / 600) * 1.5);
  for (let d = 5; d >= 1; d--) text(s, x + d, y + d + bob, d > 3 ? '#3c0808' : '#881818', sc, null);
  text(s, x, y + bob, '#e43828', sc, null);
  for (let i = 0; i < s.length; i++) if (s[i] !== ' ') ctx.drawImage(glyph(s[i], '#f87858', sc, null), 0, 0, 20, 4, x + i * 24, y + bob, 20, 4);
  const bx = SW / 2 + 96, by = y + 25 + bob;
  for (let d = 3; d >= 1; d--) text('3D', bx + d, by + d, '#6c5010', 2, null);
  text('3D', bx, by, '#fcd838', 2, null);
}
function drawTitle() {
  drawLogo(20);
  textC('STILL NO MERCY. NOW IN 3D.', SW / 2, 52, '#fcd838');
  drawMenu(SW / 2, 74, 120);
  if (best.round) tinyC('BEST: ROUND ' + best.round + '   TOP POINTS ' + best.score, SW / 2, BAR_Y + 10, '#a49c86');
  tinyC('WASD MOVE   MOUSE AIM   CLICK SHOOT   E USE', SW / 2, BAR_Y + 22, '#8c84b0');
  tinyC('CO-OP: UP TO 4 PLAYERS WITH A ROOM CODE', SW / 2, BAR_Y + 32, '#8c84b0');
}
const CONTROLS = [
  ['WASD', 'MOVE / STRAFE'], ['MOUSE / ARROWS', 'TURN'], ['SHIFT', 'SPRINT (3 SEC)'], ['LEFT CLICK', 'SHOOT'],
  ['RIGHT CLICK / F', 'KNIFE'], ['E', 'USE / BUY / SWAP'], ['HOLD E', 'REVIVE A TEAMMATE'], ['R', 'UPGRADE KNIFE'],
  ['Q', 'NEXT PERK OFFER'], ['G / SPACE', 'THROW BOMB'], ['TAB', 'MAP + SCOREBOARD'], ['ESC / P', 'PAUSE'],
];
function drawHelp() {
  panel(6, 6, SW - 12, BAR_Y + 30);
  textC('HOW TO PLAY', SW / 2, 12, '#fcd838');
  let y = 24;
  for (const c of CONTROLS) { tiny(c[0], 14, y, '#60e4e4'); tiny(c[1], 76, y, '#e8e0c8'); y += 7; }
  y = 24;
  tiny('5 NEW GUNS', 154, y, '#fcd838'); y += 9;
  for (const g of GUN_LIST.filter(k => WEAPONS[k].isNew)) {
    const cv = ART.itemCv[g];
    ctx.drawImage(cv, SW - 12 - cv.width, y - 3);
    tiny(WEAPONS[g].name, 154, y, '#fff'); tiny(GUN_BLURB[g], 154, y + 6, '#8c84b0'); y += 15;
  }
  const tips = ['POINTS ARE MONEY: SPEND THEM AT THE ANVIL, PERKS AND CHEST', 'ZOMBIES CLIMB OUT OF THE RED GRATES - LISTEN FOR GROANS',
    'CO-OP: DOWNED PLAYERS HAVE 30S - HOLD E ON THEM TO REVIVE', 'EVERY 10 ROUNDS THE FIGHT MOVES TO A NEW AREA'];
  tips.forEach((t, i) => tinyC(t, SW / 2, 118 + i * 8, '#8cdc3c'));
  drawMenu(SW / 2, BAR_Y + 20, 80);
}
function drawLobby() {
  panel(24, 10, SW - 48, 158);
  const host = NET.mode === 'host';
  textC(host ? 'YOUR ROOM' : 'ROOM', SW / 2, 18, '#a49c86');
  textC(NET.code || '-----', SW / 2, 28, '#fcd838', 3);
  tinyC(host ? 'TELL FRIENDS TO PICK JOIN CO-OP AND TYPE THIS CODE' : 'CONNECTED. THE HOST STARTS THE GAME.', SW / 2, 50, '#8c84b0');
  const list = host ? NET.roster : NET.lobby;
  for (let s = 0; s < MAX_PLAYERS; s++) {
    const y = 62 + s * 16, r = list.find(q => q.slot === s);
    ctx.fillStyle = '#000'; ctx.fillRect(50, y - 2, SW - 100, 13);
    ctx.fillStyle = r ? PCOLORS[s].css : '#2c2a34'; ctx.fillRect(52, y, 9, 9);
    if (r) { ctx.drawImage(faceFrame(s, 0, 0, 'normal').cv, 0, 0, 26, 30, 64, y - 1, 10, 11); text(r.name + (r.id === ME ? ' (YOU)' : '') + (r.id === 'h' ? '  HOST' : ''), 78, y + 2, '#fff'); }
    else text('OPEN SLOT', 78, y + 2, '#585864');
  }
  tinyC(host ? 'FRIENDS CAN ALSO DROP IN AFTER YOU START' : 'WAITING FOR THE HOST TO START...', SW / 2, 130, host ? '#8cdc3c' : (Math.floor(performance.now() / 500) % 2 ? '#fff' : '#8c84b0'));
  drawMenu(SW / 2, 142, 110, 12);
}
function drawNotice() {
  panel(20, 40, SW - 40, 100);
  const lines = wrapText(noticeMsg, 34);
  lines.forEach((l, i) => textC(l, SW / 2, 56 + i * 10, mode === 'connecting' ? '#fff' : '#fcd838'));
  if (mode === 'connecting') textC('.'.repeat(1 + (Math.floor(performance.now() / 300) % 3)), SW / 2, 56 + lines.length * 10 + 4, '#fff');
  drawMenu(SW / 2, 120, 80);
}

/* ---------------------------------------------------------------- the frame */
function renderPlay(me) {
  if (me) updateCamera(me);
  const mp = me || G.players[0];
  setGateGlow(G.toSpawn.length > 0 && Math.floor(G.t * 2) % 2 === 0);
  if (mp) {
    const c = M.cells[M.C[1] * MW + M.C[0]];
    if (c) c.texX = c.texY = mp.chestUsed ? ART.machines.chestOpen : ART.machines.chest;
    paintVending(PERKS[mp.perkOffer].id);
  }
  renderView(CAM);
  drawWorldSprites(mp);
  blitView();
  if (me) {
    drawGunView(me);
    drawViewOverlays(me);
  }
  drawStatusBar(me);
  musicRound = G.round;
  if (FX.swapOpen && me) drawSwap(me);
  if (keys.Tab && !paused) drawTab(me);
  if (G.over) drawOver(me);
  if (paused) drawPause();
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(0, 0, SW, VH);
  if (pauseScreen === 'help') { drawHelp(); return; }
  panel(48, 30, 160, 112);
  textC(pauseScreen === 'settings' ? 'SETTINGS' : 'PAUSED', SW / 2, 40, '#fcd838', 2);
  if (pauseScreen === 'main' && NET.mode !== 'off') tinyC('ROOM ' + NET.code + ' - THE GAME KEEPS RUNNING', SW / 2, 58, '#8c84b0');
  drawMenu(SW / 2, pauseScreen === 'settings' ? 62 : 70, 150, pauseScreen === 'settings' ? 12 : 14);
}
function playFrame(dt) {
  const me = meP();
  const online = NET.mode !== 'off';
  if (G.over) {
    if (NET.mode !== 'guest' && G.over.t > 1 && (pressed.Enter || pressed.Space || mouse.leftP)) {
      const roster = G.players.map(p => ({ id: p.id, name: p.name, slot: p.slot }));
      startGame(roster); return;
    }
    if (pressed.Escape) { quitToTitle(); return; }
  } else if ((pressed.Escape || pressed.KeyP) && !FX.swapOpen && performance.now() - unlockT > 350) {
    if (paused) { if (pauseScreen === 'main') { paused = false; requestLock(); } else { pauseScreen = 'main'; setPauseMenu(); } }
    else { paused = true; pauseScreen = 'main'; setPauseMenu(); releaseLock(); }
  }
  if (paused) menuInput();
  const allowed = !!me && !paused && !G.over;
  const acts = readInput(dt, allowed);
  if (me && me.state !== 'dead' && allowed) me.a = viewAngle;
  if (NET.mode === 'guest') {
    if (me && allowed) movePlayer(me, INP, dt);
    for (const a of acts) NET.acts.push(a);
    guestStep(dt);
    guestNetTick(dt, me);
  } else {
    if (me) {
      if (allowed) movePlayer(me, INP, dt);
      me.inp.fire = INP.fire; me.inp.sprint = INP.sprint; me.inp.use = INP.use;
      for (const a of acts) me.acts.push(a);
    }
    if (!(!online && (paused || FX.swapOpen))) hostStep(dt);
    hostNetTick(dt);
  }
  if (me) updateVM(dt, me, allowed ? acts : []);
  if (!(!online && paused)) clientUpdate(dt);
  if (mode === 'play' && G) renderPlay(me);
}
function menuFrame(dt) {
  if (mode === 'name' || mode === 'join') {
    fieldInput();
    if (pressed.Enter) { if (mode === 'name') nameDone(); else joinDone(); return; }
    if (pressed.Escape) { toTitle(); return; }
  } else {
    if (pressed.Escape && mode !== 'title') { if (mode === 'lobby' || mode === 'connecting') quitToTitle(); else toTitle(); return; }
    menuInput();
  }
  if (mode === 'lobby' && NET.mode === 'host') hostNetTick(dt);
  attractFrame(dt, mode === 'title' ? 0.45 : 0.7);
  if (mode === 'title') drawTitle();
  else if (mode === 'help') drawHelp();
  else if (mode === 'settings') { panel(40, 26, 176, 120); textC('SETTINGS', SW / 2, 36, '#fcd838', 2); drawMenu(SW / 2, 58, 166, 13); }
  else if (mode === 'name') { panel(30, 40, SW - 60, 100); textC(joinIntent === 'host' ? 'HOST CO-OP' : 'JOIN CO-OP', SW / 2, 50, '#fcd838', 2); drawField('YOUR NAME', 70); drawMenu(SW / 2, 104, 100, 12); }
  else if (mode === 'join') { panel(30, 40, SW - 60, 100); textC('JOIN CO-OP', SW / 2, 50, '#fcd838', 2); drawField('ROOM CODE FROM THE HOST', 68, true); drawMenu(SW / 2, 110, 100, 12); }
  else if (mode === 'lobby') drawLobby();
  else if (mode === 'notice' || mode === 'connecting') drawNotice();
}
let lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  try {
    if (mode === 'play' && G) playFrame(dt);
    else if (mode !== 'boot') menuFrame(dt);
  } catch (e) { console.error(e); window.__lastErr = e.stack || String(e); }
  for (const k in pressed) delete pressed[k];
  typed.length = 0;
  mouse.leftP = mouse.rightP = false; mouse.wheel = 0;
  requestAnimationFrame(frame);
}
/* keep a host's game running for guests while its tab is in the background */
let bgWorker = null;
function startBgTicker() {
  if (bgWorker) return;
  try {
    bgWorker = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},33)'], { type: 'text/javascript' })));
    bgWorker.onmessage = () => {
      if (!document.hidden || NET.mode !== 'host') return;
      if (mode === 'play' && G) { const me = meP(); if (me) { me.inp.fire = false; me.inp.use = false; } hostStep(1 / 30); hostNetTick(1 / 30); }
      else if (mode === 'lobby') hostNetTick(1 / 30);
    };
    bgWorker.addEventListener('message', () => { if (document.hidden && NET.mode === 'guest' && mode === 'play') guestNetTick(1 / 30, meP()); });
  } catch (e) { bgWorker = null; }
}
function boot() {
  fit();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, SW, SH);
  text('LOADING...', 100, 106, '#e43828');
  const img = new Image();
  img.onload = () => {
    setTimeout(() => {
      buildArt(img);
      setDetail(settings.detail);
      startBgTicker();
      toTitle();
      requestAnimationFrame(frame);
    }, 20);
  };
  img.src = window.GR_ATLAS;
}
/* hooks for automated testing */
window.__GR3D = {
  get G() { return G; }, get M() { return M; }, get mode() { return mode; }, set mode(v) { mode = v; }, get NET() { return NET; }, get FX() { return FX; }, get ME() { return ME; },
  keys, pressed, mouse, startSolo, startGame, hostStep, renderView, setDetail, buildMap, spawnZombie, startRound, startMap, viewArt, CAM, R, VM, INP,
  setView(a) { viewAngle = a; }, setIntent(v) { joinIntent = v; },
  gallery(i, x, y, a, zs) {
    M = buildMap(i); CAM.x = x; CAM.y = y; CAM.a = a; CAM.z = 0.45; CAM.bob = 0;
    renderView(CAM);
    for (const s of M.statics) drawSprite(s.spr, s.x, s.y, s.z);
    const list = (zs || []).map(z => ({ z, d: (z[1] - R.px) * R.dirX + (z[2] - R.py) * R.dirY })).sort((p, q) => q.d - p.d);
    for (const s of list) drawSprite(ART.z[s.z[0]][s.z[3] || 'w0'], s.z[1], s.z[2], 0);
    blitView(); ctx.drawImage(ART.bar, 0, BAR_Y);
    return M.name;
  }, toTitle, toName, nameDone, joinDone, toLobby, FIELD_IN, settings, meP, quitToTitle, MENU,
};
boot();


})();
