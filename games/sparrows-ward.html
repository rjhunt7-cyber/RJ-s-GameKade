<script>
'use strict';
/* ===== SPARROW'S WARD — core, input, audio ===== */
const W=256,H=224,TS=16,SW=16,SH=12,HUD=32;

cv.width=W;cv.height=H;

const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function hsh(x,y,s){let h=(x*374761393+y*668265263+(s|0)*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}

/* ---------- input (rebindable + gamepad) ---------- */
const keys={},pressed={},hard={},kb={},pad={},padHeld={};

const PRESETS=[
 {name:'WASD + Space',b:{u:['KeyW'],d:['KeyS'],l:['KeyA'],r:['KeyD'],a:['Space','KeyJ'],b:['KeyK','KeyX'],c:['KeyL','KeyC'],g:['KeyV','KeyH'],x:['KeyF'],m:['KeyR'],q:['KeyQ'],e:['KeyE'],dash:['ShiftLeft','ShiftRight'],s:['Enter','Escape','KeyP']}},
 {name:'Arrows + Z X C (SNES pad)',b:{u:['ArrowUp'],d:['ArrowDown'],l:['ArrowLeft'],r:['ArrowRight'],a:['KeyZ'],b:['KeyX'],c:['KeyC'],g:['KeyA'],x:['KeyS'],m:['KeyD'],q:['KeyQ'],e:['KeyW'],dash:['ShiftLeft','ShiftRight'],s:['Enter','Escape']}},
 {name:'Arrows + Space (one hand)',b:{u:['ArrowUp'],d:['ArrowDown'],l:['ArrowLeft'],r:['ArrowRight'],a:['Space'],b:['KeyX'],c:['KeyC'],g:['KeyV'],x:['KeyB'],m:['KeyN'],q:['KeyZ'],e:['KeyM'],dash:['ShiftLeft','ShiftRight'],s:['Enter','Escape']}},
 {name:'IJKL + ASDF (lefty)',b:{u:['KeyI'],d:['KeyK'],l:['KeyJ'],r:['KeyL'],a:['KeyD','Space'],b:['KeyS'],c:['KeyA'],g:['KeyF'],x:['KeyG'],m:['KeyR'],q:['KeyQ'],e:['KeyE'],dash:['ShiftLeft','ShiftRight'],s:['Enter','Escape']}}
];
let BINDS=null,CODEMAP={},presetIdx=0;
function cloneBinds(b){const o={};for(const k in b)o[k]=b[k].slice();return o;}
function rebuildMap(){CODEMAP={};for(const a in BINDS)for(const c of BINDS[a])CODEMAP[c]=a;}
function loadBinds(){try{const s=JSON.parse(localStorage.getItem('sw_binds_v2'));if(s&&s.b){BINDS=s.b;presetIdx=s.p||0;for(const[a]of ACTIONS)if(!BINDS[a])BINDS[a]=PRESETS[0].b[a].slice();rebuildMap();return;}}catch(e){}BINDS=cloneBinds(PRESETS[0].b);presetIdx=0;rebuildMap();}
function saveBinds(){try{localStorage.setItem('sw_binds_v2',JSON.stringify({b:BINDS,p:presetIdx}));}catch(e){}}
function applyPreset(i){presetIdx=(i+PRESETS.length)%PRESETS.length;BINDS=cloneBinds(PRESETS[presetIdx].b);rebuildMap();saveBinds();}
loadBinds();
const REBIND={on:false,action:null,done:null};
const HARD={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',Enter:'a',Space:'a',Escape:'s',Backspace:'s'};

addEventListener('keydown',e=>{

let padName='';
function pollPad(){

(function touch(){

const N=k=>pressed[k]||hard[k];

/* ---------- audio ---------- */
let AC=null,master,sfxBus,musOut,echo,curBus=null,noiseBuf,musVol=.8,sfxVol=1,muted=false,pendingMusic=null;
function audioInit(){

  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  sfxBus=AC.createGain();sfxBus.gain.value=.9;sfxBus.connect(master);
  musOut=AC.createGain();musOut.gain.value=.5*musVol;musOut.connect(master);
  echo=AC.createDelay(1);echo.delayTime.value=.19;const fb=AC.createGain();fb.gain.value=.28;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;

}
function setVolumes(){if(!AC)return;musOut.gain.value=muted?0:.5*musVol;sfxBus.gain.value=muted?0:.9*sfxVol;}
function beep(f,d,type,v,f2,dl){if(!AC)return;type=type||'square';v=v==null?.14:v;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d+.03);}

const SFX={

  beam:()=>{beep(900,.2,'square',.07,300)},
  hit:()=>{nz(.1,.2,1500);beep(160,.1,'square',.1,60)},
  kill:()=>{nz(.2,.2,1200);beep(300,.2,'square',.1,50)},
  hurt:()=>{beep(220,.25,'sawtooth',.16,70);nz(.15,.15,900)},
  crown:()=>{beep(988,.07,'square',.09);beep(1319,.14,'square',.09,null,.07)},
  heart:()=>{beep(660,.08,'triangle',.18);beep(880,.08,'triangle',.18,null,.08);beep(1100,.12,'triangle',.18,null,.16)},
  key:()=>{[784,988,1175,1568].forEach((f,i)=>beep(f,.1,'square',.09,null,i*.07))},
  chest:()=>{[262,330,392,523].forEach((f,i)=>beep(f,.16,'square',.1,null,i*.1))},
  door:()=>{nz(.3,.25,500);beep(90,.3,'square',.1,50)},
  secret:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.12,'square',.09,null,i*.08))},
  text:()=>{beep(520+Math.random()*60,.03,'square',.03)},
  bomb:()=>{nz(.5,.4,900);beep(80,.4,'sawtooth',.2,30)},
  fuse:()=>{nz(.2,.05,6000)},
  arrow:()=>{beep(700,.12,'triangle',.1,300);nz(.06,.06,5000)},
  boom:()=>{beep(500,.1,'triangle',.07,700)},
  fire:()=>{nz(.25,.14,1800);beep(200,.2,'sawtooth',.05,400)},
  menu:()=>{beep(660,.04,'square',.07)},
  select:()=>{beep(880,.06,'square',.08);beep(1320,.08,'square',.08,null,.06)},
  err:()=>{beep(140,.15,'square',.1)},
  fall:()=>{beep(600,.5,'triangle',.12,60)},
  bossdie:()=>{for(let i=0;i<10;i++){nz(.25,.25,800+i*200,i*.12);beep(300-i*20,.2,'square',.08,40,i*.12)}},
  horn:()=>{beep(196,.7,'sawtooth',.12);beep(294,.7,'sawtooth',.1,null,.0);beep(392,.9,'square',.06,null,.3)},
  warp:()=>{beep(200,.4,'sine',.1,1200)},
  roar:()=>{nz(.7,.35,500);beep(70,.7,'sawtooth',.18,40)},
  zap:()=>{beep(1200,.15,'sawtooth',.07,200)},
  guard:()=>{beep(180,.08,'square',.12,120);nz(.06,.15,3500)},
  parry:()=>{beep(1400,.12,'square',.1,2200);beep(900,.2,'triangle',.12,400,.04);nz(.1,.15,6000)},
  roll:()=>{nz(.18,.1,1800);beep(260,.15,'triangle',.05,140)},
  spell1:()=>{[523,659,784,1047,1319].forEach((f,i)=>beep(f,.2,'triangle',.12,null,i*.04));nz(.4,.1,5000)},
  spell2:()=>{beep(300,.25,'sawtooth',.1,1500);nz(.2,.12,3000)},
  spell3:()=>{[392,494,587,784].forEach((f,i)=>beep(f,.25,'sine',.14,null,i*.07))},
  levelup:()=>{[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>beep(f,.16,'square',.1,null,i*.07))},
  buy:()=>{beep(880,.05,'square',.08);beep(1320,.05,'square',.08,null,.05);beep(1760,.1,'square',.08,null,.1)},
  sell:()=>{beep(1760,.05,'square',.08);beep(1320,.05,'square',.08,null,.05);beep(880,.1,'square',.08,null,.1)},
  bash:()=>{nz(.12,.3,700);beep(120,.15,'square',.12,60)},

function sfx(n){try{if(SFX[n])SFX[n]();}catch(e){}}
function jingle(notes,type,v){if(!AC)return;let t=0;const bus=curBus;if(bus){bus.gain.cancelScheduledValues(AC.currentTime);bus.gain.setTargetAtTime(.12,AC.currentTime,.05);}
  for(const [m,b] of notes){if(m>0)beep(440*Math.pow(2,(m-69)/12),b*.5+.05,type||'square',v||.12,null,t);t+=b*.5;}
  if(bus)bus.gain.setTargetAtTime(1,AC.currentTime+t+.2,.2);}
const JING={
  item:[[72,.5],[76,.5],[79,.5],[84,1.5],[0,.4],[79,.5],[84,2]],
  small:[[76,.4],[79,.4],[84,1]],
  heart:[[67,.4],[72,.4],[76,.4],[79,.4],[84,1.4]],
  boss:[[60,.4],[64,.4],[67,.4],[72,.8],[67,.4],[72,.4],[76,.4],[79,.4],[84,2]],
  secret:[[79,.3],[76,.3],[72,.3],[79,.3],[84,1]],
  shard:[[60,.4],[67,.4],[72,.4],[76,.4],[79,.4],[84,.4],[88,.4],[91,2.2]]
};

/* ---------- procedural music ---------- */
const MODES={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],phr:[0,1,3,5,7,8,10],lyd:[0,2,4,6,7,9,11],mix:[0,2,4,5,7,9,10],harm:[0,2,3,5,7,8,11]};
const WAVE={sq:'square',tri:'triangle',saw:'sawtooth',sine:'sine'};
const MUS={};
function defTrack(n,o){o.name=n;MUS[n]=o;}
const PATS=[[0,4,8,12],[0,3,6,8,12],[0,2,4,6,8,10,12,14],[0,6,8,14],[0,4,6,8,12,14],[0,3,4,8,10,12],[0,8],[0,2,4,8,10,12],[0,4,7,8,12,15],[0,6,10],[0,4,8,10,12,14]];
function compose(o){
  const R=mulberry(o.seed||1),mode=MODES[o.mode],prog=o.prog,L=prog.length,nb=L*4,dens=o.dens==null?.5:o.dens,steps=[];
  const deg=d=>{const oc=Math.floor(d/7),i=((d%7)+7)%7;return o.root+12*oc+mode[i];};
  for(let i=0;i<nb*16;i++)steps.push([]);
  const mk=()=>{const pool=PATS.filter(p=>Math.abs(p.length/16-dens*.55)<.22);const a=pool.length?pool:PATS;return a[Math.floor(R()*a.length)];};
  const mA=[mk(),mk()],mB=[mk(),mk()];
  let p=o.lo==null?7:o.lo;
  const genBar=(chord,pat,end)=>{const tones=[chord,chord+2,chord+4],out=[];
    pat.forEach((s,i)=>{let n;
      if(s%8===0||i===0){let best=tones[0],bd=99;for(const t of tones)for(const oc of [-7,0,7]){const c=t+oc,dd=Math.abs(c-p);if(dd<bd&&c>=2&&c<=14){bd=dd;best=c;}}n=best;}
      else{n=p+pick2(R,[-2,-1,-1,0,1,1,2]);n=clamp(n,2,14);}
      if(end&&i===pat.length-1)n=chord;
      p=n;const nx=pat[i+1]==null?16:pat[i+1];out.push([s,n,Math.min(nx-s,o.long?12:8)]);});
    return out;};

  const A2=A.slice(0,L-1);A2.push(genBar(prog[L-1],mA[1],true));
  const B=[];for(let b=0;b<L;b++)B.push(genBar(prog[(b+(o.bs||1))%L],mB[b%2],b===L-1));
  const secs=[A,A2,B,A];
  for(let b=0;b<nb;b++){
    const sec=Math.floor(b/L),bi=b%L,base=b*16,chord=prog[sec===2?(bi+(o.bs||1))%L:bi];

    if(o.bass===1){steps[base].push({v:'bass',m:bm,d:6});steps[base+8].push({v:'bass',m:bm,d:4});steps[base+12].push({v:'bass',m:deg(chord-7+4),d:3});}
    else if(o.bass===2){for(let s=0;s<16;s+=2)steps[base+s].push({v:'bass',m:s%8===6?deg(chord-7+4):bm,d:2});}
    else if(o.bass===3){for(let s=0;s<16;s+=1)if(s%4!==3)steps[base+s].push({v:'bass',m:s%4===2?bm+12:bm,d:1});}
    const dr=o.drums||0;
    if(dr>=1){steps[base].push({v:'k'});steps[base+8].push({v:'k'});if(dr>=1)steps[base+4].push({v:'h'}),steps[base+12].push({v:'h'});}
    if(dr>=2){steps[base+4].push({v:'s'});steps[base+12].push({v:'s'});for(let s=2;s<16;s+=4)steps[base+s].push({v:'h',o:1});}
    if(dr>=3){steps[base+6].push({v:'k'});steps[base+10].push({v:'k'});for(let s=1;s<16;s+=2)steps[base+s].push({v:'h',o:1});}

function pick2(R,a){return a[Math.floor(R()*a.length)];}
let curTrack=null,curName='',stepN=0,nextT=0;
function playMusic(name){
  if(name===curName)return;curName=name;
  if(!AC){pendingMusic=name;return;}
  if(curBus){const ob=curBus;ob.gain.cancelScheduledValues(AC.currentTime);ob.gain.setTargetAtTime(0,AC.currentTime,.12);setTimeout(()=>{try{ob.disconnect()}catch(e){}},900);curBus=null;}
  const o=MUS[name];if(!o){curTrack=null;return;}
  if(!o._c)o._c=compose(o);
  curTrack=o;stepN=0;nextT=AC.currentTime+.12;
  curBus=AC.createGain();curBus.gain.value=0;curBus.gain.setTargetAtTime(1,AC.currentTime+.1,.15);curBus.connect(musOut);
}
function stopMusic(){curName='';curTrack=null;if(curBus&&AC){const ob=curBus;ob.gain.setTargetAtTime(0,AC.currentTime,.1);setTimeout(()=>{try{ob.disconnect()}catch(e){}},700);curBus=null;}}
function musicTick(){
  if(!AC||!curTrack||!curBus)return;
  const o=curTrack,sd=60/o.bpm/4;
  let guard=0;
  while(nextT<AC.currentTime+.18&&guard++<8){
    const evs=o._c[stepN%o._c.length],t=nextT+((stepN%2)?(o.swing||0)*sd:0);
    for(const e of evs)playEv(e,t,sd,o);
    nextT+=sd;stepN++;
  }
  if(nextT<AC.currentTime-.5)nextT=AC.currentTime+.05;
}
function mnote(f,t,dur,type,vol,send,att){

function dungeonRoom(dk,x,y,state){

  const put=l=>{for(const[tt,a,b,w,h]of l)for(let j=0;j<h;j++)for(let i=0;i<w;i++)t[(b+j)*16+a+i]=tt;};
  let ptype=null;

  const info={kind,ptype,dark:!!(D.dark&&(kind==='d'||(D.dark&&rr()<.0&&false))),enemies:0,chest:null,miniboss:null,boss:null};
  if(kind==='d'||(D.dark&&kind==='n'&&((x+y)%2===0)))info.dark=!!D.dark;
  if(ptype)put(PUZ_T[ptype]);
  else if(kind==='B'){put([[PIL,3,3,1,1],[PIL,12,3,1,1],[PIL,3,8,1,1],[PIL,12,8,1,1]]);}
  else if(kind==='I'){put([[TOL,3,3,1,1],[TOL,12,3,1,1],[TOL,3,8,1,1],[TOL,12,8,1,1],[CPT,6,4,4,4]]);}
  else if(kind==='h'){put([[PIT,2,3,12,1],[PIT,2,8,12,1],[CPT,6,4,4,4]]);}
  else if(kind==='m'||kind==='M')put([[PIL,3,3,1,1],[PIL,12,3,1,1],[PIL,3,8,1,1],[PIL,12,8,1,1]]);
  else if(kind==='S')put([[PIL,4,3,1,1],[PIL,11,3,1,1]]);
  else put(TEMPL[Math.floor(rr()*TEMPL.length)]);
  // special per theme decoration
  if(D.th==='fort'&&kind==='n'&&rr()<.5)put([[LAV,6,5,4,2]]);
  if(D.th==='mines'&&kind==='n'&&rr()<.4)put([[LAV,2,5,4,1],[LAV,10,6,4,1]]);
  if(D.th==='hollow'&&(kind==='n'||kind==='d')&&rr()<.5)put([[WEB,6,5,4,1]]);
  if(D.th==='mines'&&kind==='n'&&rr()<.3)put([[ORE,13,2,1,1]]);
  // doors
  const door=(dx,dy,nx,ny,tiles)=>{
    const nk=dCell(dk,nx,ny);if(!nk)return;
    let tt=FLR;
    const locked=['L','M','I'].includes(nk),bossd=nk==='B';
    const here=kind;
    if(locked&&!(state&&state.unlocked&&state.unlocked[dk+':'+nx+','+ny]))tt=LCK;
    else if(bossd&&!(state&&state.unlocked&&state.unlocked[dk+':'+nx+','+ny]))tt=BDR;
    for(const[a,b]of tiles)t[b*16+a]=tt;
    // the room we are in being locked: opening from inside is also via same door state
    if(['L','M','I','B'].includes(here)&&tt===FLR){}
  };
  door(0,0,x,y-1,[[7,0],[8,0]]);door(0,0,x,y+1,[[7,11],[8,11]]);door(0,0,x-1,y,[[0,5],[0,6]]);door(0,0,x+1,y,[[15,5],[15,6]]);
  if(kind==='S'){t[11*16+7]=ST;t[11*16+8]=ST;}
  return{tiles:t,info};
}

const LORE=[
 {id:'song',t:'The Song of Seven',x:'Seven Wardens stood on the Hollow Hill when the sky split, and each sang one note of the Ward. Their voices did not fit, yet they held. That is the secret the schoolbooks leave out: the Ward was never a harmony. It was seven stubborn people refusing to stop.'},
 {id:'seventh',t:'The Seventh Voice',x:'Vorthane sang lowest and longest. When the song was done he asked why the Ward should be shared, when his note alone held up the wall. The others said nothing. In the morning his seat on the Hill stood empty and the beacon of Cindermaw was lit.'},
 {id:'sunder',t:'The Sundering',x:'He took the notes of his own voice and tried to forge a second Ward, with himself for its door. It broke the mountain. The Six sealed him beneath the fire and scattered his stolen song into five shards. Five hard places keep them now.'},
 {id:'shards',t:'On the Shards',x:'Each shard sings a virtue. Vigil, for the one who kept watch. Thorn, for the one who endured. Tide, for the one who forgave. Stone, for the one who built. Frost, for the one who waited. The sixth virtue is carried not in stone but in blood.'},
 {id:'vow',t:'The Sparrow Vow',x:'A Sparrow Knight gives up face and name at the Vow, so that no enemy may threaten a mother or a child by a name. The helm is sealed. The knight guards the singer and nothing else. It is a lonely oath, and the Order has always known it.'},
 {id:'wrens',t:"Wren's Line",x:'The singers always come from small places. A miller\'s daughter, a goatherd, a girl who feeds geese. They hum without knowing why. The old Wardens hid the line among the humble, because the proud are too easy to find.'},
 {id:'ballad',t:'Ballad of the Sparrow',x:'Small bird, small bird, why do you stay? Because the wall needs one who is awake. When dawn comes the great birds fly. The sparrow was singing before them, and long after.'},
 {id:'gran',t:"Gran Elspeth's Diary",x:'Wren hums when the wind turns. I hummed it too, and my mother before. I never knew the words. Today the old knight at the well looked at me like a window he had waited years to look through. I gave him bread. He did not eat it. He only held it.'},
 {id:'karrak',t:'Lament of Karrak-Zul',x:'We dug too greedy and too deep, and woke the thing that sleeps beneath the roots. The Cinderfiend is no beast. It is Vorthane\'s first anger, given legs. We sealed the Delve and sang the Stonekin dirge. Only the ore remembers us.'},
 {id:'almanac',t:"Dunstan's Almanac",x:'Flour prices: good. Geese: loud. The Elder says the moor wights are restless again. I say they have always been restless; they merely have a better bard now. (Note to self: stop reading the bard\'s pamphlets before bed.)'},
 {id:'tide',t:'Lanthari Tide-Song',x:'The Temple of Mirewater was a house of forgiveness. When the Ashen came, the Lanthari did not fight. They flooded the halls and let the water keep the shard. The drake that guards it was once a temple priest, a very long time ago.'},
 {id:'frost',t:'Rimespire Record',x:'Ysmera, the Waiting Warden, climbed the Rimespire to be nearer the stars and farther from grief. She waits still. The cold keeps her. Do not mistake patience for peace; she has had four hundred winters to decide what she thinks of the living.'}
];

  yield say('Vorthane','Sparrow. They told me the last of your Order was a rumour. You are very loud, for a rumour.');
  yield say('Wren','(Far away, faint through the stones) Sparrow! Do not let him use the song!');
  yield say('Vorthane','Four hundred years I sang the low note, and the Six rewarded me with a tomb. Your little wall is on loan from me, knight. I have come to collect.');
  yield say('','He rises. The torches go out one by one, and then come back, red.');
  spawnBoss();
}
function* endingScript(){

  sceneOn('cell');playMusic('sad');yield fw(0);
  yield say('','The armour of Vorthane falls apart like ash in the wind. The red light behind its visor gutters... and goes out.');
  yield say('Vorthane','...the low note... was always... meant to be... shared.');
  yield fw(1);sceneOff();yield fw(0);
  P.x=120;P.y=130;P.dir=1;
  const wren={x:112,y:36,look:LK.wren,noTalk:1,still:1};NP=[wren];
  playMusic('wren');
  yield say('Wren','You came. Through the Wyrdwood, the Deepdelve, the frost... all of it. Of course you did.');
  for(let i=0;i<60;i++){wren.y+=1.1;yield wf(1);}
  yield say('Wren','Everyone told me the Sparrow Knight had no face. That nobody had ever seen it. I told them it did not matter.');
  yield say('Wren','May I?');
  yield say('','Her hand lifts toward your visor... and stops, a breath away. You do not move. She smiles.');
  yield say('Wren','No. Keep it. I knew you by your steady hands, and by the way you waited outside my door in the snow. I know who you are.');
  yield say('','She takes your gauntleted hand in both of hers. Far above, the shards of the Ward sing, and the dark over the valley begins to lift.');
  yield* cut('dawn',function*(){
    playMusic('victory');
    yield wf(40);
    yield say('','The Sparrow\'s Ward holds once more. Not a wall of one voice, but a song of many: Wren, humming; the Hollowfolk, joining in; the geese, loud and out of tune.');
    yield say('','In Thistledown the bread is warm and the post by the well is never empty. A certain knight is seen walking a certain girl home each evening.');
    yield say('','He never takes off the helm. She never asks again.');});
  autoSave();mode='credits';credT=0;playMusic('credits');
}

function spawnNPCs(){
  NP=[];const defs=NPCS[A.key];if(!defs)return;if(A.key==='ow:2,4'&&!S.flags.prologue)return;
  for(const d of defs){if(d.if&&!d.if())continue;let x=d.x*16,y=d.y*16;if(A.type==='ow'&&!d.draw)[x,y]=nearFree(x,y);
    NP.push(Object.assign({w:12,h:12,face:0,home:[x,y]},d,{x,y,talk:d.talk}));}
}
function nearFree(x,y){for(let r=0;r<6;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const tx=Math.floor(x/16)+dx,ty=Math.floor(y/16)+dy;if(tx<1||ty<1||tx>14||ty>10)continue;const t=tileAt(tx,ty);if(!SOLID.has(t)&&t!==WA&&t!==PIT&&t!==LAV&&t!==ST&&t!==HD)return[tx*16,ty*16];}return[x,y];}
function updNPCs(){
  for(const n of NP){if(!n.wander||n.noTalk)continue;n.t=(n.t||0)+1;
    if(n.t%100===0){n.dx=rnd()<.5?0:(rnd()<.5?-.4:.4);n.dy=rnd()<.5?0:(rnd()<.5?-.4:.4);}
    if(n.t%100<30&&(n.dx||n.dy)){const ox=n.x,oy=n.y,nx=n.x+n.dx,ny=n.y+n.dy;
      if(!boxBlocked(nx+2,n.y+4,12,10,false,false)&&Math.abs(nx-n.home[0])<30)n.x=nx;if(!boxBlocked(n.x+2,ny+4,12,10,false,false)&&Math.abs(ny-n.home[1])<30)n.y=ny;
      if(ov(pbox(P.x,P.y),{x:n.x+2,y:n.y+4,w:12,h:10})){n.x=ox;n.y=oy;}}}
}

function* ruckTalk(){

  S.flags.ruck=(S.flags.ruck||0)+1;yield say('Gaffer Ruck',tales[(S.flags.ruck-1)%3]);

function* ruskTalk(){

    const r=RES;if(r===4||r<0)return;
    if(r===0)yield say('Captain Rusk','Hold ['+Gk+'] to raise your shield. It stops blows and arrows from the front. Tap it just as a blow lands and you PARRY: the foe reels, and arrows fly back at their owner. Strike while guarding and you bash, and stun.');
    else if(r===1)yield say('Captain Rusk','Press ['+Xk+'] to roll. You cannot be hurt mid-roll. Slip past big swings, jump the shockwaves, and get out of corners. A good knight rolls more than he swings.');

}
function* orlaTalk(){

  yield say('Widow Orla',pick(['I lost a husband to the moor wights. Mind you, he was going to leave me for the hermit anyway.','There is a hollow in the hills where the dwarves sealed away something they would not name. If I were a knight, I would not name it either.','The bell in Brindlemere rang itself last night. Nobody had touched the rope.']));
}
function* aldricTalk(){

    yield say('Lord Aldric','Knight of the Sparrow. I thought you gone, like the others. Sit... no. You will not, will you. Very well.');
    yield say('Lord Aldric','Three nights ago the Cinder Wraiths crossed the Ward. Wren of Thistledown is no ordinary girl. In her blood runs the Ward-song, sung by the first Wardens. With it, the Ashen Lord Vorthane can unmake the barrier for good.');
    yield say('Lord Aldric','Cindermaw\'s gate is sealed by five shards of the Ward, each in the keeping of an ancient place. Gather them, and the gate will open for you. Mereth the wizard waits at his hut on the moor. Go to him first.');
    yield say('Lord Aldric','And take this. A Sparrow Knight should not walk to war with empty pockets.');S.crowns=Math.min(999,S.crowns+40);sfx('crown');
    S.stage=1;sfx('secret');
  }else if(n===0)yield say('Lord Aldric','Mereth is east, on Cairn Moors. Then the Old Barrow. Do not trust the quiet there. Captain Rusk in the square will teach you to fight properly, if you have not learned.');
  else if(n<3)yield say('Lord Aldric','You carry '+n+' of five. The remaining shards sleep in Wyrdwood Hollow, the Mirewater Temple, Deepdelve and the Rimespire. Stone and frost will want a hammer and powder.');
  else if(n<5){if(!S.flags.aldricGift){S.flags.aldricGift=1;yield say('Lord Aldric','Three shards. I did not think I would live to see three. The tapestries have begun to shiver, you know, as if the Ward were a candle in a draught. Take this from the treasury. It is poor repayment.');S.crowns=Math.min(999,S.crowns+150);sfx('crown');}else yield say('Lord Aldric','Two shards remain. Hurry, Sparrow, but do not run. The last two places are the hardest. I am not allowed to say how I know.');}
  else yield say('Lord Aldric','Go. The gate waits at the end of the Blackmoor road. Bring her home... and yourself, if you can spare it.');
}
function* merethTalk(){
  if(S.stage<2){
    yield* cut('betray',function*(){
      yield say('Mereth','Ah. The Sparrow. I wondered if the old oaths still bound anyone. Sit, sit. I will say this once, because the Ashen are patient and I am not.');
      yield say('Mereth','Seven Wardens sang the Ward. The seventh, Vorthane, wished to sing it alone. When they refused, he burned Cindermaw and tried to forge his own. It broke the mountain.');
      yield say('Mereth','The Six sealed him under the fire, and scattered his stolen song as five shards. Now someone has been waking him, and the thing with the hood has come for the one voice that holds it all together.');
      findLore('sunder');});
    yield say('Mereth','First shard sleeps in the Old Barrow, east of here, where Gorrim the Barrow King has kept a hundred years of vigil... a poor sort of vigil, mind. Take the Sparrow\'s Return from the dead as you go. It is a good tool. Read what you like on my shelves.');

  }else yield say('Mereth',S.flags['boss_d1']?'The shards will not gather themselves. Wyrdwood Hollow west, Mirewater Temple south-east. Deepdelve beyond the cracked rock north-east of the moor.':'The Old Barrow lies on the moor east of here. Gorrim will be at the bottom of it. Do be careful.');
}
function* elowenTalk(){
  if(S.flags.letter&&!S.flags.letterDone){
    S.flags.letterDone=1;yield say('Elowen','A letter from Dunstan? He still writes in that dreadful hand. ...He asks if the barley is ready. It is. And he thanks me for the last shipment. Oh, bless him.');

function* intro(){
  FADE.a=1;FADE.to=1;stopMusic();
  sceneOn('song');playMusic('prologue');yield fw(0);
  yield say('','Before the valley had a name, seven Wardens stood upon the Hollow Hill and sang. Each sang a different note. The notes did not fit, and still the song held, and the song became a wall of light: the Sparrow\'s Ward.');
  yield fw(1);sceneOn('betray');yield fw(0);
  yield say('','The seventh Warden, Vorthane, sang lowest and longest, and grew proud. He wished the wall to bear his name alone. When the Six refused, he burned Cindermaw and tried to forge his own... and broke the mountain.');
  yield say('','The Six sealed him beneath the fire and scattered his stolen song into five shards, hidden in five hard places.');
  yield fw(1);sceneOn('vow');yield fw(0);
  yield say('','The Wardens are gone now. What guards the Ward are the Sparrow Knights, who give up name and face at the Vow, so that no enemy can threaten a mother or a child by a name. There were once a hundred.');
  yield say('','You are the last who keeps the vow. You wear the helm. You do not remove it.');
  yield fw(1);sceneOff();
  yield* prologue();
}
function* prologue(){
  yield say('','Thistledown, at the end of a quiet day. A girl with a braid and a loaf of bread is waiting at the well...');
  yield fw(0);
  const wren={x:128,y:96,look:LK.wren,noTalk:1,still:1};NP.push(wren);
  yield wf(30);
  yield say('Wren','There you are! You walked past my door three times today and never knocked. Silent as ever, Sparrow.');
  yield say('Wren','Here. Warm bread. And... I found this by the well this morning. A sparrow\'s feather. I think it wants to go with you.');
  sfx('chest');
  yield say('','She tucks the feather into the strap of your pauldron. Nobody has ever done that before. You do not know what to do with your hands.');
  playMusic('wren');
  yield say('Wren','Granny used to hum a tune when the wind turned. I do not know the words, but I hum it too. Listen...');
  yield wf(140);
  yield say('Wren','Funny. The geese went quiet. They never go quiet. ...Sparrow? Why are you drawing your sword?');
  stopMusic();sfx('roar');yield wf(40);playMusic('chase');
  const ws=[];for(let i=0;i<3;i++){const w=mkEnemy('wraith',60+i*70,-20);w.scripted=true;w.noContact=true;EN.push(w);ws.push(w);}
  for(let f=0;f<80;f++){ws.forEach((w,i)=>{w.y+=(70+i*5-w.y)*.07;});if(f===40)shake=10;yield wf(1);}
  yield say('Wren','Sparrow!!');
  P.kx=-6;P.ky=0;P.dir=3;sfx('hurt');shake=14;
  for(let f=0;f<30;f++){ws.forEach(w=>{w.x+=(wren.x-w.x)*.08;});yield wf(1);}
  yield say('','You swing, and the blade passes through shadow. Cold hands seize you. The world goes sideways.');
  yield fw(1);stopMusic();EN=[];NP=[];
  yield wf(40);playMusic('sad');
  yield say('','...the geese are shouting. Your helm is full of frost. Where the girl stood there is only a loaf of bread in the dust, and a single dark feather that is not yours.');
  const b={x:96,y:96,look:LK.barnaby,wander:1,talk:barnabyTalk};NP.push(b);S.flags.prologue=1;
  P.x=112;P.y=100;P.dir=0;
  yield fw(0);playMusic('night');
  yield say('Barnaby','You are alive. By the Ward. I saw it all from the mill window, hooded things on wings of smoke... they took her north-east, toward the Ash.');
  yield say('Barnaby','Go to Brindlemere, north up the road. Lord Aldric will know what to do. Find Wren, Sparrow. She is the only one left who can hum the song right.');
  yield say('','[ '+keyHint('u')+keyHint('l')+keyHint('d')+keyHint('r')+' ] move   [ '+keyHint('a')+' ] sword   [ '+keyHint('g')+' ] guard   [ '+keyHint('x')+' ] roll   [ '+keyHint('s')+' ] menu. All keys can be changed in the menu.');
  NP=NP.filter(n=>n!==b);spawnNPCs();playMusic(areaMusic());autoSave();
}
/* ---------- quest list ---------- */
function questLines(){
  const n=sumShards(),L=[];
  const main=S.stage<1?'Speak to Lord Aldric in Brindlemere.':S.stage<2?'Seek Mereth the wizard on Cairn Moors.':!S.flags.boss_d1?'Delve the Old Barrow on Cairn Moors.':n<5?'Gather the five shards ('+n+'/5). Wyrdwood, Mirewater, Deepdelve, Rimespire.':!S.flags.won?'Open the Ward-Gate at Cindermaw. Save Wren.':'The Ward is restored.';
  L.push(['MAIN: Save Wren',main,S.flags.won?'done':'active']);
  L.push(['Lost Hollowlings',S.items.boots?'Done! Boots earned.':S.flags.kidsOn?'Found '+S.kids+'/5.':'Talk to Elder Barnaby.',S.items.boots?'done':S.flags.kidsOn?'active':null]);
  L.push(['Graves of Cairn Moors',S.graves>=4?'Done.':!S.flags.posy?'Talk to Goodwife Posy.':'Laid '+S.graves+'/4 bouquets.',S.graves>=4?'done':S.flags.posy?'active':null]);
  L.push(['Letter for Elowen',S.flags.letterDone?'Done.':!S.flags.letter?'Miller Dunstan in Thistledown.':'Deliver to Elowen, Silverglade.',S.flags.letterDone?'done':S.flags.letter?'active':null]);
  L.push(["Old Hob's Ring",S.flags.ringDone?'Done.':S.flags.ring?'Return it to Hob.':!S.flags.hobQ?'Talk to the fisherman by the lake.':'Behind cracked rock north of the swamp.',S.flags.ringDone?'done':S.flags.hobQ?'active':null]);
  L.push(['Verses of the Ballad',S.flags.bardDone?'Done.':!S.flags.bard?'Talk to Lysander, Gilded Goose.':'Found '+S.verses+'/3.',S.flags.bardDone?'done':S.flags.bard?'active':null]);
  L.push(['Gloomwing Bounty',S.flags.bounty?'Done.':'Bats slain: '+Math.min(10,S.kills.bat||0)+'/10 (Gilded Goose board).',S.flags.bounty?'done':null]);
  L.push(['The Starsteel Blade',S.gear.starsteel?'Done.':'Ore '+(S.mats.ore||0)+'/3. Gruff the smith can forge it.',S.gear.starsteel?'done':null]);
  L.push(['Chronicles of the Ward',Object.keys(S.lore).length+'/'+LORE.length+' found. Read shelves everywhere.',Object.keys(S.lore).length>=LORE.length?'done':'active']);
  L.push(['Pieces of Heart',(S.hpieces%4)+'/4 to next heart ('+S.hpieces+'/8 found)',null]);
  return L;
}
/* ---------- main update ---------- */
function updateGame(){
  S.time++;
  if(flashT>0)flashT--;if(shake>0)shake--;if(toast&&toast.t>0)toast.t--;if(banner&&banner.t>0)banner.t--;
  if(FADE.a!==FADE.to){const d=FADE.to-FADE.a;FADE.a=Math.abs(d)<.03?FADE.to:FADE.a+Math.sign(d)*.03;}
  updAmb();
  if(fade){fade.t++;if(fade.t===20){fade.cb();P.lock=true;}if(fade.t>=40){fade=null;if(!SCR)P.lock=false;}return;}
  if(SHOP.open){updShop();updScript();return;}
  if(TB.open){updText();updScript();updFX();return;}
  if(SCR){updScript();updFX();if(P.kx||P.ky){moveBox(P,P.kx,0,true);moveBox(P,0,P.ky,true);P.kx*=.8;P.ky*=.8;}return;}
  if(trans){updateTrans();return;}
  if(P.dead){P.dead++;updFX();if(P.dead>100){mode='gameover';goSel=0;playMusic('gameover');}return;}
  if(N('s')){openMenu();return;}
  if(pressed.a)usedAction();
  if(pressed.b)useItem();
  if(pressed.c)cycleItem();
  if(!P.lock)playerUpdate();
  if(A.bossIntro>0){A.bossIntro--;if(A.bossIntro===0){if(A.dk==='d6')startScript(vorthaneIntro());else spawnBoss();}}
  for(const e of EN){if(e.dead)continue;if(e.scripted)continue;updEnemy(e);}
  EN=EN.filter(e=>!e.dead);
  updNPCs();updProj();updFX();
  for(const d of DROPS){d.life--;if(ov(pbox(P.x,P.y),{x:d.x-2,y:d.y-2,w:12,h:12})){d.dead=1;
    if(d.t==='heart'){healPlayer(2);sfx('heart');}else if(d.t==='crown'){S.crowns=Math.min(999,S.crowns+1);sfx('crown');}else if(d.t==='crown5'){S.crowns=Math.min(999,S.crowns+5);sfx('crown');}
    else if(d.t==='arrow'){S.arrows=Math.min(60,S.arrows+5);sfx('crown');}else if(d.t==='bomb'){S.bombs=Math.min(30,S.bombs+2);sfx('crown');}
    else if(d.t==='mp'){S.mp=Math.min(S.maxmp,S.mp+3);sfx('mana');}
    else if(d.t==='mat'){S.mats[d.m]=(S.mats[d.m]||0)+1;sfx('crown');banner={t:70,txt:'+1 '+MATS[d.m].n};}}if(d.life<=0)d.dead=1;}
  DROPS=DROPS.filter(d=>!d.dead);
  if(A.type==='dun'&&A.locked&&A.info.kind!=='B'&&!EN.some(e=>!e.dead)){
    const st=S.rooms[A.rk]=S.rooms[A.rk]||{};st.cl=1;openDoors();
    if(A.info.kind==='q'&&A.info.ptype==='wave')solvePuzzle();else placeChest();
    if(A.info.kind==='m'||A.info.kind==='M'){playMusic(A.mus);}}
  if(A.type==='dun'&&(A.info.kind==='m'||A.info.kind==='M')&&EN.some(e=>e.mini||e.t==='haldrax')&&curName!=='miniboss'&&curName!=='haldrax'&&A.locked)playMusic(EN.some(e=>e.t==='haldrax')?'haldrax':'miniboss');
  if(bossBar&&bossBar.dead)bossBar=null;
  if(!bossBar){const b=EN.find(e=>e.boss&&!e.clone&&!e.dead);if(b)bossBar=b;}
  if(S.hp<=2&&S.hp>0&&(tick%100)===0)sfx('menu');
  if(tick%600===0&&A.type==='ow'&&EN.length<2&&rnd()<.3&&!['2,4','2,3','1,3'].includes(A.sx+','+A.sy)){const sp=freeSpot(90);if(sp){EN.push(mkEnemy(pick(OWPOOL[BIO[A.sy][A.sx]].filter(t=>S.stage>=3||!['wraith','brute','hulk'].includes(t))),sp[0],sp[1]));}}
}
function spawnBoss(){
  const t={d1:'gorrim',d2:'skrall',d3:'gloam',d4:'cinderfiend',d5:'ysmera',d6:'vorthane'}[A.dk];
  const e=mkEnemy(t,116,48);e.name=ED[t].name;EN.push(e);bossBar=e;playMusic(A.dk==='d6'?'vorthane':'boss');sfx('roar');banner={t:110,txt:ED[t].name};shake=10;
}
function update(){
  tick++;pollPad();
  if(mode==='title')updateTitle();
  else if(mode==='juke')updateJuke();
  else if(mode==='controls')updateControls();
  else if(mode==='menu')updMenu();
  else if(mode==='credits'){credT++;if(N('s')&&credT>60){mode='title';curName='';playMusic('title');}}
  else if(mode==='gameover'){
    if(N('u')||N('d')){goSel=1-goSel;sfx('menu');}
    if(N('a')||N('s')){sfx('select');
      if(goSel===0){S.hp=S.maxhp;S.mp=S.maxmp;P=newPlayer();const cp=S.cp;loadArea(cp.key);P.x=cp.x;P.y=cp.y;P.sx=P.x;P.sy=P.y;spawnArea();mode='game';showToast();}
      else{mode='title';curName='';playMusic('title');}}
  }
  else updateGame();
  for(const k in pressed)pressed[k]=0;for(const k in hard)hard[k]=0;
}
/* ---------- render ---------- */
function render(){
  ctx.imageSmoothingEnabled=false;
  if(mode==='title'){drawTitle();return;}
  if(mode==='juke'){drawJuke();return;}
  if(mode==='controls'){drawControls();return;}
  if(mode==='credits'){drawCredits();return;}
  if(mode==='gameover'){drawGameOver();return;}
  if(mode==='menu'){drawMenu();return;}
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(SC.on){drawScene(ctx);}
  else{
    ctx.save();ctx.translate(0,HUD);
    if(shake>0)ctx.translate((rnd()*2-1)*shake*.4|0,(rnd()*2-1)*shake*.4|0);
    ctx.beginPath();ctx.rect(0,0,256,192);ctx.clip();
    if(trans){
      const s=trans.t/26,d=trans.dir,oo=[[0,-192*s],[0,192*s],[256*s,0],[-256*s,0]][d],no=[[0,192*(1-s)],[0,-192*(1-s)],[-256*(1-s),0],[256*(1-s),0]][d];
      ctx.drawImage(trans.snap,oo[0]|0,oo[1]|0);drawWorld(ctx,no[0]|0,no[1]|0,true);drawPlayerG(ctx,no[0]|0,no[1]|0);
    }else{drawWorld(ctx,0,0,false);if(A.dark)darknessOverlay(ctx);}
    ctx.restore();
    if(flashT>0){ctx.fillStyle='rgba(255,255,255,'+(flashT/14)+')';ctx.fillRect(0,HUD,W,192);}
    drawHUD();
    if(bossBar&&!bossBar.dead){const w=170,x=43,y=HUD+5;gothFrame(ctx,x-4,y-3,w+8,18,{plain:1});bar(ctx,x,y,w,4,bossBar.hp/bossBar.mhp,['#e03050','#ff8aa0'],'#2a0a14');txt(bossBar.name||'',x+2,y+5,'#ffe8a0','#000');}
    if(toast&&toast.t>0){const a=Math.min(1,toast.t/30);ctx.globalAlpha=a;const w=txtW(toast.txt)+24,x=(W-w)/2|0;gothFrame(ctx,x,HUD+6,w,14,{plain:1});txt(toast.txt,x+12,HUD+8,'#ffe8a0','#000');ctx.globalAlpha=1;}
    if(banner&&banner.t>0){ctx.globalAlpha=Math.min(1,banner.t/20);const w=Math.min(236,txtW(banner.txt)+28),x=(W-w)/2|0;gothFrame(ctx,x,HUD+96,w,20,{plain:1});txt(banner.txt,x+14,HUD+102,'#ffe8a0','#000');ctx.globalAlpha=1;}
  }
  if(FADE.a>0){ctx.fillStyle='rgba(0,0,0,'+FADE.a+')';ctx.fillRect(0,0,W,H);}
  if(fade){const a=fade.t<20?fade.t/20:1-(fade.t-20)/20;ctx.fillStyle='rgba(0,0,0,'+clamp(a,0,1)+')';ctx.fillRect(0,0,W,H);}
  drawShop();drawText();
}
let last=0,acc=0;
function frame(t){const dt=Math.min(100,t-last);last=t;acc+=dt;while(acc>=16.667){update();acc-=16.667;}render();requestAnimationFrame(frame);}
function fitCanvas(){const s=Math.max(1,Math.min(innerWidth/W,innerHeight/H));cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fitCanvas);fitCanvas();
for(const k in OWL){const[x,y]=k.split(',').map(Number);if(!OWL[k].startsWith('d')||!DUN[OWL[k]])INTBACK[OWL[k]]=[x,y];}
requestAnimationFrame(frame);
</script></body></html>
