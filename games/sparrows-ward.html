const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function hsh(x,y,s){let h=(x*374761393+y*668265263+(s|0)*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}

/* ---------- input ---------- */
const keys={},pressed={};
const KM={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'a',KeyJ:'a',KeyZ:'a',KeyX:'b',KeyK:'b',KeyC:'c',KeyL:'c',Enter:'s',KeyP:'s',Escape:'s',ShiftLeft:'dash',ShiftRight:'dash',KeyQ:'q',KeyE:'e'};

  document.body.appendChild(d);

/* ---------- audio ---------- */
let AC=null,master,sfxBus,musOut,echo,curBus=null,noiseBuf,musVol=.8,sfxVol=1,muted=false,pendingMusic=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  sfxBus=AC.createGain();sfxBus.gain.value=.9;sfxBus.connect(master);
  musOut=AC.createGain();musOut.gain.value=.5*musVol;musOut.connect(master);
  echo=AC.createDelay(1);echo.delayTime.value=.19;const fb=AC.createGain();fb.gain.value=.28;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
  echo.connect(lp);lp.connect(fb);fb.connect(echo);lp.connect(musOut);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(musicTick,30);
  if(pendingMusic){const n=pendingMusic;pendingMusic=null;curName='';playMusic(n);}
}
function setVolumes(){if(!AC)return;musOut.gain.value=muted?0:.5*musVol;sfxBus.gain.value=muted?0:.9*sfxVol;}
function beep(f,d,type,v,f2,dl){if(!AC)return;type=type||'square';v=v==null?.14:v;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d+.03);}
function nz(d,v,fr,dl,bus){if(!AC)return;const t=AC.currentTime+(dl||0),s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=fr||2000;g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t,Math.random()*.5);s.stop(t+d+.02);}

function sfx(n){try{if(SFX[n])SFX[n]();}catch(e){}}
function jingle(notes,type,v){if(!AC)return;let t=0;const bus=curBus;if(bus){bus.gain.cancelScheduledValues(AC.currentTime);bus.gain.setTargetAtTime(.12,AC.currentTime,.05);}
  for(const [m,b] of notes){if(m>0)beep(440*Math.pow(2,(m-69)/12),b*.5+.05,type||'square',v||.12,null,t);t+=b*.5;}
  if(bus)bus.gain.setTargetAtTime(1,AC.currentTime+t+.2,.2);}
const JING={
  item:[[72,.5],[76,.5],[79,.5],[84,1.5],[0,.4],[79,.5],[84,2]],
  small:[[76,.4],[79,.4],[84,1]],
  heart:[[67,.4],[72,.4],[76,.4],[79,.4],[84,1.4]],
  boss:[[60,.4],[64,.4],[67,.4],[72,.8],[67,.4],[72,.4],[76,.4],[79,.4],[84,2]],

/* ---------- procedural music ---------- */
const MODES={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],phr:[0,1,3,5,7,8,10],lyd:[0,2,4,6,7,9,11],mix:[0,2,4,5,7,9,10],harm:[0,2,3,5,7,8,11]};
const WAVE={sq:'square',tri:'triangle',saw:'sawtooth',sine:'sine'};
const MUS={};
function defTrack(n,o){o.name=n;MUS[n]=o;}
const PATS=[[0,4,8,12],[0,3,6,8,12],[0,2,4,6,8,10,12,14],[0,6,8,14],[0,4,6,8,12,14],[0,3,4,8,10,12],[0,8],[0,2,4,8,10,12],[0,4,7,8,12,15],[0,6,10],[0,4,8,10,12,14]];
function compose(o){
  const R=mulberry(o.seed||1),mode=MODES[o.mode],prog=o.prog,L=prog.length,nb=L*4,dens=o.dens==null?.5:o.dens,steps=[];
  const deg=d=>{const oc=Math.floor(d/7),i=((d%7)+7)%7;return o.root+12*oc+mode[i];};
  for(let i=0;i<nb*16;i++)steps.push([]);
  const mk=()=>{const pool=PATS.filter(p=>Math.abs(p.length/16-dens*.55)<.22);const a=pool.length?pool:PATS;return a[Math.floor(R()*a.length)];};
  const mA=[mk(),mk()],mB=[mk(),mk()];
  let p=o.lo==null?7:o.lo;
  const genBar=(chord,pat,end)=>{const tones=[chord,chord+2,chord+4],out=[];
    pat.forEach((s,i)=>{let n;
      if(s%8===0||i===0){let best=tones[0],bd=99;for(const t of tones)for(const oc of [-7,0,7]){const c=t+oc,dd=Math.abs(c-p);if(dd<bd&&c>=2&&c<=14){bd=dd;best=c;}}n=best;}
      else{n=p+pick2(R,[-2,-1,-1,0,1,1,2]);n=clamp(n,2,14);}
      if(end&&i===pat.length-1)n=chord;
      p=n;const nx=pat[i+1]==null?16:pat[i+1];out.push([s,n,Math.min(nx-s,o.long?12:8)]);});
    return out;};
  const A=[];for(let b=0;b<L;b++)A.push(genBar(prog[b],mA[b%2],b===L-1));
  const A2=A.slice(0,L-1);A2.push(genBar(prog[L-1],mA[1],true));
  const B=[];for(let b=0;b<L;b++)B.push(genBar(prog[(b+(o.bs||1))%L],mB[b%2],b===L-1));
  const secs=[A,A2,B,A];
  for(let b=0;b<nb;b++){
    const sec=Math.floor(b/L),bi=b%L,base=b*16,chord=prog[sec===2?(bi+(o.bs||1))%L:bi];
    const mel=secs[sec][bi];
    if(!o.nolead)for(const [s,n,d] of mel)steps[base+s].push({v:'lead',m:deg(n),d,vol:sec===2?1:.9});
    const tones=[chord,chord+2,chord+4];
    if(o.arp)for(let s=0;s<16;s+=2)steps[base+s].push({v:'arp',m:deg(tones[[0,1,2,1][(s/2)%4]]),d:2});
    if(o.pad&&!o.arp)steps[base].push({v:'pad',m:deg(tones[0]),m2:deg(tones[1]),m3:deg(tones[2]),d:16});
    const bm=deg(chord-7);
    if(o.bass===1){steps[base].push({v:'bass',m:bm,d:6});steps[base+8].push({v:'bass',m:bm,d:4});steps[base+12].push({v:'bass',m:deg(chord-7+4),d:3});}
    else if(o.bass===2){for(let s=0;s<16;s+=2)steps[base+s].push({v:'bass',m:s%8===6?deg(chord-7+4):bm,d:2});}
    else if(o.bass===3){for(let s=0;s<16;s+=1)if(s%4!==3)steps[base+s].push({v:'bass',m:s%4===2?bm+12:bm,d:1});}
    const dr=o.drums||0;
    if(dr>=1){steps[base].push({v:'k'});steps[base+8].push({v:'k'});if(dr>=1)steps[base+4].push({v:'h'}),steps[base+12].push({v:'h'});}
    if(dr>=2){steps[base+4].push({v:'s'});steps[base+12].push({v:'s'});for(let s=2;s<16;s+=4)steps[base+s].push({v:'h',o:1});}
    if(dr>=3){steps[base+6].push({v:'k'});steps[base+10].push({v:'k'});for(let s=1;s<16;s+=2)steps[base+s].push({v:'h',o:1});}
    if(dr>=4){steps[base+4].push({v:'k'});steps[base+12].push({v:'k'});}
  }
  return steps;
}
function pick2(R,a){return a[Math.floor(R()*a.length)];}
let curTrack=null,curName='',stepN=0,nextT=0;
function playMusic(name){
  if(name===curName)return;curName=name;
  if(!AC){pendingMusic=name;return;}
  if(curBus){const ob=curBus;ob.gain.cancelScheduledValues(AC.currentTime);ob.gain.setTargetAtTime(0,AC.currentTime,.12);setTimeout(()=>{try{ob.disconnect()}catch(e){}},900);curBus=null;}
  const o=MUS[name];if(!o){curTrack=null;return;}
  if(!o._c)o._c=compose(o);
  curTrack=o;stepN=0;nextT=AC.currentTime+.12;
  curBus=AC.createGain();curBus.gain.value=0;curBus.gain.setTargetAtTime(1,AC.currentTime+.1,.15);curBus.connect(musOut);
}
function stopMusic(){curName='';curTrack=null;if(curBus&&AC){const ob=curBus;ob.gain.setTargetAtTime(0,AC.currentTime,.1);setTimeout(()=>{try{ob.disconnect()}catch(e){}},700);curBus=null;}}
function musicTick(){
  if(!AC||!curTrack||!curBus)return;
  const o=curTrack,sd=60/o.bpm/4;
  let guard=0;
  while(nextT<AC.currentTime+.18&&guard++<8){
    const evs=o._c[stepN%o._c.length],t=nextT+((stepN%2)?(o.swing||0)*sd:0);
    for(const e of evs)playEv(e,t,sd,o);
    nextT+=sd;stepN++;
  }
  if(nextT<AC.currentTime-.5)nextT=AC.currentTime+.05;
}
function mnote(f,t,dur,type,vol,send,att){
  const os=AC.createOscillator(),g=AC.createGain();os.type=type;os.frequency.value=f;
  const a=att||.006;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.setTargetAtTime(vol*.55,t+a,.08);g.gain.setTargetAtTime(0,t+dur*.92,.03);
  os.connect(g);g.connect(curBus);if(send){const s=AC.createGain();s.gain.value=send;g.connect(s);s.connect(echo);}
  os.start(t);os.stop(t+dur+.2);
}
function playEv(e,t,sd,o){
  const fq=m=>440*Math.pow(2,(m-69)/12),dur=(e.d||1)*sd;
  switch(e.v){
    case'lead':mnote(fq(e.m),t,dur,WAVE[o.lead||'sq'],.13*(e.vol||1)*(o.lv||1),.35);break;
    case'arp':mnote(fq(e.m-12),t,dur,'triangle',.07,.2);break;
    case'pad':mnote(fq(e.m-12),t,dur,'sine',.06,.3,.15);mnote(fq(e.m2-12),t,dur,'sine',.05,.3,.15);mnote(fq(e.m3-12),t,dur,'sine',.05,.3,.15);break;
    case'bass':mnote(fq(e.m),t,dur,o.bw?WAVE[o.bw]:'triangle',.2,0);break;
    case'k':{const os=AC.createOscillator(),g=AC.createGain();os.frequency.setValueAtTime(130,t);os.frequency.exponentialRampToValueAtTime(40,t+.1);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);os.connect(g);g.connect(curBus);os.start(t);os.stop(t+.16);break;}
    case's':nz(.12,.12,5000,t-AC.currentTime,curBus);break;
    case'h':nz(.03,e.o?.035:.06,9000,t-AC.currentTime,curBus);break;
  }
}

// crisp pixel text: render system font to a tiny canvas, threshold alpha
const TXT={font:'10px "DejaVu Sans Mono",Consolas,Menlo,"Lucida Console",monospace',cache:new Map(),cw:6};
(function(){const c=mkc(20,14).getContext('2d');c.font=TXT.font;TXT.cw=Math.max(5,Math.round(c.measureText('MMMMMMMMMM').width/10));})();
function textCanvas(s,col){
  const k=col+'|'+s;let e=TXT.cache.get(k);if(e)return e;
  const w=Math.max(1,s.length*TXT.cw+2),c=mkc(w,12),x=c.getContext('2d');x.font=TXT.font;x.textBaseline='top';x.fillStyle='#000';x.fillText(s,0,1);
  const id=x.getImageData(0,0,w,12),d=id.data,rgb=hexRGB(col);
  for(let i=0;i<d.length;i+=4){const on=d[i+3]>95;d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=on?255:0;}
  x.putImageData(id,0,0);if(TXT.cache.size>900)TXT.cache.clear();TXT.cache.set(k,c);return c;
}
function hexRGB(h){if(h[0]!=='#')return[255,255,255];if(h.length===4)return[parseInt(h[1]+h[1],16),parseInt(h[2]+h[2],16),parseInt(h[3]+h[3],16)];return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function txt(s,x,y,col,sh,g){g=g||ctx;s=String(s);if(sh){g.drawImage(textCanvas(s,sh),x+1,y+1);}g.drawImage(textCanvas(s,col||'#fff'),x,y);}
function txtW(s){return s.length*TXT.cw;}
function txtC(s,y,col,sh){txt(s,Math.round((W-txtW(s))/2),y,col,sh||'#000');}
function wrap(s,max){const out=[];for(const para of String(s).split('\n')){let line='';for(const w of para.split(' ')){if((line+' '+w).trim().length>max){out.push(line);line=w;}else line=(line+' '+w).trim();}out.push(line);}return out;}

function hurtEnemy(e,d,fx,fy,kind){

function updEnemy(e){

   case'bat':case'crow':{const a=Math.atan2(dy,dx)+Math.sin(e.tm*.07+e.x)*1.1;if(e.tm%240<160)moveE(e,Math.cos(a)*e.sp,Math.sin(a)*e.sp);else moveE(e,Math.cos(a+3)*e.sp*.8,Math.sin(a+3)*e.sp*.8);break;}
   case'wisp':case'iwisp':{if(!e.dx&&!e.dy){e.dx=rnd()<.5?1:-1;e.dy=rnd()<.5?1:-1;}const ox=e.x,oy=e.y;moveE(e,e.dx*e.sp,0);if(e.x===ox)e.dx*=-1;moveE(e,0,e.dy*e.sp);if(e.y===oy)e.dy*=-1;
     if(e.tm%150===0&&d<140)shootAt(e,px,py,1.5,e.t==='wisp'?'fireb':'iceb',1);break;}
   case'archer':{const al=Math.abs(dx)<10||Math.abs(dy)<10;if(!al){if(Math.abs(dx)<Math.abs(dy))moveE(e,Math.sign(dx)*e.sp,0);else moveE(e,0,Math.sign(dy)*e.sp);}
     else if(e.tm%100===0&&d<150){const a=Math.abs(dx)>Math.abs(dy)?(dx>0?0:Math.PI):(dy>0?Math.PI/2:-Math.PI/2);shootDir(e,a,2.4,'earrow',1,3);}
     if(d<50)moveE(e,-dx/d*e.sp,-dy/d*e.sp);break;}
   case'warg':if(e.st===0){if(e.tm>70&&d<150){e.st=1;e.tm=0;e.dx=dx/d;e.dy=dy/d;}else if(d<160)moveE(e,dx/d*e.sp*.8,dy/d*e.sp*.8);else if(e.tm%80===0){e.dx=rnd()*2-1;e.dy=rnd()*2-1;}else moveE(e,e.dx*.3,e.dy*.3);}
     else if(e.st===1){if(e.tm<20){}else if(e.tm<50)moveE(e,e.dx*2.6,e.dy*2.6);else{e.st=0;e.tm=0;}}break;
   case'wraith':{moveE(e,dx/d*e.sp,dy/d*e.sp);if(e.tm%210===0){const a=rnd()*6.28;e.x=clamp(px+Math.cos(a)*50-e.w/2,16,230);e.y=clamp(py+Math.sin(a)*50-e.h/2,16,160);burst(e.x+6,e.y+6,'#8a5aff',6);}
     if(e.tm%180===90&&d<140)shootAt(e,px,py,1.7,'ebolt',1);break;}
   case'imp':if(e.tm%110<70)moveE(e,dx/d*e.sp,dy/d*e.sp);if(e.tm%110===100&&d<130)shootAt(e,px,py,1.9,'fireb',1);break;

/* ---------- projectiles & bombs ---------- */
function updProj(){
  for(const p of PR){
    p.life++;
    if(p.t==='boom'){
      if(p.out){if(p.life>26)p.out=0;}
      else{const a=Math.atan2(P.y+4-p.y,P.x+4-p.x);p.vx=Math.cos(a)*3.4;p.vy=Math.sin(a)*3.4;if(dist(p.x,p.y,P.x+4,P.y+4)<8)p.dead=1;}
    }
    p.x+=p.vx;p.y+=p.vy;
    if(p.t==='fire'){if(p.life>=p.life0||0){}}
    if(p.life>(p.t==='fire'?28:p.t==='boom'?200:260))p.dead=1;
    // tiles
    const tx=Math.floor((p.x+p.w/2)/16),ty=Math.floor((p.y+p.h/2)/16);
    if(p.x<-8||p.y<-8||p.x>264||p.y>200){p.dead=1;continue;}
    const t=tileAt(tx,ty);
    if(p.own){
      if(t===EYE&&(p.t==='arrow'||p.t==='boom'||p.t==='fire')){hitEye(tx,ty);if(p.t==='arrow')p.dead=1;if(p.t==='boom'){p.out=0;}}
      if(t===TOU&&(p.t==='fire')){fireAt(tx,ty);}
      if(t===BU&&p.t==='fire')fireAt(tx,ty);
      if(p.t==='arrow'&&(isSolidTile(t))&&t!==EYE){p.dead=1;burst(p.x,p.y,'#ddd',3);}
      if(p.t==='boom'&&isSolidTile(t)&&t!==EYE&&p.out)p.out=0;
      if(p.t==='boom'){for(const d of DROPS){if(ov(p,{x:d.x,y:d.y,w:8,h:8})){d.x=p.x;d.y=p.y;}}}
      for(const e of EN){if(e.dead||!ov(p,enemyBox(e)))continue;
        if(p.t==='boom'){if(!e.boss){e.stun=Math.max(e.stun,100);}hurtEnemy(e,e.boss?1:0,p.x,p.y,'boom');if(p.out){p.out=0;}}
        else if(p.t==='arrow'){if(hurtEnemy(e,p.dmg,p.x-p.vx,p.y-p.vy,'arrow'))p.dead=1;}
        else if(p.t==='fire'){if(!(e.t==='wisp'||e.t==='imp'||e.t==='cinderfiend'))hurtEnemy(e,p.dmg,P.x,P.y,'fire');}
      }
    }else{
      if(isSolidTile(t)&&t!==TOU){p.dead=1;continue;}
      const pb=pbox(P.x,P.y);
      if(ov(pb,p)){
        const sh=S.items.shield&&P.atk<=0&&P.inv<=0&&!P.lock;
        const dirTo=Math.abs(p.vx)>Math.abs(p.vy)?(p.vx>0?2:3):(p.vy>0?1:0); // direction player must face to block
        if(sh&&P.dir===dirTo&&!['wave','poison'].includes(p.t)){sfx('err');burst(p.x,p.y,'#fff',4);p.dead=1;}
        else{hurtPlayer(p.dmg,p.x,p.y);if(p.t==='web'){P.slow=90;}p.dead=1;}
      }
    }
  }
  PR=PR.filter(p=>!p.dead);
  for(const b of BOMBS){b.t--;if(b.t<=0){b.dead=1;explode(b.x+5,b.y+5);}}
  BOMBS=BOMBS.filter(b=>!b.dead);
}
function explode(x,y){
  sfx('bomb');shake=10;flashT=5;burst(x,y,'#ffb030',22);FX.push({t:'ring',x,y,life:16,max:16});
  for(const e of EN)if(!e.dead&&dist(x,y,e.x+e.w/2,e.y+e.h/2)<30)hurtEnemy(e,4,x,y,'bomb');
  if(dist(x,y,P.x+8,P.y+10)<26)hurtPlayer(2,x,y);
  for(let ty=0;ty<12;ty++)for(let tx=0;tx<16;tx++){if(dist(x,y,tx*16+8,ty*16+8)<26){const t=A.tiles[ty*16+tx];
    if(t===CRK){setTile(tx,ty,A.type==='ow'?PA:FLR);sfx('secret');burst(tx*16+8,ty*16+8,'#aaa',10);}
    else if(t===BU){setTile(tx,ty,A.type==='ow'?G:FLR);dropAt(tx*16+4,ty*16+4,.5);}
    else if(t===WEB){setTile(tx,ty,FLR);}}}
}
function hammerHit(){
  const r=swordRect(),tx0=Math.floor(r.x/16),tx1=Math.floor((r.x+r.w-1)/16),ty0=Math.floor(r.y/16),ty1=Math.floor((r.y+r.h-1)/16);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){const t=tileAt(tx,ty);
    if(t===BIG){setTile(tx,ty,A.type==='ow'?PA:FLR);burst(tx*16+8,ty*16+8,'#bbb',12);sfx('secret');}
    else if(t===PEG){setTile(tx,ty,FLR);burst(tx*16+8,ty*16+8,'#e8c050',8);sfx('hit');checkPuzzle();}
    else if(t===BU){setTile(tx,ty,A.type==='ow'?G:FLR);dropAt(tx*16+4,ty*16+4,.5);}
    else if(t===ORE){setTile(tx,ty,FLR);S.ore++;burst(tx*16+8,ty*16+8,'#6ad0ff',10);sfx('secret');banner={t:100,txt:'Stonekin ore! ('+S.ore+')'};}
    else if(t===EYE)hitEye(tx,ty);}
}
function swordTiles(){
  const r=swordRect(),pts=[[r.x+r.w/2,r.y+r.h/2],[r.x+3,r.y+3],[r.x+r.w-3,r.y+r.h-3],[r.x+r.w-3,r.y+3],[r.x+3,r.y+r.h-3]];
  for(const[x,y]of pts){const tx=Math.floor(x/16),ty=Math.floor(y/16),t=tileAt(tx,ty);
    if(t===BU){setTile(tx,ty,A.type==='ow'?G:FLR);dropAt(tx*16+4,ty*16+4,.45);burst(tx*16+8,ty*16+8,'#4a9a3c',6);sfx('hit');}
    else if(t===EYE){hitEye(tx,ty);}
    else if(t===WEB){setTile(tx,ty,FLR);sfx('hit');}}
}
/* ---------- update ---------- */
function playerUpdate(){
  const sp=((S.items.boots&&keys.dash)?1.9:1.25)*(P.slow>0?.55:1)*((A.tiles[Math.floor((P.y+12)/16)*16+Math.floor((P.x+8)/16)]===SWP)?.7:1);
  if(P.slow>0)P.slow--;
  if(P.inv>0)P.inv--;
  if(P.usedItem>0)P.usedItem--;
  if(Math.abs(P.kx)>.2||Math.abs(P.ky)>.2){moveBox(P,P.kx,0,true);moveBox(P,0,P.ky,true);P.kx*=.78;P.ky*=.78;}
  // attack timeline
  if(P.atk>0){P.atk++;
    if(P.atk>=4&&P.atk<=11){const r=swordRect();for(const e of EN){if(e.dead||P.hit.has(e))continue;if(ov(r,enemyBox(e))){P.hit.add(e);hurtEnemy(e,swordDmg(),P.x,P.y,'sword');}}swordTiles();}
    if(P.atk===5&&S.hp===S.maxhp&&S.swordLv>=2&&!PR.some(p=>p.t==='beam')){const d=P.dir;PR.push({t:'beam',x:P.x+4+DXS[d]*10,y:P.y+4+DYS[d]*10,w:8,h:8,vx:DXS[d]*3.6,vy:DYS[d]*3.6,own:1,dmg:swordDmg(),life:0,dir:d});sfx('beam');}
    if(P.atk>14)P.atk=0;
  }else if(P.atk<0){P.atk--;if(P.atk===-5)hammerHit();if(P.atk===-4){const r=swordRect();for(const e of EN){if(!e.dead&&ov(r,enemyBox(e)))hurtEnemy(e,3,P.x,P.y,'hammer');}}if(P.atk<-20)P.atk=0;}
  // movement
  if(!(P.atk!==0&&P.atk<12&&P.atk>0&&false)){
    let mx=(keys.r?1:0)-(keys.l?1:0),my=(keys.d?1:0)-(keys.u?1:0);
    const slowAtk=(P.atk!==0)?.0:1;
    if((mx||my)&&P.atk===0){
      if(mx&&my){mx*=.71;my*=.71;}
      if(mx&&!my)P.dir=mx<0?2:3;else if(my&&!mx)P.dir=my<0?1:0;
      else if(P.dir<2){if(!((my>0&&P.dir===0)||(my<0&&P.dir===1)))P.dir=my>0?0:1;}
      else if(!((mx<0&&P.dir===2)||(mx>0&&P.dir===3)))P.dir=mx<0?2:3;
      moveBox(P,mx*sp,0,true);moveBox(P,0,my*sp,true);
      P.anim+=sp*.18;
    }
  }
  // tile effects at feet
  const fx=Math.floor((P.x+8)/16),fy=Math.floor((P.y+12)/16),ft=tileAt(fx,fy);
  if(ft===PIT&&!P.fall&&P.inv<=0){P.fall=1;sfx('fall');}
  if(ft===LAV&&P.inv<=0)hurtPlayer(2,P.x+8,P.y+8);
  if((ft===ST||ft===HD)&&!trans&&!fade&&!P.lock)useStairs(fx,fy);
  if(P.fall){P.fall++;if(P.fall>30){P.fall=0;hurtPlayer(1,P.x,P.y);P.x=P.sx||120;P.y=P.sy||100;P.inv=70;}}
  else if(P.atk===0&&(A.type!=='dun'||true)){if(!P.fall&&ft!==PIT&&ft!==ST&&P.x>8&&P.x<240&&P.y>8&&P.y<176){P.sx=P.x;P.sy=P.y;}}
  // screen edges
  const cxp=P.x+8,cyp=P.y+10;
  if(cxp<0)edgeGo(2);else if(cxp>=256)edgeGo(3);else if(cyp<0)edgeGo(1);else if(cyp>=192)edgeGo(0);
}
function edgeGo(dir){
  let nx=A.type==='ow'?A.sx:A.rx,ny=A.type==='ow'?A.sy:A.ry;
  if(dir===2)nx--;else if(dir===3)nx++;else if(dir===1)ny--;else ny++;
  const key=A.type==='ow'?'ow:'+nx+','+ny:'dun:'+A.dk+':'+nx+','+ny;
  startSlide(dir,key);
}
function startSlide(dir,key){
  const snap=mkc(256,192),g=snap.getContext('2d');drawWorld(g,0,0,true);
  const old=A,oldDark=A.dark;
  loadArea(key);
  if(A.dirty)rebuildCanvas();
  const start=[[0,-14],[0,186],[250,0],[-10,0]][dir],tgt=[[0,12],[0,150],[222,0],[16,0]][dir];
  const keepX=P.x,keepY=P.y;
  if(dir===0||dir===1){P.x=keepX;P.y=start[1];}else{P.y=keepY;P.x=start[0];}
  trans={dir,t:0,snap,tx:tgt,pending:true,oldDark};
  P.lock=true;shake=0;
}
function updateTrans(){
  const T=trans;T.t++;const s=T.t/26;
  const dir=T.dir;
  if(dir===0||dir===1)P.y+=(T.tx[1]-P.y)*.1;else P.x+=(T.tx[0]-P.x)*.1;
  if(T.t>=26){
    if(dir===0||dir===1)P.y=T.tx[1];else P.x=T.tx[0];
    trans=null;P.lock=false;P.sx=P.x;P.sy=P.y;spawnArea();showToast();
  }
}
function useStairs(tx,ty){
  const k=A.key;
  if(A.type==='ow'){const gk=(A.sx*16+tx)+','+(A.sy*12+ty),to=OWL[gk];if(!to)return;
    if(S.flags['lock_'+to]){return;}
    const dest=to.startsWith('d')&&!to.startsWith('de')&&DUN[to]?'dun:'+to+':'+dunStart(to):'int:'+to;
    fadeTo(()=>{loadArea(dest);setupEntry();});
  }else if(A.type==='int'){
    const back=INTBACK[A.key.split(':')[1]];fadeTo(()=>{backToOW(back);});
  }else{
    const e=DUN_ENTR[A.dk];fadeTo(()=>{backToOW(e);});
  }
}
const INTBACK={};
function dunStart(dk){const g=DUN[dk].grid;for(let y=0;y<g.length;y++){const x=g[y].indexOf('S');if(x>=0)return x+','+y;}return'0,0';}
function backToOW(tile){
  const[tx,ty]=tile,sx=Math.floor(tx/16),sy=Math.floor(ty/12);
  loadArea('ow:'+sx+','+sy);P.x=(tx%16)*16;P.y=((ty%12)+1)*16-4;P.dir=0;P.sx=P.x;P.sy=P.y;

function setupEntry(){

function showToast(){

/* ---------- world render ---------- */
function drawWorld(g,ox,oy,noEnt){
  if(A.dirty||(A.anim&&(tick&15)===0))rebuildCanvas();
  g.drawImage(A.canvas,ox,oy);
  if(noEnt)return;
  // objects
  const list=[];
  for(const n of NP)list.push({y:n.y,f:()=>drawNPC(g,n,ox,oy)});
  for(const e of EN)list.push({y:e.y+e.h,f:()=>drawEnemyG(g,e,ox,oy)});
  list.push({y:P.y+16,f:()=>drawPlayerG(g,ox,oy)});
  for(const d of DROPS)list.push({y:d.y,f:()=>drawDrop(g,d,ox,oy)});
  for(const b of BOMBS)list.push({y:b.y,f:()=>{g.fillStyle='#2a2a38';g.fillRect(b.x+ox,b.y+oy,10,10);g.fillStyle=(tick&4)?'#ff6020':'#ffd040';g.fillRect(b.x+ox+4,b.y+oy-3,2,3);}});
  list.sort((a,b)=>a.y-b.y);for(const o of list)o.f();
  for(const p of PR)drawProj(g,p,ox,oy);
  for(const f of FX)drawFX(g,f,ox,oy);
}
function drawEnemyG(g,e,ox,oy){

}
function drawNPC(g,n,ox,oy){g.save();g.translate(ox,oy);if(n.draw)n.draw(g,n);else drawPerson(g,n.x,n.y,n);g.restore();}
function drawPlayerG(g,ox,oy){

function drawProj(g,p,ox,oy){

   case'boom':{const f=(tick>>1)&3;g.fillStyle='#c08030';g.fillRect(x+(f&1?0:2),y+(f&2?0:2),8,3);g.fillRect(x+(f&1?5:2),y,3,8);g.fillStyle='#e8b050';g.fillRect(x+3,y+3,4,4);break;}
   case'beam':g.fillStyle='#9ad0ff';g.fillRect(x,y,8,8);g.fillStyle='#fff';g.fillRect(x+2,y+2,4,4);break;

   case'poison':g.fillStyle='#4a2a6a';g.fillRect(x,y,p.w,p.h);g.fillStyle='#c050ff';g.fillRect(x+1,y+1,p.w-2,p.h-2);break;

const TB={open:false,name:'',pages:[],pi:0,pos:0,choices:null,sel:0};
let RES=-1,SCR=null,SWAIT=null;
const FADE={a:0,to:0};
function openText(name,text,choices){
  const lines=wrap(text,37),pages=[];for(let i=0;i<lines.length;i+=3)pages.push(lines.slice(i,i+3));
  Object.assign(TB,{open:true,name:name||'',pages,pi:0,pos:0,choices:choices||null,sel:0});
}
const say=(n,t)=>{openText(n,t);return()=>!TB.open;};
const ask=(n,t,o)=>{RES=-1;openText(n,t,o);return()=>!TB.open;};
const wf=n=>{let c=0;return()=>++c>=n;};
const fw=to=>{FADE.to=to;return()=>FADE.a===to;};
function startScript(g){SCR=g;SWAIT=null;P.lock=true;stepScript();}
function stepScript(){if(!SCR)return;const r=SCR.next();if(r.done){SCR=null;SWAIT=null;if(!P.dead&&!trans&&!fade)P.lock=false;return;}SWAIT=r.value;}
function updScript(){if(!SCR)return;if(SWAIT&&!SWAIT())return;stepScript();}
function* sayScript(n,t){yield say(n,t);}
function updText(){
  if(!TB.open)return;
  const pg=TB.pages[TB.pi],total=pg.join('').length;
  if(TB.pos<total){TB.pos+=keys.a?3:1.4;if((tick&3)===0)sfx('text');if(pressed.a)TB.pos=total;return;}
  const last=TB.pi===TB.pages.length-1;
  if(last&&TB.choices){
    if(pressed.u){TB.sel=(TB.sel+TB.choices.length-1)%TB.choices.length;sfx('menu');}
    if(pressed.d){TB.sel=(TB.sel+1)%TB.choices.length;sfx('menu');}
    if(pressed.a){RES=TB.sel;TB.open=false;sfx('select');}
  }else if(pressed.a){if(last)TB.open=false;else{TB.pi++;TB.pos=0;}sfx('menu');}
}
function uiBox(x,y,w,h){ctx.fillStyle='#e8ecff';ctx.fillRect(x,y,w,h);ctx.fillStyle='#5a6ad0';ctx.fillRect(x+1,y+1,w-2,h-2);ctx.fillStyle='#10185a';ctx.fillRect(x+2,y+2,w-4,h-4);}
function drawText(){
  if(!TB.open)return;
  const bx=8,by=H-64,bw=240,bh=58;uiBox(bx,by,bw,bh);
  if(TB.name){uiBox(bx+6,by-9,txtW(TB.name)+10,14);txt(TB.name,bx+11,by-8,'#ffe080');}
  const pg=TB.pages[TB.pi];let left=Math.floor(TB.pos);
  for(let i=0;i<pg.length;i++){const s=pg[i].slice(0,Math.max(0,left));left-=pg[i].length;if(s)txt(s,bx+8,by+7+i*10,'#fff');}
  const full=TB.pos>=pg.join('').length,last=TB.pi===TB.pages.length-1;
  if(full&&last&&TB.choices){
    const cx=bx+140,n=TB.choices.length;uiBox(cx-4,by-n*11-8,100+8,n*11+8);
    TB.choices.forEach((c,i)=>{txt((i===TB.sel?'>':' ')+c,cx,by-n*11-4+i*11,i===TB.sel?'#ffe080':'#fff');});
  }else if(full&&(tick>>4&1))txt(last?'v':'v',bx+bw-14,by+bh-14,'#ffe080');
}

const SHARD_NAMES=['Shard of Vigil','Shard of Thorn','Shard of Tide','Shard of Stone','Shard of Frost'];
const DK_IDX={d1:0,d2:1,d3:2,d4:3,d5:4};
function applyGive(g){
  const[k,v]=g.split(':');
  switch(k){
   case'key':S.keys[A.dk]=(S.keys[A.dk]||0)+1;return['key','You found a Small Key!','It will open a locked door in this place.','small'];
   case'bosskey':S.bk[A.dk]=1;return['bosskey','You found the Boss Key!','The great door of this place will answer to it.','item'];
   case'crowns':S.crowns=Math.min(999,S.crowns+ +v);return['crown','You found '+v+' crowns!','Coin of the realm.','small'];
   case'arrows':S.arrows=Math.min(60,S.arrows+ +v);return['arrows',v+' arrows!','Good for the bow.','small'];
   case'bombs':S.bombs=Math.min(30,S.bombs+ +v);return['bombs',v+' Powder Kegs!','Handle with care.','small'];
   case'piece':S.hpieces++;{let t='A Piece of Heart!';let d='Collect four to forge a new Heart Container. ('+(S.hpieces%4)+'/4)';if(S.hpieces%4===0){S.maxhp+=2;S.hp=S.maxhp;d='The four pieces join. Your life grows!';t='Heart Container!';}return['piece',t,d,'heart'];}
   case'hc':S.maxhp+=2;S.hp=S.maxhp;return['heart','Heart Container!','Your life force swells.','heart'];
   case'shard':{const i=+v;S.shards[i]=1;return['shard',SHARD_NAMES[i]+'!',"A shard of the Sparrow's Ward, warm as a living thing. ("+S.shards.reduce((a,b)=>a+b,0)+'/5)','shard'];}
   case'verse':S.verses++;return['scroll','A verse of the old song!','"..."  You tuck it away for the bard. ('+S.verses+'/3)','small'];
   case'ring':S.flags.ring=1;return['ring',"Old Hob's Ring!",'A worn silver ring, engraved with a fish.','item'];
   case'bottle':S.items.bottle=1;S.potions=1;if(!S.sel)S.sel='bottle';return['bottle','A Glass Bottle!','It holds a red draught that mends wounds.','item'];
   case'boots':S.items.boots=1;return['boots','Swiftfoot Boots!','Hold Shift to run like the wind.','item'];
   case'item':{const id=v;S.items[id]=1;if(id==='mail'){S.items.mail=1;return['mail','Starsteel Mail!','Fallen-star metal. Enemies strike softer.','item'];}
     if(id==='bow'){S.arrows=Math.max(S.arrows,30);}if(id==='bombs'){S.bombs=10;}if(!S.sel||['bottle'].includes(S.sel))S.sel=id;
     return[id,ITEM_INFO[id][0]+'!',ITEM_INFO[id][1],'item'];}
  }
  return['crown','Something!','','small'];
}
function* gainScript(give){
  const[icon,title,desc,kind]=applyGive(give);
  P.dir=0;P.gethold=icon;
  jingle(kind==='heart'?JING.heart:kind==='shard'?JING.shard:kind==='small'?JING.small:JING.item);
  sfx('chest');
  yield say('',title+'\n'+desc);
  P.gethold=null;
}
function* gateScript(tx,ty){
  const n=S.shards.reduce((a,b)=>a+b,0);
  if(n<5){sfx('err');yield say('The Ward-Gate','Five hollows are carved in the iron, shaped to hold shards of light. You carry '+n+'. The gate does not move.');return;}
  yield say('','The five shards rise from your pack and fly to their hollows. Light pours through the iron...');
  sfx('secret');shake=12;flashT=12;
  setTile(tx,ty,ST);yield wf(40);
  yield say('','The Ward-Gate swings open. Beyond it, the heat of Cindermaw breathes out like a furnace.');
}
function* graveScript(tx,ty){
  const g='gr:'+(A.sx*16+tx)+','+(A.sy*12+ty);
  if(S.flags[g]){yield say('','Fresh flowers rest on the stone.');return;}
  if(S.bouquets<=0){yield say('Grave','The name has worn away. A bouquet would be a kindness.');return;}
  S.bouquets--;S.graves++;S.flags[g]=1;sfx('secret');
  yield say('','You lay a bouquet on the cold stone. ('+S.graves+'/4)');
  if(S.graves>=4){
    playMusic('fairy');yield wf(30);
    const gh={x:(tx)*16,y:(ty+1)*16,look:{skin:'#c8e8f0',hair:'#9ad0e0',cloth:'#7ab0d0',glow:1,hat:'helm'},still:1,noTalk:1};NP.push(gh);
    yield say('Spectral Warden','Four of mine, remembered at last. I kept the Barrow when I lived and I keep it still. Take this, small knight, for you carry the old vow.');
    NP=NP.filter(n=>n!==gh);yield* gainScript('piece');playMusic(areaMusic());
  }
}
function* bossDefeatScript(e){
  P.lock=true;EN.forEach(x=>{if(x!==e)x.dead=1;});PR=[];stopMusic();sfx('bossdie');shake=30;
  e.scripted=true;e.noContact=true;
  for(let i=0;i<110;i++){if(i%4===0)burst(e.x+rnd()*e.w,e.y+rnd()*e.h,pick(['#ffd040','#ff8a20','#fff']),6);e.inv=2;yield wf(1);}
  e.dead=1;EN=EN.filter(x=>!x.dead);bossBar=null;flashT=12;
  if(e.t==='vorthane'){yield* endingScript();return;}
  if(e.t==='haldrax'){const st=S.rooms[A.rk]=S.rooms[A.rk]||{};st.cl=1;openDoors();placeChest();playMusic(A.mus);return;}
  const dk=A.dk;S.flags['boss_'+dk]=1;
  yield wf(30);
  yield* gainScript('hc');
  yield* gainScript('shard:'+DK_IDX[dk]);
  openDoors();setTile(7,5,ST,false);setTile(8,5,ST,false);playMusic(A.mus);autoSave();
  if(dk==='d1')S.stage=Math.max(S.stage,3);
}
function* endingScript(){
  yield fw(1);EN=[];stopMusic();S.flags.won=1;S.flags.boss_d6=1;
  playMusic('sad');
  yield say('','The armor of Vorthane falls apart like ash in the wind. The red light behind its visor gutters... and goes out.');
  P.x=120;P.y=130;P.dir=1;
  const wren={x:112,y:50,look:LK.wren,noTalk:1,still:1};NP=[wren];
  yield fw(0);playMusic('wren');
  yield say('Wren','You came. Through the Wyrdwood, the Deepdelve, the frost... all of it. Of course you did.');
  for(let i=0;i<48;i++){wren.y+=1.2;yield wf(1);}
  yield say('Wren','Everyone told me the Sparrow Knight had no face. That nobody had ever seen it. I told them it did not matter.');
  yield say('Wren','May I?');
  yield say('','Her hand lifts toward your visor... and stops, a breath away. You do not move. She smiles.');
  yield say('Wren','No. Keep it. I knew you by your steady hands, and the way you waited outside my door in the snow. I know who you are.');
  yield say('','She takes your gauntleted hand in both of hers. Far above, the shards of the Ward sing, and the dark over the valley begins to lift.');
  yield fw(1);
  S.flags.won=1;autoSave();
  playMusic('victory');
  yield wf(30);
  yield say('','The Sparrow\'s Ward holds once more. In Thistledown the geese are loud, the bread is warm, and a certain knight is seen walking a certain girl home each evening.');
  yield say('','He never takes off the helm. She never asks again.');
  mode='credits';credT=0;playMusic('credits');
}

    drawWorld(ctx,no[0]|0,no[1]|0,true);drawPlayerG(ctx,no[0]|0,no[1]|0);

    drawWorld(ctx,0,0,false);

  if(flashT>0){ctx.fillStyle='rgba(255,255,255,'+(flashT/14)+')';ctx.fillRect(0,HUD,W,192);}

/* ---------- main update ---------- */
function updateGame(){
  S.time++;
  if(flashT>0)flashT--;if(shake>0)shake--;if(toast&&toast.t>0)toast.t--;if(banner&&banner.t>0)banner.t--;
  // fades
  if(FADE.a!==FADE.to){const d=FADE.to-FADE.a;FADE.a=Math.abs(d)<.03?FADE.to:FADE.a+Math.sign(d)*.03;}
  if(fade){fade.t++;if(fade.t===20){fade.cb();P.lock=true;}if(fade.t>=40){fade=null;if(!SCR)P.lock=false;}return;}
  if(TB.open){updText();updScript();updFX();return;}
  if(SCR){updScript();updFX();for(const e of EN)if(e.scripted){}
    if(P.kx||P.ky){moveBox(P,P.kx,0,true);moveBox(P,0,P.ky,true);P.kx*=.8;P.ky*=.8;}return;}
  if(trans){updateTrans();return;}
  if(P.dead){P.dead++;updFX();if(P.dead>100){mode='gameover';goSel=0;playMusic('gameover');}return;}
  if(pressed.s){mode='menu';menuPage=0;menuToast='';sfx('menu');return;}
  if(pressed.a)usedAction();
  if(pressed.b)useItem();
  if(pressed.c)cycleItem();
  if(!P.lock)playerUpdate();
  if(A.bossIntro>0){A.bossIntro--;if(A.bossIntro===0)spawnBoss();}
  for(const e of EN){if(e.dead)continue;if(e.scripted)continue;updEnemy(e);}
  EN=EN.filter(e=>!e.dead);
  updNPCs();updProj();updFX();
  for(const d of DROPS){d.life--;if(ov(pbox(P.x,P.y),{x:d.x,y:d.y,w:8,h:8})){d.dead=1;
    if(d.t==='heart'){healPlayer(2);sfx('heart');}else if(d.t==='crown'){S.crowns=Math.min(999,S.crowns+1);sfx('crown');}else if(d.t==='crown5'){S.crowns=Math.min(999,S.crowns+5);sfx('crown');}
    else if(d.t==='arrow'){S.arrows=Math.min(60,S.arrows+5);sfx('crown');}else if(d.t==='bomb'){S.bombs=Math.min(30,S.bombs+2);sfx('crown');}}if(d.life<=0)d.dead=1;}
  DROPS=DROPS.filter(d=>!d.dead);
  // dungeon room clear
  if(A.type==='dun'&&A.locked&&A.info.kind!=='B'&&!EN.some(e=>!e.dead)){
    const st=S.rooms[A.rk]=S.rooms[A.rk]||{};st.cl=1;openDoors();
    if(A.info.kind==='q'&&A.info.ptype==='wave')solvePuzzle();else placeChest();
    if(A.info.kind==='m'||A.info.kind==='M'){playMusic(A.mus);}}
  if(A.type==='dun'&&(A.info.kind==='m'||A.info.kind==='M')&&EN.some(e=>e.mini||e.t==='haldrax')&&curName!=='miniboss'&&curName!=='haldrax'&&A.locked)playMusic(EN.some(e=>e.t==='haldrax')?'haldrax':'miniboss');
  if(bossBar&&bossBar.dead)bossBar=null;
  if(!bossBar){const b=EN.find(e=>e.boss&&!e.clone&&!e.dead);if(b)bossBar=b;}
  // low hp warning
  if(S.hp<=2&&S.hp>0&&(tick%90)===0)sfx('menu');
  if(tick%600===0&&A.type==='ow'&&EN.length<2&&rnd()<.3&&!['2,4','2,3','1,3'].includes(A.sx+','+A.sy)){const sp=freeSpot(90);if(sp){EN.push(mkEnemy(pick(OWPOOL[BIO[A.sy][A.sx]].filter(t=>S.stage>=3||!['wraith','brute','hulk'].includes(t))),sp[0],sp[1]));}}
}
function spawnBoss(){
  const t={d1:'gorrim',d2:'skrall',d3:'gloam',d4:'cinderfiend',d5:'ysmera',d6:'vorthane'}[A.dk];
  const e=mkEnemy(t,116,48);e.name=ED[t].name;EN.push(e);bossBar=e;playMusic(A.dk==='d6'?'vorthane':'boss');sfx('roar');banner={t:110,txt:ED[t].name};shake=10;
}
function update(){
  tick++;
  if(mode==='title')updateTitle();
  else if(mode==='juke')updateJuke();
  else if(mode==='menu')updMenu();
  else if(mode==='credits'){credT++;if(pressed.s&&credT>60){mode='title';curName='';playMusic('title');}}
  else if(mode==='gameover'){
    if(pressed.u||pressed.d){goSel=1-goSel;sfx('menu');}
    if(pressed.a||pressed.s){sfx('select');
      if(goSel===0){S.hp=S.maxhp;P=newPlayer();const cp=S.cp;loadArea(cp.key);P.x=cp.x;P.y=cp.y;P.sx=P.x;P.sy=P.y;spawnArea();mode='game';showToast();}
      else{mode='title';curName='';playMusic('title');}}
  }
  else updateGame();
  for(const k in pressed)pressed[k]=0;
}
let last=0,acc=0;
function frame(t){
  const dt=Math.min(100,t-last);last=t;acc+=dt;
  while(acc>=16.667){update();acc-=16.667;}
  render();requestAnimationFrame(frame);
}
function fitCanvas(){const s=Math.max(1,Math.min(innerWidth/W,innerHeight/H));cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fitCanvas);fitCanvas();
requestAnimationFrame(frame);

for(const k in OWL){const[x,y]=k.split(',').map(Number);if(!OWL[k].startsWith('d')||!DUN[OWL[k]])INTBACK[OWL[k]]=[x,y];}
