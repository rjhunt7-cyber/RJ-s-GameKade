// ================= CORE =================

const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;

function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}

function fmtTime(t){if(!isFinite(t))return'--:--.--';t=Math.max(0,t);const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2);}

// ================= SAVE =================
const DEFAULT_BINDS={gas:['ArrowUp','KeyW'],brake:['ArrowDown','KeyS'],left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],drift:['Space','Mouse2'],item:['KeyE','Mouse0'],special:['KeyQ','ShiftLeft'],pause:['Escape','KeyP']};

const Save={d:{willie:false,bw:false,mobile:IS_TOUCH&&!FINE,autogas:true,binds:JSON.parse(JSON.stringify(DEFAULT_BINDS)),cc:1,laps:4,music:.6,sfx:.8,film:true,hq:!(IS_TOUCH&&!FINE)},
 async load(){let raw=null;

  if(!raw){try{raw=window.localStorage.getItem('rhr-save-v1');}catch(e){}}
  if(raw){try{const o=JSON.parse(raw);const b=o.binds;delete o.binds;Object.assign(this.d,o);if(b)for(const k in DEFAULT_BINDS)if(Array.isArray(b[k]))this.d.binds[k]=b[k].slice(0,2);}catch(e){}}},
 save(){const raw=JSON.stringify(this.d);
  try{if(window.storage&&window.storage.set){const p=window.storage.set('rhr-save-v1',raw);if(p&&p.catch)p.catch(()=>{});}}catch(e){}
  try{window.localStorage.setItem('rhr-save-v1',raw);}catch(e){}}};

// ================= AUDIO =================
const Snd={ctx:null,
 init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{this.ctx=new AC();}catch(e){return;}
  const c=this.ctx;this.out=c.createGain();this.out.connect(c.destination);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4600;lp.connect(this.out);
  const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=95;hp.connect(lp);
  this.mus=c.createGain();this.mus.connect(hp);this.fx=c.createGain();this.fx.connect(hp);
  const len=c.sampleRate;this.nb=c.createBuffer(1,len,c.sampleRate);const d=this.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  this.vol();if(Music.pending){const p=Music.pending;Music.pending=null;Music.start(...p);}},
 vol(){if(!this.ctx)return;this.mus.gain.value=Save.d.music*.55;this.fx.gain.value=Save.d.sfx*.75;},
 note(t,f,d,type,v,dest,lp,vib){const c=this.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.6;lg.gain.value=f*.013;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+d+.05);}
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  if(lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(g);}else o.connect(g);
  g.connect(dest);o.start(t);o.stop(t+d+.05);},
 noiseAt(t,d,f,v,dest,type='bandpass',f2){const c=this.ctx;const s=c.createBufferSource();s.buffer=this.nb;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
  const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+d+.05);},
 sfx(n){if(!this.ctx)return;const c=this.ctx,t=c.currentTime,o=this.fx;
  const T=(f,d,ty='square',v=.15,f2,w=0)=>{const tt=t+w;const os=c.createOscillator(),g=c.createGain();os.type=ty;os.frequency.setValueAtTime(f,tt);if(f2)os.frequency.exponentialRampToValueAtTime(f2,tt+d);g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(v,tt+.01);g.gain.exponentialRampToValueAtTime(.0001,tt+d);os.connect(g);g.connect(o);os.start(tt);os.stop(tt+d+.05);};
  const N=(d,f,v=.2,ty='bandpass',f2,w=0)=>this.noiseAt(t+w,d,f,v,o,ty,f2);
  switch(n){
   case'click':T(880,.05,'triangle',.14);T(1320,.035,'square',.035,null,.012);break;
   case'move':T(620,.035,'triangle',.07);break;
   case'honk':T(330,.2,'square',.1);T(415,.2,'square',.08);break;
   case'boing':T(170,.24,'sine',.22,700);break;
   case'splat':N(.3,700,.5,'lowpass',180);T(150,.16,'sine',.3,60);break;
   case'boom':N(.9,500,.7,'lowpass',70);T(95,.65,'sine',.5,28);break;
   case'clang':[620,935,1480,2100].forEach((f,i)=>T(f,.7-i*.12,'square',.055));N(.12,3200,.2,'highpass');break;
   case'get':[523,659,784,1046].forEach((f,i)=>T(f,.09,'square',.07,null,i*.05));break;
   case'tick':T(1250,.025,'square',.045);break;
   case'whoosh':N(.5,380,.42,'bandpass',2600);break;
   case'beep':T(440,.28,'square',.13);break;
   case'go':T(880,.6,'square',.13);T(660,.6,'square',.07);break;
   case'lap':[784,988,1175].forEach((f,i)=>T(f,.14,'square',.08,null,i*.11));break;
   case'final':[523,659,784,1046,784,1046].forEach((f,i)=>T(f,.13,'square',.08,null,i*.1));break;
   case'finish':[392,523,659,784,659,784,1046].forEach((f,i)=>T(f,i===6?.7:.14,'square',.09,null,i*.12));break;
   case'spin':T(820,.6,'triangle',.14,150);break;
   case'throw':N(.16,1500,.25,'bandpass',600);T(520,.12,'triangle',.08,250);break;
   case'drop':T(300,.1,'triangle',.12,190);break;
   case'mini':T(480,.28,'sawtooth',.07,1250);N(.32,800,.2,'bandpass',3200);break;
   case'whistle':[0,.5].forEach(w=>{T(587,.42,'sine',.13,null,w);T(740,.42,'sine',.09,null,w);});T(880,.95,'sine',.12,null,1.0);T(1108,.95,'sine',.06,null,1.0);break;
   case'bump':T(160,.1,'square',.09,90);N(.08,500,.2);break;
   case'ink':N(.45,320,.4,'lowpass',100);T(230,.32,'sine',.2,90);break;
   case'fall':T(900,.9,'sine',.15,110);break;

   case'cheer':N(1.2,1800,.12,'bandpass',900);break;

const Music={on:false,bpm:150,step:0,next:0,t0:0,mel:null,prog:null,key:0,timer:null,pending:null,
 start(seed,bpm){if(!Snd.ctx){this.pending=[seed,bpm];return;}

  const progs=[[0,9,2,7,0,5,7,0],[0,4,9,2,7,7,0,0],[0,0,5,5,0,9,2,7],[0,9,5,7,0,9,2,7],[5,5,0,0,2,7,0,0]];

   if(R()<(pos%2===0?.72:.42)){deg+=Math.floor(R()*5)-2;if(R()<.14)deg+=R()<.5?-4:4;deg=clamp(deg,3,15);this.mel.push(deg);}else this.mel.push(null);}

  if(!this.timer)this.timer=setInterval(()=>this.tick(),25);},

  if(this.next<c.currentTime-.3)this.next=c.currentTime+.02;
  while(this.next<c.currentTime+.15){const sw=(this.step%2===0)?e*1.2:e*.8;this.play(this.step,this.next,sw);this.next+=sw;this.step++;}},
 play(s,t,dur){const bar=(s>>3)%8,pos=s&7,base=this.prog[bar],root=base+this.key,m=Snd.mus;const fr=x=>110*Math.pow(2,x/12);

  if(pos===0||pos===4)Snd.note(t,fr(root+(pos===4?7:0)-12),dur*1.7,'triangle',.34,m);
  if(pos===2||pos===6){[0,4,7,dom?10:12].forEach(x=>Snd.note(t,fr(root+x+12),dur*.85,'sawtooth',.04,m,1500));Snd.noiseAt(t,.09,2600,.11,m);}

function pulse(){const b=Music.beat();const f=b-Math.floor(b);const s=Math.sin(Math.PI*f);return s*s;}
// ================= ART HELPERS (hand-inked look) =================
const ART={shade:false,weight:false,lw:1,curvy:false};
function art(fn){const s=ART.shade,w=ART.weight;ART.shade=ART.weight=true;try{return fn();}finally{ART.shade=s;ART.weight=w;}}
function hashStr(s){s=String(s);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function makeNoise(seed,cell,period){const R=mulberry(seed),G=new Float32Array(4096);for(let i=0;i<4096;i++)G[i]=R()*2-1;const P=period?Math.max(1,Math.round(period)):64;
 return(x,y)=>{x/=cell;y/=cell;const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const X0=((xi%P)+P)%P,X1=(X0+1)%P,Y0=((yi%P)+P)%P,Y1=(Y0+1)%P,a=G[Y0*64+X0],b=G[Y0*64+X1],c=G[Y1*64+X0],d=G[Y1*64+X1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function shadeBB(g,bb,k=1){const[x,y,w,h]=bb;g.save();g.clip();const gr=g.createLinearGradient(x+w*.1,y,x+w*.45,y+h);gr.addColorStop(0,'rgba(255,248,228,'+(.34*k)+')');gr.addColorStop(.4,'rgba(255,248,228,0)');gr.addColorStop(.6,'rgba(70,35,12,0)');gr.addColorStop(1,'rgba(70,35,12,'+(.3*k)+')');g.fillStyle=gr;g.fillRect(x-6,y-6,w+12,h+12);g.restore();}
function fs(g,fill,lw,bb){if(fill){g.fillStyle=fill;g.fill();if(bb&&ART.shade&&bb[2]>5&&bb[3]>5)shadeBB(g,bb);}
 if(lw){lw*=ART.lw;g.lineWidth=lw;g.strokeStyle=INK;g.lineJoin='round';g.lineCap='round';if(ART.weight){g.shadowColor=INK;g.shadowOffsetX=lw*.3;g.shadowOffsetY=lw*.36;g.shadowBlur=0;}g.stroke();if(ART.weight){g.shadowColor='rgba(0,0,0,0)';g.shadowOffsetX=g.shadowOffsetY=0;}}}
function E(g,x,y,rx,ry,fill,lw=4,rot=0){rx=Math.max(.1,rx);ry=Math.max(.1,ry);g.beginPath();g.ellipse(x,y,rx,ry,rot,0,TAU);const m=Math.max(rx,ry);fs(g,fill,lw,[x-m,y-m,2*m,2*m]);}
function rrPath(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function RR(g,x,y,w,h,r,fill,lw=4){rrPath(g,x,y,w,h,r);fs(g,fill,lw,[x,y,w,h]);}
function PG(g,p,fill,lw=4){if(ART.curvy){const q=[];for(let i=0;i<p.length;i+=2)q.push([p[i],p[i+1]]);cpoly(g,q,.3);let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of q){a=Math.min(a,x);c=Math.max(c,x);b=Math.min(b,y);d=Math.max(d,y);}fs(g,fill,lw,[a,b,c-a,d-b]);return;}g.beginPath();g.moveTo(p[0],p[1]);let a=p[0],b=p[1],c=p[0],d=p[1];for(let i=2;i<p.length;i+=2){g.lineTo(p[i],p[i+1]);a=Math.min(a,p[i]);c=Math.max(c,p[i]);b=Math.min(b,p[i+1]);d=Math.max(d,p[i+1]);}g.closePath();fs(g,fill,lw,[a,b,c-a,d-b]);}
function LN(g,p,lw,col=INK){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.lineWidth=lw;g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';g.stroke();}
function blob(g,cs,fill,lw=4){g.fillStyle=INK;for(const c of cs){g.beginPath();g.arc(c[0]+(ART.weight?lw*.3:0),c[1]+(ART.weight?lw*.35:0),c[2]+lw,0,TAU);g.fill();g.beginPath();g.arc(c[0],c[1],c[2]+lw,0,TAU);g.fill();}g.fillStyle=fill;for(const c of cs){g.beginPath();g.arc(c[0],c[1],c[2],0,TAU);g.fill();}
 if(ART.shade){let a=1e9,b=1e9,c2=-1e9,d=-1e9;g.beginPath();for(const c of cs){g.moveTo(c[0]+c[2],c[1]);g.arc(c[0],c[1],c[2],0,TAU);a=Math.min(a,c[0]-c[2]);b=Math.min(b,c[1]-c[2]);c2=Math.max(c2,c[0]+c[2]);d=Math.max(d,c[1]+c[2]);}shadeBB(g,[a,b,c2-a,d-b]);}}
function eye(g,x,y,rx,ry,look,lw,lash,shut){if(shut){g.beginPath();g.moveTo(x-rx*1.05,y+ry*.05);g.quadraticCurveTo(x,y+ry*.55,x+rx*1.05,y+ry*.05);g.lineWidth=Math.max(2,lw*1.1);g.strokeStyle=INK;g.lineCap='round';g.stroke();return;}
 E(g,x,y,rx,ry,WHITE,lw);const px=x+look*rx*.32,py=y+ry*.16;g.beginPath();g.ellipse(px,py,rx*.6,ry*.66,0,0,TAU);g.fillStyle=INK;g.fill();
 g.beginPath();g.moveTo(px,py);g.arc(px,py,ry*.72,-1.25,-.62);g.closePath();g.fillStyle=WHITE;g.fill();
 if(lash){g.lineWidth=Math.max(1.5,lw*.8);g.strokeStyle=INK;g.beginPath();for(let k=-1;k<=1;k++){const a=-Math.PI/2+k*.5;g.moveTo(x+Math.cos(a)*rx*.9,y+Math.sin(a)*ry*.95);g.lineTo(x+Math.cos(a)*rx*1.45,y+Math.sin(a)*ry*1.4);}g.stroke();}}
function oface(g,x,y,s,lw=3,mood=0){eye(g,x-s*.34,y,s*.2,s*.3,0,lw);eye(g,x+s*.34,y,s*.2,s*.3,0,lw);
 g.beginPath();if(mood){g.moveTo(x-s*.3,y+s*.62);g.quadraticCurveTo(x,y+s*.4,x+s*.3,y+s*.62);g.lineWidth=lw;g.strokeStyle=INK;g.stroke();return;}
 g.moveTo(x-s*.36,y+s*.4);g.quadraticCurveTo(x,y+s*.9,x+s*.36,y+s*.4);g.quadraticCurveTo(x,y+s*.55,x-s*.36,y+s*.4);g.closePath();g.fillStyle=INK;g.fill();
 g.save();g.clip();g.beginPath();g.ellipse(x,y+s*.72,s*.16,s*.1,0,0,TAU);g.fillStyle=RED;g.fill();g.restore();
 for(const q of[-1,1]){const gr=g.createRadialGradient(x+q*s*.62,y+s*.32,0,x+q*s*.62,y+s*.32,s*.24);gr.addColorStop(0,'rgba(226,112,96,.5)');gr.addColorStop(1,'rgba(226,112,96,0)');g.fillStyle=gr;g.fillRect(x+q*s*.62-s*.3,y+s*.02,s*.6,s*.6);}}
function spikes(g,x,y,r1,r2,n,fill,lw,rot=0){g.beginPath();for(let i=0;i<n*2;i++){const a=rot+i/(n*2)*TAU,r=i%2?r2:r1;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.closePath();fs(g,fill,lw,[x-r1,y-r1,r1*2,r1*2]);}

function orient(p){let a=0;for(let i=0;i<p.length;i++){const q=p[i],w=p[(i+1)%p.length];a+=q[0]*w[1]-w[0]*q[1];}return a<0?p.slice().reverse():p;}

function bboxOf(subs){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const s of subs)for(const[x,y]of s){if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y;}return[a,b,c-a,d-b];}

 for(let i=0;i<N;i++){const dx=x-T.px[i],dy=y-T.py[i],q=dx*dx+dy*dy;if(q<bd){bd=q;best=i;}}return best;}

 const tb=[['pie',[25,20,10]],['glove',[6,20,16]],['banana',[35,10,4]],['dyna',[20,12,6]],['tonic',[14,16,16]],['tonic3',[0,10,22]],['ink',[0,8,8]],['anvil',[0,2,10]],['shoe',[0,4,18]]];
 const w=tb.map(([nm,a])=>[nm,f<.5?lerp(a[0],a[1],f*2):lerp(a[1],a[2],(f-.5)*2)]);let tot=0;for(const e of w)tot+=e[1];let r=Math.random()*tot;for(const e of w){r-=e[1];if(r<=0)return e[0];}return'pie';}
function setIdx(k,ni){const N=race.T.n,prev=k.idx;k.idx=ni;

function updObjs(dt){const T=race.T,N=T.n;

function aiInput(k,dt){const T=race.T,N=T.n,ai=k.ai,sk=ai.skill,inp={steer:0,gas:true,brake:false,drift:false,item:false};

 off+=avoid*(.4+.6*sk);
 if(!k.item&&k.roul<=0&&sk>.5){for(const b of T.boxes){const ah=idxDiff(b.i,k.idx,N);if(b.on&&ah>2&&ah<34){off=lerp(off,b.lat,.5*sk);break;}}}

 const lim=race.def.deadly?T.hw*.62:T.hw*.82;off=clamp(off,-lim,lim);
 const tx=T.px[ti]+T.nx[ti]*off,ty=T.py[ti]+T.ny[ti]*off,d=angDiff(Math.atan2(ty-k.y,tx-k.x),k.a);
 inp.steer=clamp(d*(2.3+sk)+(Math.random()-.5)*ai.noise,-1,1);if(k.ink>0)inp.steer=clamp(inp.steer+Math.sin(race.t*6+k.kid.length)*.7,-1,1);

 if(k.v>vT+25){inp.gas=false;if(k.v>vT+80)inp.brake=true;}if(Math.abs(d)>1.2&&k.v>120)inp.gas=false;
 const kd=T.k[ti];
 if(!k.drift){if(sk>.35&&Math.abs(kd)>ai.driftK&&k.v>k.maxV*race.ccM*.55&&Math.sign(kd)===Math.sign(inp.steer)&&Math.abs(inp.steer)>.3&&Math.random()<sk*dt*7)inp.drift=true;}
 else{inp.drift=!(Math.abs(kd)<ai.driftK*.45||k.dCharge>(sk>.75?2.1:1.15)||Math.abs(d)>.95);}

function music(key,seed,bpm){if(Music.on&&Music.curKey===key)return;Music.curKey=key;Music.start(seed,bpm);}
function pickCpus(excl){const pool=CHARS.filter(c=>!c.unlock&&!excl.includes(c.id)).map(c=>c.id);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}return pool.slice(0,8);}
function gridOrder(list){if(Cup.race===0)return list.filter(e=>!e.human).concat(list.filter(e=>e.human));return list.slice().sort((a,b)=>((Cup.st[b.key]||{pts:0}).pts-(Cup.st[a.key]||{pts:0}).pts));}

function startNextRace(){const me=CHARS[Sel.char],list=[{ch:me,kid:'h:me',ctrl:'me',name:'You',key:'h:me',human:1}];
 Cup.cpus.slice(0,7).forEach(id=>list.push({ch:CH[id],kid:'c:'+id,ctrl:'cpu',name:CH[id].name,key:'c:'+id}));
 loadRace({ti:Cup.cup*10+Cup.race,roster:gridOrder(list),cc:Cup.cc,laps:Cup.laps,online:false});}
function loadRace(o){pendingRace=o;loadT=0;scr='loading';paused=false;Music.stop();codeInput.style.display='none';}
function applyResults(order){const rows=[];order.forEach((o,i)=>{const k=kartById(o.kid);if(!k)return;const pts=POINTS[i]||0,s=Cup.st[k.key]||(Cup.st[k.key]={pts:0,ch:k.ch,name:k.name,me:false});s.pts+=pts;s.ch=k.ch;s.me=k===race.me;rows.push({k,time:o.time,pts,key:k.key});});
 Cup.last=rows;race.ended=true;const mine=rows.findIndex(r=>r.k===race.me);Cup.unlocked=false;
 if(mine===0&&!Save.d.willie){Save.d.willie=true;Save.save();Cup.unlocked=true;CH.willie._lock=null;setTimeout(()=>Snd.sfx('whistle'),700);}
 setTimeout(()=>go('results',()=>music('results',777,112)),race.online?600:300);}
function nextRaceOrPodium(){if(Cup.race>=9){if(Cup.online&&Net.host){Net.inRace=false;Net.send({t:'podium'});Net.sendLobby();}go('podium',()=>music('podium',31,128));return;}
 Cup.race++;if(Cup.online)Net.hostStartRace();else startNextRace();}
function quitToTitle(){if(Net.on)Net.reset();race=null;Cup=null;Music.stop();go('title');}
// ================= NETWORK (PeerJS room codes) =================
const NET_PREFIX='rjg-rubberhose-';
const Net={on:false,host:false,peer:null,conns:new Map(),hc:null,code:'',myPid:'me',players:[],status:'',lobby:{cup:0,cc:1,laps:3},inRace:false,sendT:0,pidN:1,
 lib(cb){if(window.Peer)return cb();this.status='Loading online play…';const urls=['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
  const tryU=i=>{if(i>=urls.length){this.status='Online play could not load. Check your internet connection and try again.';return;}const s=document.createElement('script');s.src=urls[i];s.onload=()=>window.Peer?cb():tryU(i+1);s.onerror=()=>tryU(i+1);document.head.appendChild(s);};tryU(0);},
 reset(){try{for(const c of this.conns.values())c.close();}catch(e){}try{if(this.hc)this.hc.close();}catch(e){}try{if(this.peer)this.peer.destroy();}catch(e){}
  this.on=false;this.host=false;this.peer=null;this.conns=new Map();this.hc=null;this.players=[];this.code='';this.myPid='me';this.inRace=false;this.status='';},
 errText(e){const t=e&&e.type;if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return'Could not reach the matchmaking server. Check your connection and try again.';if(t==='browser-incompatible')return'This browser does not support online play.';return'Connection problem ('+(t||'unknown')+'). Try again.';},
 genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;},
 hostRoom(){this.reset();this.on=true;this.host=true;this.status='Opening a room…';this.lobby={cup:0,cc:Save.d.cc,laps:Save.d.laps};
  this.lib(()=>{let tries=0;const open=()=>{this.code=this.genCode();let p;try{p=new Peer(NET_PREFIX+this.code);}catch(e){this.status=this.errText(e);return;}this.peer=p;
   p.on('open',()=>{this.status='';this.myPid='h';this.players=[{pid:'h',char:CHARS[Sel.char].id,name:'Player 1'}];go('lobby');});
   p.on('connection',c=>this.onConn(c));
   p.on('error',e=>{if(e.type==='unavailable-id'&&tries++<5){try{p.destroy();}catch(_){}open();}else this.status=this.errText(e);});
   p.on('disconnected',()=>{try{if(!p.destroyed)p.reconnect();}catch(_){}});};open();});},
 joinRoom(code){this.reset();this.on=true;this.host=false;this.code=code;this.status='Connecting to room '+code+'…';
  this.lib(()=>{let p;try{p=new Peer();}catch(e){this.status=this.errText(e);return;}this.peer=p;
   p.on('open',()=>{const c=p.connect(NET_PREFIX+code,{reliable:true});this.hc=c;
    c.on('open',()=>c.send({t:'hello',char:CHARS[Sel.char].id}));c.on('data',d=>this.clientMsg(d));
    c.on('close',()=>this.lost('The host closed the room.'));c.on('error',()=>this.lost('Lost the connection to the host.'));});
   p.on('error',e=>{if(e.type==='peer-unavailable')this.status='No room found with code '+code+'. Check the code and try again.';else this.status=this.errText(e);});});},
 lost(m){if(!this.on)return;this.reset();race=null;Cup=null;Music.stop();toast(m,4);go('title');},
 ss(c,m){try{if(c&&c.open)c.send(m);}catch(e){}},
 send(m){if(this.host){for(const c of this.conns.values())this.ss(c,m);}else this.ss(this.hc,m);},
 relay(m,ex){for(const c of this.conns.values())if(c!==ex)this.ss(c,m);},
 onConn(c){c.on('data',d=>this.hostMsg(d,c));c.on('close',()=>this.drop(c));c.on('error',()=>this.drop(c));},
 drop(c){if(!c.pid||!this.conns.has(c.pid))return;this.conns.delete(c.pid);const pl=this.players.find(p=>p.pid===c.pid);this.players=this.players.filter(p=>p.pid!==c.pid);
  toast((pl?pl.name:'A racer')+' left the room.');if(race&&race.online){const k=kartById('h:'+c.pid);if(k){k.ctrl='cpu';}}this.sendLobby();},
 hostMsg(d,c){if(!d||!d.t)return;switch(d.t){
  case'hello':{if(this.players.length>=8){this.ss(c,{t:'full'});setTimeout(()=>{try{c.close();}catch(e){}},400);return;}
   const pid='p'+(++this.pidN);c.pid=pid;this.conns.set(pid,c);this.players.push({pid,char:CH[d.char]?d.char:'barnaby',name:'Player '+(this.players.length+1)});
   this.ss(c,{t:'welcome',pid});this.sendLobby();toast('A racer joined the room.');Snd.sfx('honk');break;}
  case'char':{const p=this.players.find(q=>q.pid===c.pid);if(p&&CH[d.char]){p.char=d.char;this.sendLobby();}break;}
  case's':this.applyState(d.d);this.relay({t:'S',l:[d.d]},c);break;
  case'e':applyEvent(d.e);this.relay(d,c);break;}},
 clientMsg(d){if(!d||!d.t)return;switch(d.t){
  case'welcome':this.myPid=d.pid;this.status='';go('lobby');break;
  case'full':this.status='That room is full (8 racers).';break;
  case'lobby':this.players=d.players;this.lobby=d.lobby;this.inRace=d.inRace;break;
  case'race':this.startFromMsg(d);break;
  case'S':for(const s of d.l)this.applyState(s);break;
  case'e':applyEvent(d.e);break;
  case'res':if(race&&!race.ended){race.ended=true;applyResults(d.order);}break;
  case'podium':if(Cup)go('podium',()=>music('podium',31,128));break;
  case'toLobby':race=null;Cup=null;Music.stop();go('lobby');break;}},
 sendLobby(){if(this.host)this.send({t:'lobby',players:this.players,lobby:this.lobby,inRace:this.inRace});},
 setChar(id){if(!this.on)return;if(this.host){const p=this.players.find(q=>q.pid==='h');if(p)p.char=id;this.sendLobby();}else this.send({t:'char',char:id});},
 startCup(){if(this.inRace)return;Cup={cup:this.lobby.cup,race:0,online:true,cc:this.lobby.cc,laps:this.lobby.laps,st:{},cpus:pickCpus(this.players.map(p=>p.char)),last:null,unlocked:false};this.hostStartRace();},
 hostStartRace(){const list=this.players.map(p=>({ch:CH[p.char]||CHARS[0],pid:p.pid,kid:'h:'+p.pid,name:p.name,key:'h:'+p.pid,human:1}));
  Cup.cpus.filter(id=>!this.players.some(p=>p.char===id)).slice(0,Math.max(0,8-list.length)).forEach(id=>list.push({ch:CH[id],pid:null,kid:'c:'+id,name:CH[id].name,key:'c:'+id}));
  const msg={t:'race',cup:Cup.cup,cupRace:Cup.race,cc:Cup.cc,laps:Cup.laps,roster:gridOrder(list).map(e=>({kid:e.kid,pid:e.pid,char:e.ch.id,name:e.name,key:e.key}))};
  this.inRace=true;this.send(msg);this.sendLobby();this.startFromMsg(msg);},
 startFromMsg(d){if(!this.host&&(!Cup||!Cup.online||d.cupRace===0||Cup.cup!==d.cup))Cup={cup:d.cup,race:d.cupRace,online:true,cc:d.cc,laps:d.laps,st:{},cpus:[],last:null,unlocked:false};Cup.race=d.cupRace;
  const ros=d.roster.map(e=>({ch:CH[e.char]||CHARS[0],kid:e.kid,ctrl:e.pid===this.myPid?'me':e.pid?'remote':'cpu',name:e.name,key:e.key}));
  if(!ros.some(e=>e.ctrl==='me'))return;loadRace({ti:d.cup*10+d.cupRace,roster:ros,cc:d.cc,laps:d.laps,online:true});},
 pack(k){let f=0;if(k.drift)f|=1;if(k.spin>0)f|=2;if(k.squash>0)f|=4;if(k.boost>0)f|=8;if(k.shoe>0)f|=16;if(k.ghost>0)f|=64;if(k.pie>0)f|=128;if(k.ink>0)f|=256;if(k.giant>0)f|=512;if(k.vanish>0)f|=1024;if(k.rocket>0)f|=2048;
  return[k.kid,Math.round(k.x*10)/10,Math.round(k.y*10)/10,Math.round(k.a*1000)/1000,Math.round(k.v),f,k.lap,k.idx,Math.round(k.lz),Math.round(k.steer*100)/100,k.resp>0?Math.round(k.resp*100)/100:0];},
 applyState(s){if(!race||!Array.isArray(s))return;const k=kartById(s[0]);if(!k||isLocal(k))return;k.net={x:s[1],y:s[2],a:s[3],v:s[4],f:s[5],lap:s[6],idx:s[7],lz:s[8],st:s[9],resp:s[10],t:performance.now()};},
 event(e){this.send({t:'e',e});},
 tick(dt){this.sendT-=dt;if(this.sendT>0)return;this.sendT=.05;if(this.host)this.send({t:'S',l:race.karts.filter(isLocal).map(k=>this.pack(k))});else if(race.me)this.send({t:'s',d:this.pack(race.me)});},
 checkEnd(){const r=race,hum=r.karts.filter(k=>k.ctrl!=='cpu'),fh=hum.filter(k=>k.fin);
  if(hum.every(k=>k.fin)||(fh.length&&r.raceT-Math.min(...fh.map(k=>k.time))>25)){r.ended=true;const order=finalOrder();this.send({t:'res',order});applyResults(order);}},
 toLobby(){this.inRace=false;this.send({t:'toLobby'});this.sendLobby();race=null;Cup=null;Music.stop();go('lobby');}};
function remoteKart(k,dt){const n=k.net;if(!n)return;const age=Math.min(.25,(performance.now()-n.t)/1000),tx=n.x+Math.cos(n.a)*n.v*age,ty=n.y+Math.sin(n.a)*n.v*age;
 if(Math.hypot(tx-k.x,ty-k.y)>160){k.x=tx;k.y=ty;}else{k.x+=(tx-k.x)*Math.min(1,dt*12);k.y+=(ty-k.y)*Math.min(1,dt*12);}
 k.a+=angDiff(n.a,k.a)*Math.min(1,dt*12);k.ma=k.a;k.v=n.v;const f=n.f;k.drift=!!(f&1);if(f&2)k.spinA+=dt*15;else k.spinA=0;k.squash=f&4?1:0;k.boost=f&8?.2:0;k.shoe=f&16?.2:0;
 k.resp=n.resp||0;k.ghost=f&64?.3:0;k.pie=f&128?1:0;k.ink=f&256?1:0;k.giant=f&512?.3:0;k.vanish=f&1024?.3:0;k.rocket=f&2048?.3:0;k.spin=f&2?.3:0;k.lz=n.lz;k.steer=n.st;}
// ================= MAIN =================
let VS=1,frameN=0,last=performance.now(),FDT=1/60,READY=false;
{const st=Music.stop.bind(Music);Music.stop=function(){st();this.curKey=null;};}
function resize(){const sw=innerWidth,sh=innerHeight,sc=Math.min(sw/W,sh/H),cw=Math.floor(W*sc),ch=Math.floor(H*sc);canvas.style.width=cw+'px';canvas.style.height=ch+'px';
 const dpr=Math.min(window.devicePixelRatio||1,2);let bw=Math.round(cw*dpr),bh=Math.round(ch*dpr);const mx=Save.d.hq?1920:1280;if(bw>mx){bh=Math.round(bh*mx/bw);bw=mx;}
 canvas.width=Math.max(W/2,bw);canvas.height=Math.max(H/2,bh);VS=canvas.width/W;if(scr==='join')positionCode();}
let lastFilter='';function applyFilter(){let f;if(Save.d.bw)f='grayscale(1) contrast(1.2) brightness(1.04)';else if(scr==='race'&&race)f=race.def.cup<2?'sepia(.3) saturate(.9)':'saturate(1.14) contrast(1.03)';else f='sepia(.12)';if(f!==lastFilter){wrapEl.style.filter=f;lastFilter=f;}}
function onScreen(s){if(s==='cups')UI.focus=4;codeInput.style.display=s==='join'?'block':'none';if(s==='join'){positionCode();setTimeout(()=>{try{codeInput.focus();}catch(e){}},60);}
 if(['title','chars','cups','options','controls','mp','join','lobby'].includes(s))music('menu',4242,138);}
function update(dt){scrT+=dt;if(toastT>0)toastT-=dt;
 if(trans){Input.click=null;Input.enter=false;Input.back=false;trans.t+=dt;if(!trans.sw&&trans.t>=.2){trans.sw=true;scr=trans.to;scrT=0;UI.focus=0;if(trans.fn)trans.fn();onScreen(scr);}if(trans.t>=.42)trans=null;}
 const pe=actEdge('pause')||Input.mPause;Input.mPause=false;
 if(scr==='loading'){loadT+=dt;if(loadT>.05&&pendingRace){const o=pendingRace;pendingRace=null;race=newRace(o);race.src=o;scr='race';UI.focus=0;}}
 else if(scr==='race'&&race){if(pe&&!trans&&race.phase!=='intro'){paused=!paused;UI.focus=0;Snd.sfx('click');updTouch();}if(!paused||race.online)raceUpdate(dt);}}
function draw(){frameN++;ctx.setTransform(VS,0,0,VS,0,0);ctx.fillStyle=INK;ctx.fillRect(0,0,W,H);
 if(!READY){ctx.fillStyle='#1c1510';ctx.fillRect(0,0,W,H);txt('Loading the picture…',W/2,H/2,26,'#e9d8b4','center',DISP,false,'middle');return;}
 uiNav();
 switch(scr){case'title':drawTitle();break;case'chars':drawChars();break;case'cups':drawCups();break;case'options':drawOptions();break;case'controls':drawControls();break;
  case'mp':drawMP();break;case'join':drawJoin();break;case'lobby':drawLobby();break;case'results':if(Cup)drawResults();break;case'podium':if(Cup)drawPodium();break;
  case'loading':{const o=pendingRace||(race&&race.src);if(o){const d=TRACKS[o.ti];drawIntroCard(d,d.cup,o.ti%10,0);}break;}
  case'race':if(race)drawRace();break;}
 uiEnd();
 if(toastT>0){ctx.font=FONT(18,BODY);const w=Math.round(Math.min(W-80,ctx.measureText(toastMsg).width+56));blit(cached('toast|'+w,w,42,16,(g,ww,hh)=>paperCard(g,ww,hh,'#f1e3c2',14,3.4)),W/2-w/2,H-116,1,0,Math.min(1,toastT*3));ctx.globalAlpha=Math.min(1,toastT*3);txt(toastMsg,W/2,H-95,18,INK,'center',BODY,false,'middle');ctx.globalAlpha=1;}
 if(IS_TOUCH&&innerHeight>innerWidth*1.1){blit(ribbonCanvas(460,40,'Turn your phone sideways','#c2452f'),W/2-230,8);}
 if(trans)irisDraw(trans.t<.2?1-trans.t/.2:(trans.t-.2)/.22);
 ctx.setTransform(VS,0,0,VS,0,0);Film.draw();applyFilter();}
function frame(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;FDT=dt||1/60;try{update(dt);draw();}catch(e){console.error(e);}requestAnimationFrame(frame);}
(async function boot(){await Save.load();resize();Film.init();addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
 const fontsReady=(document.fonts&&document.fonts.load)?Promise.race([Promise.all([document.fonts.load('900 40px "Rokkitt"'),document.fonts.load('800 40px "Rokkitt"'),document.fonts.load('500 20px "Jost"')]),new Promise(r=>setTimeout(r,3000))]).catch(()=>{}):Promise.resolve();
 requestAnimationFrame(frame);await fontsReady;READY=true;onScreen('title');})();
