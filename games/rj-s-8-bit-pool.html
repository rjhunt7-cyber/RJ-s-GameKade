 {name:'MOON BASE',desc:'LOW GRAVITY. LIVELY RAILS.',felt:'#68707c',felt2:'#626a76',cush:'#464e5a',rail:'#3c3c4c',railD:'#14141c',railL:'#a8b0c8',dia:'#58f8fc',floor:'stars',fl:['#000008','#fcfcfc','#383858'],fric:54,drag:0.29,ec:.88,cm:12,sm:9}

/* ---------- table geometry (cushion segments + pockets) ---------- */
const PDIR=[[-.7071,-.7071],[.7071,-.7071],[-.7071,.7071],[.7071,.7071],[0,-1],[0,1]];
function geom(t){
 if(t.g)return t.g;
 const cm=t.cm,sm=t.sm,J=8,segs=[];
 const add=(a,b,c,d)=>segs.push([a,b,c,d]);
 add(FL+cm,FT,CX-sm,FT);add(CX+sm,FT,FR-cm,FT);
 add(FL+cm,FB,CX-sm,FB);add(CX+sm,FB,FR-cm,FB);
 add(FL,FT+cm,FL,FB-cm);add(FR,FT+cm,FR,FB-cm);
 const cj=(x,y,sx,sy)=>{add(x+sx*cm,y,x+sx*(cm-6),y-sy*J);add(x,y+sy*cm,x-sx*J,y+sy*(cm-6));};
 cj(FL,FT,1,1);cj(FR,FT,-1,1);cj(FL,FB,1,-1);cj(FR,FB,-1,-1);
 for(const [y,sy] of [[FT,1],[FB,-1]]){add(CX-sm,y,CX-sm-1,y-sy*J);add(CX+sm,y,CX+sm+1,y-sy*J);}
 const cr=cm*0.78,co=2.5;
 const pk=[[FL-co,FT-co,cr],[FR+co,FT-co,cr],[FL-co,FB+co,cr],[FR+co,FB+co,cr],[CX,FT-4.5,sm*0.95],[CX,FB+4.5,sm*0.95]];
 const aim=[[FL-1,FT-1],[FR+1,FT-1],[FL-1,FB+1],[FR+1,FB+1],[CX,FT-2],[CX,FB+2]];
 t.g={raw:segs,segs:segs.map(([a,b,c,d])=>{const dx=c-a,dy=d-b;return{a,b,dx,dy,l2:dx*dx+dy*dy}}),pk,aim};
 return t.g;
}

/* ---------- physics ---------- */
// S = {b:[balls], spinF, spinS, rec, ev}
function pocketBall(S,o,k){o.on=false;o.vx=0;o.vy=0;if(S.rec)S.rec.pocketed.push(o.n);if(S.ev)S.ev.push(['p',o.n,k,o.x,o.y]);}
function step(S,t){
 const g=geom(t),B=S.b,n=B.length,segs=g.segs,pk=g.pk;
 for(let i=0;i<n;i++){const o=B[i];o.mv=false;if(!o.on)continue;const vx=o.vx,vy=o.vy;if(vx===0&&vy===0)continue;
  const sp=Math.sqrt(vx*vx+vy*vy);let ns=sp-(t.fric+sp*t.drag)*DT;if(ns<2.5)ns=0;
  const k=ns/sp;o.vx=vx*k;o.vy=vy*k;o.x+=o.vx*DT;o.y+=o.vy*DT;o.mv=true;
  if(i===0&&S.spinF!==0)S.spinF*=1-ns*DT*0.0035;}
 for(let i=0;i<n;i++){const a=B[i];if(!a.on)continue;
  for(let j=i+1;j<n;j++){const c=B[j];if(!c.on||(!a.mv&&!c.mv))continue;
   const dx=c.x-a.x,dy=c.y-a.y,d2=dx*dx+dy*dy;if(d2>=D2||d2===0)continue;
   const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(2*R-d)/2;
   a.x-=nx*ov;a.y-=ny*ov;c.x+=nx*ov;c.y+=ny*ov;
   const vn=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny;if(vn<=0)continue;
   const ix=a.vx,iy=a.vy,jm=vn*(1+E_B)/2;
   a.vx-=jm*nx;a.vy-=jm*ny;c.vx+=jm*nx;c.vy+=jm*ny;a.mv=c.mv=true;
   if(i===0&&S.brk){S.brk=false;breakBurst(S,ix,iy);continue;}
   if(i===0){if(S.rec&&S.rec.first===null)S.rec.first=c.n;
    if(S.spinF!==0){const sp=Math.sqrt(ix*ix+iy*iy);if(sp>0){const k=S.spinF*0.62*vn/sp;a.vx+=ix*k;a.vy+=iy*k;}S.spinF*=0.15;}}
   if(S.ev)S.ev.push(['b',vn,(a.x+c.x)/2,(a.y+c.y)/2]);}}
 for(let i=0;i<n;i++){const o=B[i];if(!o.on||!o.mv)continue;
  for(let q=0;q<segs.length;q++){const s=segs[q];let tt=((o.x-s.a)*s.dx+(o.y-s.b)*s.dy)/s.l2;tt=tt<0?0:tt>1?1:tt;
   const qx=s.a+s.dx*tt,qy=s.b+s.dy*tt,dx=o.x-qx,dy=o.y-qy,d2=dx*dx+dy*dy;if(d2>=R*R||d2===0)continue;
   const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;o.x=qx+nx*R;o.y=qy+ny*R;
   const vn=o.vx*nx+o.vy*ny;if(vn>=0)continue;
   o.vx-=(1+t.ec)*vn*nx;o.vy-=(1+t.ec)*vn*ny;
   const tx=-ny,ty=nx,vt=o.vx*tx+o.vy*ty;o.vx-=tx*vt*0.08;o.vy-=ty*vt*0.08;
   if(i===0&&S.spinS!==0){const k=S.spinS*0.45*(-vn);o.vx+=ny*k;o.vy-=nx*k;S.spinS*=0.5;}
   if(S.rec&&S.rec.first!==null)S.rec.rail=true;
   if(S.ev)S.ev.push(['c',-vn,qx,qy]);}
  for(let k=0;k<6;k++){const p=pk[k],dx=o.x-p[0],dy=o.y-p[1];if(dx*dx+dy*dy<p[2]*p[2]){pocketBall(S,o,k);break;}}
  if(o.on&&(o.x<FL-R-3||o.x>FR+R+3||o.y<FT-R-3||o.y>FB+R+3)){let bk=0,bd=1e9;for(let k=0;k<6;k++){const dx=o.x-pk[k][0],dy=o.y-pk[k][1],dd=dx*dx+dy*dy;if(dd<bd){bd=dd;bk=k;}}pocketBall(S,o,bk);}}
 for(let i=0;i<n;i++){const o=B[i];if(o.on&&(o.vx!==0||o.vy!==0))return true;}
 return false;
}

// a real rack spreads because many balls collide at once; pairwise resolution acts like a
// Newton's cradle, so the opening hit shares the cue ball's energy through the rack (seeded, so both players match)
function breakBurst(S,ix,iy){
 const B=S.b,c=B[0],vc=Math.sqrt(ix*ix+iy*iy);if(vc<1)return;const dx=ix/vc,dy=iy/vc,r=rng(S.seed||1);
 let mx=0,my=0,n=0;for(let i=1;i<B.length;i++)if(B[i].on){mx+=B[i].x;my+=B[i].y;n++;}mx/=n;my/=n;
 const s=Math.max(0.15,Math.min(1,(vc-80)/520));
 for(let i=1;i<B.length;i++){const o=B[i];if(!o.on)continue;let rx=o.x-mx,ry=o.y-my;const l=Math.sqrt(rx*rx+ry*ry)||1;rx/=l;ry/=l;
  const f=vc*s*(0.18+0.3*r()),q=vc*s*(0.3+0.45*r()),j=(r()-0.5)*0.6;
  o.vx+=dx*f+rx*q+(-dy)*j*q;o.vy+=dy*f+ry*q+dx*j*q;}
 if(S.rec&&S.rec.first===null){let bi=1,bd=1e9;for(let i=1;i<B.length;i++){const o=B[i];if(!o.on)continue;const ex=o.x-c.x,ey=o.y-c.y,d=ex*ex+ey*ey;if(d<bd){bd=d;bi=i;}}S.rec.first=B[bi].n;}
 const k=0.12+0.1*r();c.vx=ix*k+(-dy)*(r()-0.5)*vc*0.18;c.vy=iy*k+dx*(r()-0.5)*vc*0.18;
 if(S.ev)S.ev.push(['b',vc,c.x,c.y]);
}

/* ---------- rack + rules ---------- */
const typeOf=n=>n===0?'C':n===8?'8':n<8?'S':'T';
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function rackBalls(seed){
 const r=rng(seed);const dx=2*R*0.866+0.08,dy=2*R+0.08;const pos=[];
 for(let k=0;k<5;k++)for(let i=0;i<=k;i++)pos.push([FOOTX+k*dx,CY+(i-k/2)*dy]);
 const order=new Array(15).fill(0);order[0]=1;order[4]=8;
 const solids=[2,3,4,5,6,7],stripes=[9,10,11,12,13,14,15];
 const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
 sh(solids);sh(stripes);
 const flip=r()<0.5;order[10]=flip?solids.pop():stripes.pop();order[14]=flip?stripes.pop():solids.pop();
 const rest=sh(solids.concat(stripes));let q=0;for(let i=0;i<15;i++)if(!order[i])order[i]=rest[q++];
 const b=[{n:0,x:FL+FW*0.2,y:CY,vx:0,vy:0,on:true}];
 for(let i=0;i<15;i++)b.push({n:order[i],x:pos[i][0],y:pos[i][1],vx:0,vy:0,on:true});
 return b;
}
function newRack(seed,breaker,wins){
 return{b:rackBalls(seed),turn:breaker,breaker,groups:[null,null],isBreak:true,bih:true,kitchen:true,over:null,wins:wins||[0,0],seed};
}
function freeSpot(st,x,y,skip){
 for(let k=0;k<200;k++){const px=x+k*0.5;if(px>FR-R){x=FL+R;}
  let ok=true;for(const o of st.b)if(o.on&&o.n!==skip){const dx=o.x-px,dy=o.y-y;if(dx*dx+dy*dy<D2+0.5){ok=false;break;}}
  if(ok)return[px,y];}
 return[x,y];
}
function legalSpot(st,x,y){
 if(x<FL+R||x>FR-R||y<FT+R||y>FB-R)return false;
 if(st.kitchen&&x>KITCHEN)return false;
 for(const o of st.b)if(o.on&&o.n!==0){const dx=o.x-x,dy=o.y-y;if(dx*dx+dy*dy<D2+0.3)return false;}
 return true;
}
function evalShot(st,rec){
 const p=st.turn,o=1-p;let g=st.groups[p];
 const pk=rec.pocketed,scratch=pk.includes(0),eight=pk.includes(8);
 const cleared=g!==null&&!st.b.some(b=>typeOf(b.n)===g&&(b.on||pk.includes(b.n)));
 let foul=null;
 if(scratch)foul='SCRATCH';
 else if(rec.first===null)foul='NO BALL HIT';
 else if(!st.isBreak){
  const f=typeOf(rec.first);
  const ok=g===null?f!=='8':cleared?f==='8':f===g;
  if(!ok)foul='WRONG BALL HIT FIRST';
  else if(!rec.rail&&pk.length===0)foul='NO RAIL AFTER HIT';
 }
 const res={foul,pocketed:pk.slice(),cont:false,assigned:null,respot:false,shooter:p};
 if(eight){
  if(st.isBreak){const e=st.b.find(b=>b.n===8);const s=freeSpot(st,FOOTX,CY,8);e.x=s[0];e.y=s[1];e.on=true;e.vx=e.vy=0;res.respot=true;}
  else{const win=cleared&&!foul;
   st.over={winner:win?p:o,reason:win?'SANK THE 8 BALL':!cleared?'8 BALL SUNK TOO EARLY':foul==='SCRATCH'?'SCRATCHED ON THE 8':'FOUL ON THE 8 BALL'};
   st.wins[st.over.winner]++;st.isBreak=false;return res;}
 }
 if(!st.isBreak&&g===null&&!foul){const fp=pk.find(n=>n!==0&&n!==8);if(fp!==undefined){g=typeOf(fp);st.groups[p]=g;st.groups[o]=g==='S'?'T':'S';res.assigned=g;}}
 const own=pk.some(n=>n!==0&&n!==8&&(g===null||typeOf(n)===g));
 res.cont=!foul&&own;
 if(foul){st.turn=o;st.bih=true;}
 else{st.bih=false;if(!res.cont)st.turn=o;}
 st.kitchen=false;
 if(scratch){const c=st.b[0];c.on=true;c.vx=c.vy=0;const s=freeSpot(st,FL+FW*0.2,CY,0);c.x=s[0];c.y=s[1];}
 st.isBreak=false;
 return res;
}
function groupLeft(st,p){const g=st.groups[p];if(!g)return null;return st.b.filter(b=>b.on&&typeOf(b.n)===g).length;}

/* ---------- simulation helpers ---------- */
function cloneBalls(b){return b.map(o=>({n:o.n,x:o.x,y:o.y,vx:0,vy:0,on:o.on}));}
function cloneState(st){return{b:cloneBalls(st.b),turn:st.turn,breaker:st.breaker,groups:st.groups.slice(),isBreak:st.isBreak,bih:st.bih,kitchen:st.kitchen,over:st.over?{...st.over}:null,wins:st.wins.slice(),seed:st.seed};}
function simShot(st,t,shot){
 const st2=cloneState(st);const S={b:st2.b,brk:st.isBreak,seed:st.seed,spinF:shot.f,spinS:shot.s,rec:{first:null,rail:false,pocketed:[]},ev:null};
 const c=S.b[0];c.on=true;c.x=shot.cx;c.y=shot.cy;c.vx=shot.vx;c.vy=shot.vy;
 let k=0;while(step(S,t)&&k<30000)k++;
 const res=evalShot(st2,S.rec);return{st2,res};
}

/* ---------- bot ---------- */
function legalTargets(st,p){
 const on=st.b.filter(o=>o.on&&o.n!==0);if(st.isBreak)return on;
 const g=st.groups[p];if(g===null)return on.filter(o=>o.n!==8);
 const mine=on.filter(o=>typeOf(o.n)===g);return mine.length?mine:on.filter(o=>o.n===8);
}
function pathClear(B,ax,ay,bx,by,s1,s2,rad){
 const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;if(l2<1e-6)return true;
 for(const o of B){if(!o.on||o.n===s1||o.n===s2)continue;let t=((o.x-ax)*dx+(o.y-ay)*dy)/l2;t=t<0?0:t>1?1:t;
  const qx=ax+dx*t-o.x,qy=ay+dy*t-o.y;if(qx*qx+qy*qy<rad*rad)return false;}
 return true;
}
function geoCands(st,t,p,cx,cy){
 const g=geom(t),out=[];
 for(const o of legalTargets(st,p))for(let k=0;k<6;k++){
  const [px,py]=g.aim[k];let ux=px-o.x,uy=py-o.y;const L=Math.sqrt(ux*ux+uy*uy);ux/=L;uy/=L;
  if(ux*PDIR[k][0]+uy*PDIR[k][1]<(k<4?0.3:0.55))continue;
  const gx=o.x-ux*2*R,gy=o.y-uy*2*R;let ax=gx-cx,ay=gy-cy;const La=Math.sqrt(ax*ax+ay*ay);if(La<1)continue;ax/=La;ay/=La;
  const cut=ax*ux+ay*uy;if(cut<0.25)continue;
  if(gx<FL+R-1||gx>FR-R+1||gy<FT+R-1||gy>FB-R+1)continue;
  if(!pathClear(st.b,cx,cy,gx,gy,0,o.n,2*R-0.3))continue;
  if(!pathClear(st.b,o.x,o.y,px,py,0,o.n,2*R-0.3))continue;

 4:['#3c1c9c','#6844fc','#a890fc'],5:['#a83800','#f87800','#fcbc70'],6:['#005800','#00a800','#80e470'],7:['#581008','#a01808','#d86048'],8:['#000000','#1c1c1c','#6c6c6c']};
const WH=['#9c9c9c','#ece8dc','#fcfcfc'];
const ballPal=n=>BP[n>8?n-8:n];
const ROT={};
function resetRot(){for(let n=0;n<16;n++){const a=Math.random()*6.28,z=0.2+Math.random()*0.8,s=Math.sqrt(1-z*z);ROT[n]=[Math.cos(a)*s,Math.sin(a)*s,z];ROT[n].px=null;}}
resetRot();
function rollBall(n,x,y){const v=ROT[n];if(v.px===null){v.px=x;v.py=y;return;}const dx=x-v.px,dy=y-v.py;v.px=x;v.py=y;const d=Math.sqrt(dx*dx+dy*dy);if(d<1e-4||d>40)return;
 const ux=dx/d,uy=dy/d,kx=-uy,ky=ux,th=d/R,c=Math.cos(th),s=Math.sin(th);const[x0,y0,z0]=v;const kv=kx*x0+ky*y0;
 const cx=ky*z0,cy=-kx*z0,cz=kx*y0-ky*x0;let nx=x0*c+cx*s+kx*kv*(1-c),ny=y0*c+cy*s+ky*kv*(1-c),nz=z0*c+cz*s;
 const L=Math.sqrt(nx*nx+ny*ny+nz*nz);v[0]=nx/L;v[1]=ny/L;v[2]=nz/L;}
const LX=-0.45,LY=-0.55,LZ=0.704;
function drawBall(n,x,y,g=ctx,alpha=1){
 const v=ROT[n],P=ballPal(n),x0=Math.round(x-4.5),y0=Math.round(y-4.5);if(alpha<1)g.globalAlpha=alpha;
 for(let j=0;j<9;j++){const ny=(j+0.5-4.5)/4.5;for(let i=0;i<9;i++){const nx=(i+0.5-4.5)/4.5,r2=nx*nx+ny*ny;if(r2>1.02)continue;
  const nz=Math.sqrt(Math.max(0,1-r2)),dA=nx*v[0]+ny*v[1]+nz*v[2];let pal;
  if(n===0)pal=P;else if(n>8)pal=Math.abs(dA)<0.5?P:WH;else pal=dA>0.8?WH:P;
  const li=nx*LX+ny*LY+nz*LZ;const sh=r2>0.78&&li<0.35?0:li>0.86?2:li<0.05?0:1;
  g.fillStyle=pal[sh];g.fillRect(x0+i,y0+j,1,1);}}
 if(alpha<1)g.globalAlpha=1;
}
function miniBall(n,x,y,dead){const P=ballPal(n);if(dead){ring(ctx,x,y,2.2,'#3c3c3c');return;}
 circ(ctx,x,y,2.6,n>8?WH[1]:P[1]);if(n>8)rect(x-2,y-1,5,2,P[1]);rect(x-1,y-2,1,1,n>8?WH[2]:P[2]);}

/* ===================== CUE STICK ===================== */
function cueColorAt(c,s,len){ // s = distance from tip
 if(s<1.5)return c.tip;if(s<4)return c.fer;const sh=4+len*0.5;
 if(s<sh)return s<sh*0.6?c.s1:c.s2;if(s<sh+2)return c.jt;
 const fo=sh+2+len*0.18;if(s<fo)return(Math.floor((s-sh)/3)%2)?c.f1:c.f2;
 const wr=fo+len*0.16;if(s<wr)return(Math.floor(s)%2)?c.wr:'#141414';
 if(s<len-2)return(Math.floor((s-wr)/6)%3===1)?c.b2:c.b1;return '#141414';
}
function drawCueAt(cue,tx,ty,dx,dy,len=150,g=ctx,shadow=true){ // tip at tx,ty, cue extends opposite to (dx,dy)
 const c=cue.c,px=-dy,py=dx;
 if(shadow){g.fillStyle='rgba(0,0,0,0.35)';for(let s=0;s<len;s+=1){g.fillRect(Math.round(tx-dx*s+3),Math.round(ty-dy*s+4),2,2);}}
 for(let s=0;s<len;s+=0.5){const x=tx-dx*s,y=ty-dy*s;const w=s<len*0.55?1:s<len*0.8?1.5:2;g.fillStyle=cueColorAt(c,s,len);
  for(let k=-w;k<=w;k+=1)g.fillRect(Math.round(x+px*k*0.5-0.5),Math.round(y+py*k*0.5-0.5),1,1);}
}
const cueSpr={};
function cueSprite(i){if(cueSpr[i])return cueSpr[i];const c=document.createElement('canvas');c.width=136;c.height=7;const g=c.getContext('2d');
 drawCueAt(CUES[i],133,3.5,1,0,130,g,false);cueSpr[i]=c;return c;}
/* ===================== MATCH ===================== */
let scene='title',frame=0;
let M=null; // current match
const PTR={x:CX,y:CY,down:false,type:'mouse',moved:false};
const KEY={};
function T(){return TABLES[M?M.table:SEL.table];}
const SEL={table:0,cue:[7,1],diff:'hustler',pick:0};

function newMatch(mode,opts={}){
 M={mode,table:opts.table??SEL.table,cueIds:opts.cueIds||[SEL.cue[0],SEL.cue[1]],diff:opts.diff||SEL.diff,
  ctrl:mode==='cpu'?['human','cpu']:mode==='demo'?['cpu','cpu']:['human','human'],
  names:mode==='cpu'?['YOU','CPU']:mode==='online'?(NET.isHost?['YOU','RIVAL']:['RIVAL','YOU']):mode==='demo'?['CPU 1','CPU 2']:['P1','P2'],
  st:null,phase:'idle',aim:0,power:0,charging:false,chargeT:0,spin:[0,0],msg:'',msgT:0,msg2:'',anim:[],parts:[],S:null,
  rack:0,botT:0,botPlan:null,shake:0,remote:null,overT:0,lastAimSend:0};
 if(mode==='demo'){M.diff='hustler';M.cueIds=[Math.floor(Math.random()*8),Math.floor(Math.random()*8)];}
 if(mode==='cpu')M.cueIds[1]=Math.floor(Math.random()*8);
 return M;
}
function startRack(st){ // st provided (online) or create
 if(!st){const br=M.rack===0?0:(M.st?1-M.st.breaker:0);st=newRack(Math.floor(Math.random()*4e9),br,M.st?M.st.wins:[0,0]);}
 M.st=st;M.rack++;M.overMenu=false;resetRot();M.anim=[];M.parts=[];M.S=null;M.spin=[0,0];
 M.aim=0;beginTurn('BREAK! '+sv(st.turn,'BREAKS','BREAK'));
}
function cueOf(p){return CUES[M.cueIds[p]];}
function isMine(p){if(!M)return false;if(M.mode==='online')return p===NET.me;return M.ctrl[p]==='human';}
function beginTurn(msg){
 const st=M.st;M.power=0;M.charging=false;M.botPlan=null;M.remote=null;
 if(msg)say(msg);
 if(st.over){M.phase='over';M.overT=frame;const w=st.over.winner;if(M.mode!=='demo'){if(isMine(w)||M.mode==='local')SFX.win();else SFX.lose();}return;}
 M.phase=st.bih?'place':'aim';
 if(st.bih&&st.b[0]){const c=st.b[0];c.on=true;}
 if(M.ctrl[st.turn]==='cpu'&&M.mode!=='online'){M.botT=frame+(M.mode==='demo'?35:45);}
 // aim toward table centre-ish by default
 const c=st.b[0];const tg=legalTargets(st,st.turn)[0];if(tg)M.aim=Math.atan2(tg.y-c.y,tg.x-c.x);
}
const you=p=>M.names[p]==='YOU';const sv=(p,a,b)=>M.names[p]+' '+(you(p)?b:a);const turnOf=p=>you(p)?'YOUR TURN':M.names[p]+"'S TURN";
const loud=()=>!(M&&M.mode==='demo');
function say(s,s2=''){M.msg=s;M.msg2=s2;M.msgT=frame;}

function fire(shot,local=true){
 const st=M.st,c=st.b[0];c.on=true;c.x=shot.cx;c.y=shot.cy;c.vx=shot.vx;c.vy=shot.vy;
 M.S={b:st.b,brk:st.isBreak,seed:st.seed,spinF:shot.f,spinS:shot.s,rec:{first:null,rail:false,pocketed:[]},ev:[]};
 M.phase='roll';M.charging=false;M.lastShot=shot;M.acc=0;M.cueAnim={a:Math.atan2(shot.vy,shot.vx),t:frame,p:shot.pow};
 if(loud())SFX.strike(shot.pow);if(shot.pow>0.85)M.shake=6;
 for(let i=0;i<6;i++)M.parts.push({x:c.x-Math.cos(M.cueAnim.a)*5,y:c.y-Math.sin(M.cueAnim.a)*5,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,l:16,c:cueOf(st.turn).c.tip});
 if(local&&M.mode==='online')netSend({t:'shot',shot});
}
function humanShot(){
 const st=M.st,c=st.b[0],cue=cueOf(st.turn),pw=Math.max(0.04,M.power),v=30+pw*(cueMaxV(cue)-30),mS=cueMaxSpin(cue);
 fire({cx:c.x,cy:c.y,vx:Math.cos(M.aim)*v,vy:Math.sin(M.aim)*v,f:-M.spin[1]*mS,s:M.spin[0]*mS,pow:pw});
}
function updateRoll(dtReal){
 const S=M.S;M.acc+=dtReal;let n=Math.min(60,Math.floor(M.acc/DT));M.acc-=n*DT;let moving=true;
 sndBudget=0;
 for(let i=0;i<n;i++){moving=step(S,T());if(!moving)break;}
 for(const e of S.ev){
  if(e[0]==='b'){if(loud())SFX.click(e[1]);}
  else if(e[0]==='c'){if(loud())SFX.rail(e[1]);}
  else if(e[0]==='p'){if(loud())SFX.pocket();const pk=geom(T()).pk[e[2]];M.anim.push({n:e[1],x:e[3],y:e[4],tx:pk[0],ty:pk[1],t:0});
   for(let i=0;i<8;i++)M.parts.push({x:pk[0],y:pk[1],vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*50,l:14,c:'#fcfcfc'});}
 }
 S.ev.length=0;
 if(!moving){
  if(M.mode==='online'&&!NET.isHost){M.phase='sync';return;}
  finishShot();
 }
}
function shotMsg(st,res,p,wasBreak){
 let msg='',msg2='';
 if(st.over){msg=you(st.over.winner)?'YOU WIN!':M.names[st.over.winner]+' WINS!';msg2=st.over.reason;}
 else if(res.foul){msg='FOUL: '+res.foul;msg2=sv(st.turn,'HAS','HAVE')+' BALL IN HAND';if(loud())SFX.foul();}
 else if(res.assigned){msg=sv(p,'IS','ARE')+' '+(res.assigned==='S'?'SOLIDS':'STRIPES');msg2='SHOOT AGAIN';if(loud())SFX.good();}
 else if(res.cont){msg=wasBreak?'GOOD BREAK!':'NICE SHOT!';msg2=sv(p,'SHOOTS','SHOOT')+' AGAIN';if(res.respot)msg='8 BALL RESPOTTED';}
 else{msg=res.respot?'8 BALL RESPOTTED':wasBreak?'NOTHING DOWN ON THE BREAK':'NO BALL DOWN';msg2=turnOf(st.turn);}
 return[msg,msg2];
}
function finishShot(){
 const st=M.st,rec=M.S.rec,p=st.turn,wasBreak=st.isBreak;const res=evalShot(st,rec);M.S=null;
 const [msg,msg2]=shotMsg(st,res,p,wasBreak);
 if(M.mode==='online'&&NET.isHost)netSend({t:'state',st:packState(st),res,p,wb:wasBreak});
 beginTurn();say(msg,msg2);
}
function packState(st){return{...st,b:st.b.map(o=>({n:o.n,x:o.x,y:o.y,vx:0,vy:0,on:o.on}))};}

/* ---------- bot driver ---------- */
function updateBot(){
 const st=M.st;if(M.ctrl[st.turn]!=='cpu'||M.mode==='online')return;if(!(M.phase==='place'||M.phase==='aim'))return;
 if(frame<M.botT)return;
 if(!M.botPlan){M.botPlan=botPlan(st,T(),cueOf(st.turn),M.mode==='demo'?(st.turn?'hustler':'shark'):M.diff);M.botPlan.t0=frame;M.botPlan.a0=M.aim;
  M.botPlan.sx=st.b[0].x;M.botPlan.sy=st.b[0].y;let da=M.botPlan.ang-M.aim;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;M.botPlan.da=da;}
 const P=M.botPlan,k=frame-P.t0,c=st.b[0];
 if(M.phase==='place'){const u=Math.min(1,k/30);c.x=P.sx+(P.cx-P.sx)*u;c.y=P.sy+(P.cy-P.sy)*u;if(u>=1){M.phase='aim';if(loud())SFX.place();P.t0=frame;}return;}
 const u=Math.min(1,k/40),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;M.aim=P.a0+P.da*e;
 if(k>45){M.charging=true;const q=Math.min(1,(k-45)/30);M.power=P.pow*q;if(q>=1&&k>80){M.aim=P.ang;fire(P);}}
}

/* ---------- aim guide ---------- */
function castRay(st,x,y,dx,dy,skip,maxLen=700){
 let best=maxLen,hit=null;
 for(const o of st.b){if(!o.on||o.n===skip)continue;const ox=x-o.x,oy=y-o.y,b=dx*ox+dy*oy,cc=ox*ox+oy*oy-D2,disc=b*b-cc;if(disc<0)continue;const t=-b-Math.sqrt(disc);if(t>0.01&&t<best){best=t;hit=o;}}
 const g=geom(T());let rail=null;
 for(let s=0;s<best;s+=0.5){const px=x+dx*s,py=y+dy*s;
  for(const sg of g.segs){let tt=((px-sg.a)*sg.dx+(py-sg.b)*sg.dy)/sg.l2;tt=tt<0?0:tt>1?1:tt;const qx=sg.a+sg.dx*tt-px,qy=sg.b+sg.dy*tt-py;
   if(qx*qx+qy*qy<R*R){const d=Math.sqrt(qx*qx+qy*qy)||1;rail={t:s,nx:-qx/d,ny:-qy/d};break;}}
  if(rail)break;
  for(const p of g.pk){const ex=px-p[0],ey=py-p[1];if(ex*ex+ey*ey<p[2]*p[2]){return{t:s,type:'pocket'};}}
 }
 if(rail)return{t:rail.t,type:'rail',nx:rail.nx,ny:rail.ny};
 if(hit)return{t:best,type:'ball',o:hit};
 return{t:best,type:'none'};
}
function dots(x,y,dx,dy,len,col,gap=3){for(let s=0;s<len;s+=gap){rect(x+dx*s-0.5,y+dy*s-0.5,1,1,col);}}
function drawGuide(st,aim,cue){
 const c=st.b[0],dx=Math.cos(aim),dy=Math.sin(aim),lv=cue.aim;
 const r=castRay(st,c.x,c.y,dx,dy,0);const lim=lv===1?70:900;const len=Math.min(r.t,lim);
 dots(c.x,c.y,dx,dy,len,'rgba(252,252,252,0.85)');
 if(len<r.t)return;
 const gx=c.x+dx*r.t,gy=c.y+dy*r.t;
 if(r.type==='ball'){ring(ctx,gx,gy,4.5,'#fcfcfc',2);
  const o=r.o,ux=(o.x-gx)/(2*R),uy=(o.y-gy)/(2*R),cut=dx*ux+dy*uy;
  const L=[0,0,22,38,62,90][lv]*(0.4+0.6*cut);if(L>0)dots(o.x,o.y,ux,uy,L,ballPal(o.n)[2],2);
  let tx=dx-cut*ux,ty=dy-cut*uy;const tl=Math.sqrt(tx*tx+ty*ty);
  const CL=[0,0,0,14,26,40][lv]*tl;if(CL>2&&tl>0.01)dots(gx,gy,tx/tl,ty/tl,CL,'#7c7c7c',2);
  if(st.groups[st.turn]&&!st.isBreak){const g=st.groups[st.turn],left=groupLeft(st,st.turn);const ok=left?typeOf(o.n)===g:o.n===8;if(!ok){rect(o.x-3,o.y-8,7,1,'#e40058');txt('X',o.x-2,o.y-16,'#e40058');}}
 }else if(r.type==='rail'){ring(ctx,gx,gy,4.5,'#bcbcbc',2);
  if(lv>=5){const d=dx*r.nx+dy*r.ny,rx=dx-2*d*r.nx,ry=dy-2*d*r.ny;const r2=castRay(st,gx,gy,rx,ry,0,60);dots(gx,gy,rx,ry,Math.min(60,r2.t),'rgba(252,252,252,0.5)');}}
}

/* ---------- drawing the play field ---------- */
function drawPlayfield(){
 const st=M.st;let sx=0,sy=0;if(M.shake>0){sx=Math.round((Math.random()-.5)*M.shake*0.5);sy=Math.round((Math.random()-.5)*M.shake*0.5);M.shake--;}
 ctx.save();ctx.translate(sx,sy);
 ctx.drawImage(tableCanvas(M.table),0,0);
 const t=T();
 // shadows
 for(const o of st.b)if(o.on)circ(ctx,o.x+1.2,o.y+1.6,4.3,'rgba(0,0,0,0.33)');
 // pocket animations
 for(let i=M.anim.length-1;i>=0;i--){const a=M.anim[i];a.t++;const u=Math.min(1,a.t/7);
  if(u<1){const x=a.x+(a.tx-a.x)*u,y=a.y+(a.ty-a.y)*u;if(u<0.6)drawBall(a.n,x,y,ctx,1-u*0.6);else circ(ctx,x,y,4.5*(1-u)+1,ballPal(a.n)[0]);}else M.anim.splice(i,1);}
 // balls
 const showPlace=M.phase==='place';
 for(const o of st.b){if(!o.on)continue;if(o.n===0&&showPlace&&isMine(st.turn)&&!M.botPlan)continue;rollBall(o.n,o.x,o.y);drawBall(o.n,o.x,o.y);}
 // particles
 for(let i=M.parts.length-1;i>=0;i--){const p=M.parts[i];p.x+=p.vx/60;p.y+=p.vy/60;p.vx*=.9;p.vy*=.9;if(--p.l<=0){M.parts.splice(i,1);continue;}rect(p.x,p.y,1,1,p.c);}
 const me=isMine(st.turn),cue=cueOf(st.turn);
 // ball in hand (human)
 if(showPlace&&me&&!M.botPlan){const ok=legalSpot(st,PTR.x,PTR.y);const p=clampPlace(PTR.x,PTR.y);
  if(st.kitchen){ctx.fillStyle='rgba(252,252,252,0.07)';ctx.fillRect(FL,FT,KITCHEN-FL,FHT);}
  drawBall(0,p[0],p[1],ctx,legalSpot(st,p[0],p[1])?1:0.45);if(!legalSpot(st,p[0],p[1])){txt('X',p[0]-2,p[1]-3,'#e40058',1,0,null);}
  if(frame%60<40)txt('BALL IN HAND',p[0],p[1]-16,'#f8d878',1,1);}
 // aim + cue
 if(M.phase==='aim'||(M.phase==='place'&&M.botPlan)){
  let aim=M.aim,pow=M.power,show=true;
  if(M.mode==='online'&&!me){if(M.remote){aim=M.remote.a;pow=M.remote.pw;}else show=false;}
  if(show){const c=st.b[0];if(me||M.mode!=='online'||M.remote)drawGuide(st,aim,cue);
   const dx=Math.cos(aim),dy=Math.sin(aim),pull=3+pow*26;drawCueAt(cue,c.x-dx*(R+pull),c.y-dy*(R+pull),dx,dy);}
 }
 if(M.phase==='roll'&&M.cueAnim&&frame-M.cueAnim.t<10){const c=M.lastShot,a=M.cueAnim.a,dx=Math.cos(a),dy=Math.sin(a),k=frame-M.cueAnim.t;
  drawCueAt(cue,c.cx-dx*(R+1+k*2.5),c.cy-dy*(R+1+k*2.5),dx,dy);}
 ctx.restore();
}
function clampPlace(x,y){const st=M.st;let mx=st.kitchen?KITCHEN:FR-R;return[Math.max(FL+R,Math.min(mx,x)),Math.max(FT+R,Math.min(FB-R,y))];}

 ring(ctx,382,92,13*mS,'#bcbcbc',2);rect(381,80,1,25,'#bcbcbc');rect(370,92,25,1,'#bcbcbc');
 let sp=M.spin;if(M.mode==='online'&&!isMine(st.turn)&&M.remote)sp=M.remote.sp;

function menuKey(k){

 if(k==='ArrowUp'||k==='w'){let s=MENU.sel;do{s=(s-1+MENU.items.length)%MENU.items.length;}while(MENU.items[s].dis&&s!==MENU.sel);MENU.sel=s;SFX.move();return true;}
 if(k==='ArrowDown'||k==='s'){let s=MENU.sel;do{s=(s+1)%MENU.items.length;}while(MENU.items[s].dis&&s!==MENU.sel);MENU.sel=s;SFX.move();return true;}

function toLogical(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
function onTable(x,y){return x>=FL-14&&x<=FR+14&&y>=FT-14&&y<=FB+14;}
function inPower(x,y){return x>=4&&x<=32&&y>=56&&y<=216;}
function inSpin(x,y){return(x-382)**2+(y-92)**2<=17*17;}
function setSpinFrom(x,y){const cue=cueOf(M.st.turn),mS=cueMaxSpin(cue);let dx=(x-382)/(13*mS),dy=(y-92)/(13*mS);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}M.spin=[dx,dy];}

function startCharge(){if(M.phase!=='aim'||M.charging)return;M.charging=true;M.chargeT=frame;M.power=0;}
function releaseCharge(){if(!M.charging)return;M.charging=false;if(M.power<0.03){M.power=0;return;}humanShot();}
function aimAt(x,y){const c=M.st.b[0];const dx=x-c.x,dy=y-c.y;if(dx*dx+dy*dy>9)M.aim=Math.atan2(dy,dx);}

cv.addEventListener('pointerdown',e=>{au();e.preventDefault();cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);const[x,y]=toLogical(e);PTR.x=x;PTR.y=y;PTR.type=e.pointerType;PTR.down=true;
 if(e.button===2){if(M&&M.charging){M.charging=false;M.power=0;}return;}
 if(scene==='title'){SFX.pick();goMain();return;}
 if(scene==='help'){goMain(3);return;}
 if(scene==='tables'){if(x<80||(x>268&&x<300&&y<150&&false))tableStep(-1);else if(x>=240&&x<300)tableStep(1);else if(x>=80&&x<240&&y>80&&y<180)pickTable();else if(x>=300)tableStep(1);return;}

 if(M.phase==='aim'){const c=M.st.b[0];
  if(M.st.bih&&Math.hypot(x-c.x,y-c.y)<R*1.6&&!M.charging){M.phase='place';return;}
  if(e.pointerType==='touch'){aimAt(x,y);return;}

});

 if(M.phase==='aim'){if(k===' ')startCharge();if(k==='r')M.spin=[0,0];if(k==='b'&&M.st.bih)M.phase='place';}
});

function updateKeys(){
 if(!canAct())return;const st=M.st;
 if(M.phase==='place'){const c=st.b[0];let dx=0,dy=0;if(KEY.ArrowLeft)dx--;if(KEY.ArrowRight)dx++;if(KEY.ArrowUp)dy--;if(KEY.ArrowDown)dy++;

  else if(PTR.type!=='keys'){const p=clampPlace(PTR.x,PTR.y);c.x=p[0];c.y=p[1];}
  if(dx||dy)PTR.type='keys';return;}
 if(M.phase==='aim'&&!M.charging){const f=KEY.Shift?0.04:0.012;if(KEY.ArrowLeft)M.aim-=f;if(KEY.ArrowRight)M.aim+=f;if(KEY.ArrowUp)M.aim-=0.0015;if(KEY.ArrowDown)M.aim+=0.0015;}
 const sp=0.04;let[sx,sy]=M.spin;if(KEY.w)sy-=sp;if(KEY.s)sy+=sp;if(KEY.a)sx-=sp;if(KEY.d)sx+=sp;const l=Math.hypot(sx,sy);if(l>1){sx/=l;sy/=l;}M.spin=[sx,sy];
 if(M.charging){const u=((frame-M.chargeT)%150)/75;M.power=u<=1?u:2-u;}
}

/* ===================== ONLINE (PeerJS room codes) ===================== */
const NET={peer:null,conn:null,isHost:false,me:0,code:'',peerIn:false,table:0,rivalCue:0,err:'',status:'',lost:false};
const PFX='rjs8bitpool-';
const codeEl=document.getElementById('code');
function placeCode(){const r=cv.getBoundingClientRect();codeEl.style.left=(r.left+r.width/2-codeEl.offsetWidth/2)+'px';codeEl.style.top=(r.top+r.height*(96/H))+'px';codeEl.style.fontSize=Math.max(16,10*SC*1.6)+'px';}
function showCode(){codeEl.value='';codeEl.style.display='block';placeCode();setTimeout(()=>codeEl.focus(),30);}
function hideCode(){codeEl.style.display='none';codeEl.blur();}
codeEl.addEventListener('input',()=>{codeEl.value=codeEl.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);});
function loadPeer(cb){if(window.Peer)return cb(true);const urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];let i=0;
 const next=()=>{if(i>=urls.length)return cb(false);const s=document.createElement('script');s.src=urls[i++];s.onload=()=>window.Peer?cb(true):next();s.onerror=next;document.head.appendChild(s);};next();}
function randCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function netClose(){try{if(NET.conn){NET.conn.send({t:'bye'});}}catch(e){}try{NET.peer&&NET.peer.destroy();}catch(e){}NET.peer=null;NET.conn=null;NET.peerIn=false;NET.lost=false;NET.status='';}
function netSend(m){try{if(NET.conn&&NET.conn.open)NET.conn.send(m);}catch(e){}}
function hostRoom(){NET.err='';NET.status='';loadPeer(ok=>{if(!ok){NET.err='COULD NOT LOAD ONLINE PLAY';return;}
 const code=randCode();NET.isHost=true;NET.me=0;NET.code=code;NET.table=SEL.table;NET.peerIn=false;NET.lost=false;
 const peer=new Peer(PFX+code,{debug:0});NET.peer=peer;
 peer.on('open',()=>{goLobby();});
 peer.on('connection',conn=>{if(NET.conn&&NET.conn.open){conn.on('open',()=>{conn.send({t:'full'});setTimeout(()=>conn.close(),300);});return;}
  NET.conn=conn;conn.on('open',()=>{NET.peerIn=true;SFX.good();lobbySend();});conn.on('data',onNet);conn.on('close',onLost);conn.on('error',()=>{});});
 peer.on('error',e=>{NET.err=e.type==='unavailable-id'?'CODE TAKEN, TRY AGAIN':'ONLINE ERROR: '+String(e.type||'').toUpperCase().slice(0,20);if(scene!=='lobby')goOnline();});
});}
function joinRoom(code){code=(code||'').toUpperCase().trim();if(code.length!==5){NET.err='CODE MUST BE 5 LETTERS';return;}NET.err='';NET.status='CONNECTING...';
 loadPeer(ok=>{if(!ok){NET.err='COULD NOT LOAD ONLINE PLAY';NET.status='';return;}
  NET.isHost=false;NET.me=1;NET.code=code;NET.peerIn=true;NET.lost=false;
  const peer=new Peer({debug:0});NET.peer=peer;
  peer.on('open',()=>{const conn=peer.connect(PFX+code,{reliable:true});NET.conn=conn;
   const to=setTimeout(()=>{if(!conn.open){NET.err='NO ROOM WITH THAT CODE';NET.status='';}},8000);
   conn.on('open',()=>{clearTimeout(to);NET.status='';lobbySend();goLobby();SFX.good();});conn.on('data',onNet);conn.on('close',onLost);conn.on('error',()=>{});});
  peer.on('error',e=>{NET.status='';NET.err=e.type==='peer-unavailable'?'NO ROOM WITH THAT CODE':'ONLINE ERROR: '+String(e.type||'').toUpperCase().slice(0,20);});
 });}
function onLost(){if(scene==='play'&&M&&M.mode==='online')NET.lost=true;else if(scene==='lobby'){if(NET.isHost){NET.peerIn=false;NET.conn=null;}else{NET.err='HOST LEFT';netClose();goOnline();}}}
function lobbySend(){if(NET.isHost)netSend({t:'lobby',table:NET.table,cue:SEL.cue[0]});else netSend({t:'lobby',cue:SEL.cue[0]});}
function netStartMatch(){SEL.table=NET.table;newMatch('online',{table:NET.table,cueIds:[SEL.cue[0],NET.rivalCue]});scene='play';startRack();netSend({t:'start',table:NET.table,cueIds:M.cueIds,st:packState(M.st),rack:M.rack});}
function netNextRack(){startRack();netSend({t:'start',table:M.table,cueIds:M.cueIds,st:packState(M.st),rack:M.rack});}
function sendAim(force){if(!M||M.mode!=='online'||!isMine(M.st.turn))return;if(!force&&frame-M.lastAimSend<3)return;M.lastAimSend=frame;
 const c=M.st.b[0];netSend({t:'aim',a:M.aim,pw:M.power,sp:M.spin,cx:c.x,cy:c.y,ph:M.phase});}
function onNet(m){if(!m||!m.t)return;
 if(m.t==='full'){NET.err='ROOM IS FULL';netClose();goOnline();return;}
 if(m.t==='bye'){onLost();return;}
 if(m.t==='lobby'){if(NET.isHost)NET.rivalCue=m.cue|0;else{NET.table=m.table|0;SEL.table=NET.table;NET.rivalCue=m.cue|0;}return;}
 if(m.t==='start'&&!NET.isHost){const was=M&&M.mode==='online'?M.rack:0;if(!M||M.mode!=='online'||scene!=='play'){newMatch('online',{table:m.table,cueIds:m.cueIds});scene='play';hideCode();}
  M.table=m.table;M.cueIds=m.cueIds;M.rack=m.rack-1;M.overMenu=false;startRack(m.st);return;}
 if(!M||M.mode!=='online')return;
 if(m.t==='again'&&NET.isHost){if(M.st.over){M.overMenu=false;netNextRack();}return;}
 if(m.t==='aim'){M.remote={a:m.a,pw:m.pw,sp:m.sp};if(m.ph==='place'||M.st.bih){const c=M.st.b[0];c.x=m.cx;c.y=m.cy;}return;}
 if(m.t==='shot'){if((M.phase==='aim'||M.phase==='place')&&!isMine(M.st.turn))fire(m.shot,false);return;}
 if(m.t==='state'&&!NET.isHost){M.st=m.st;M.S=null;M.overMenu=false;const mm=shotMsg(M.st,m.res,m.p,m.wb);beginTurn();say(mm[0],mm[1]);return;}
}

/* ===================== MAIN LOOP ===================== */
let last=performance.now();
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;frame++;
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
 if(M&&(scene==='play'||scene==='title'||scene==='main'||scene==='diff'||scene==='online'||scene==='help'||scene==='join'||scene==='lobby'||scene==='cue')){
  if(!M.paused||M.mode==='online'){updateKeys();updateBot();if(M.phase==='roll')updateRoll(dt);
   if(M.mode==='demo'&&M.phase==='over'&&frame-M.overT>120){startRack();}
   if(M.mode==='online'&&(M.phase==='aim'||M.phase==='place'))sendAim(false);}
 }
 if(scene==='title')drawTitle();else if(scene==='main')drawMain();else if(scene==='diff')drawDiff();else if(scene==='tables')drawTables();
 else if(scene==='cue')drawCueScreen();else if(scene==='help')drawHelp();else if(scene==='online')drawOnline();else if(scene==='join')drawJoin();
 else if(scene==='lobby')drawLobby();else if(scene==='play')drawPlay();
 requestAnimationFrame(loop);
}
fit();goTitle();requestAnimationFrame(loop);

</script></body></html>
