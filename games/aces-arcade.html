 ['..###..','..###..','#######','#######','..###..','...#...','..###..']];
const SUITS5=[['..#..','.###.','#####','#####','..#..'],['.#.#.','#####','#####','.###.','..#..'],['..#..','.###.','#####','.###.','..#..'],['.###.','.###.','#####','..#..','.###.']];

function sprRows(rows,col,sc){sc=sc||1;const k=rows.join('')+col+sc;if(scache[k])return scache[k];const h=rows.length,w=rows[0].length;const c=mk(w*sc,h*sc);const x=c.getContext('2d');x.fillStyle=col;
 for(let r=0;r<h;r++)for(let q=0;q<w;q++)if(rows[r][q]==='#')x.fillRect(q*sc,r*sc,sc,sc);scache[k]=c;return c}
function suitSpr(s,size,col,sc){return sprRows(size===5?SUITS5[s]:SUITS7[s],col,sc||1)}

function faceSpr(c,small){const key=(small?'s':'n')+c;if(ccache[key])return ccache[key];
 const w=small?SW:CW,h=small?SH:CH;const cnv=mk(w,h);
 drawTo(cnv,()=>{R(1,0,w-2,h,K.bk);R(0,1,w,h-2,K.bk);R(2,1,w-4,h-2,K.wh);R(1,2,w-2,h-4,K.wh);
  const col=suitCol(c),r=rk(c),lab=RL[r];T(lab,2,3,col);g.drawImage(suitSpr(su(c),5,col),2,11);

   if(r>=9&&r<=11){R(6,15,14,17,K.yl2);frame(6,15,14,17,col);T(lab,8,19,col,{sc:2});

  for(let y=3;y<h-3;y++)for(let x=3;x<w-3;x++)if((x+y)%4===0||(x-y+100)%4===0)R(x,y,1,1,K.rl)});ccache[key]=cnv;return cnv}

/* hand evaluation (poker) */
function* combos(a,k,s=0,cur=[]){if(cur.length===k){yield cur.slice();return}for(let i=s;i<=a.length-(k-cur.length);i++){cur.push(a[i]);yield* combos(a,k,i+1,cur);cur.pop()}}
function ev5(cs){const r=cs.map(rk).sort((a,b)=>b-a);const flush=cs.length===5&&cs.every(c=>su(c)===su(cs[0]));
 const cnt={};r.forEach(x=>cnt[x]=(cnt[x]||0)+1);const gr=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]||b-a);const cn=gr.map(x=>cnt[x]);
 let sh=-1;const u=[...new Set(r)];
 if(cs.length===5&&u.length===5){if(r[0]-r[4]===4)sh=r[0];else if(r[0]===12&&r[1]===3&&r[4]===0)sh=3}
 let cat,ks;
 if(sh>=0&&flush){cat=8;ks=[sh]}else if(cn[0]===4){cat=7;ks=gr}else if(cn[0]===3&&cn[1]===2){cat=6;ks=gr}else if(flush){cat=5;ks=r}
 else if(sh>=0){cat=4;ks=[sh]}else if(cn[0]===3){cat=3;ks=gr}else if(cn[0]===2&&cn[1]===2){cat=2;ks=gr}else if(cn[0]===2){cat=1;ks=gr}else{cat=0;ks=r}
 let v=cat;for(let i=0;i<5;i++)v=v*13+(ks[i]||0);return v}
const catOf=v=>Math.floor(v/371293);
const CATN=['HIGH CARD','PAIR','TWO PAIR','TRIPS','STRAIGHT','FLUSH','FULL HOUSE','QUADS','STRAIGHT FLUSH'];
function best5(cs){if(cs.length<=5)return ev5(cs);let b=-1;for(const c of combos(cs,5)){const v=ev5(c);if(v>b)b=v}return b}
function handName(cs){const v=best5(cs);const c=catOf(v);if(c===8&&Math.floor(v/28561)%13===12)return 'ROYAL FLUSH';return CATN[c]}
function ev2(cs){const a=rk(cs[0]),b=rk(cs[1]);return a===b?169+a*13:Math.max(a,b)*13+Math.min(a,b)}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,when,f2){const a=AC;if(!a||a.state!=='running')return;const o=a.createOscillator(),gn=a.createGain();o.type=type||'square';const t=a.currentTime+(when||0);
 o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v||.05,t);gn.gain.linearRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d+.02)}

const PFX='acesarcade-';
function randCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[rnd(a.length)];return s}
function loadPeer(cb){if(window.Peer)return cb(true);
 const urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];let i=0;
 const next=()=>{if(i>=urls.length)return cb(false);const s=document.createElement('script');s.src=urls[i++];s.onload=()=>window.Peer?cb(true):next();s.onerror=next;document.head.appendChild(s)};next()}
const TP={name:'online',
 host(code,h){const peer=new Peer(PFX+code,{debug:0});const conns={};
  peer.on('open',()=>h.open());
  peer.on('connection',conn=>{conn.on('open',()=>{conns[conn.peer]=conn;h.join(conn.peer)});conn.on('data',d=>h.data(conn.peer,d));
   conn.on('close',()=>{delete conns[conn.peer];h.leave(conn.peer)});conn.on('error',()=>{})});
  peer.on('error',e=>h.error(e.type||String(e)));
  return{send(cid,d){const c=conns[cid];if(c&&c.open)try{c.send(d)}catch(e){}},close(){try{peer.destroy()}catch(e){}}}},

  peer.on('open',()=>{conn=peer.connect(PFX+code,{reliable:true,serialization:'json'});conn.on('open',()=>{opened=true;h.open()});conn.on('data',d=>h.data(d));conn.on('close',()=>h.close());conn.on('error',()=>h.close())});
  peer.on('error',e=>h.error(e.type||String(e)));
  setTimeout(()=>{if(!opened)h.error('peer-unavailable')},12000);
  return{send(d){if(conn&&conn.open)try{conn.send(d)}catch(e){}},close(){try{peer.destroy()}catch(e){}}}}};
const TB={name:'this browser',
 host(code,h){const ch=new BroadcastChannel('aces-'+code);
  ch.onmessage=e=>{const m=e.data;if(!m||m.to!=='host')return;if(m.t==='hello'){ch.postMessage({to:m.from,from:'host',t:'ack'});h.join(m.from)}else if(m.t==='d')h.data(m.from,m.d);else if(m.t==='bye')h.leave(m.from)};
  setTimeout(()=>h.open(),0);

  ch.onmessage=e=>{const m=e.data;if(!m||(m.to!==id&&m.to!=='*'))return;if(m.t==='ack'){ok=true;h.open()}else if(m.t==='d')h.data(m.d);else if(m.t==='end')h.close()};
  ch.postMessage({to:'host',from:id,t:'hello'});setTimeout(()=>{if(!ok){h.error('peer-unavailable');ch.close()}},1500);
  return{send(d){ch.postMessage({to:'host',from:id,t:'d',d})},close(){try{ch.postMessage({to:'host',from:id,t:'bye'});ch.close()}catch(e){}}}}};

function gameOpts(G){const o={};(G.opts||[]).forEach(d=>o[d.key]=(RM.opts[G.id]&&RM.opts[G.id][d.key]!==undefined)?RM.opts[G.id][d.key]:d.def);return o}

function startGame(){const G=GAMES[RM.game];const slots=RM.slots.slice();
 while(slots.length<G.min)slots.push({k:'b'});while(slots.length>G.max)slots.pop();
 const S=G.init(slots.length,gameOpts(G));S.g=G.id;S.n=slots.length;S.bot=slots.map(s=>s.k==='b');S.names=mkNames(slots);S.auto=false;
 RM.S=S;RM.me=0;RM.started=true;RM.screen='play';Object.keys(UI).forEach(k=>delete UI[k]);
 // seat map: slot index == seat
 changed(true)}
function changed(first){const S=RM.S;if(!S)return;
 if(RM.role==='host')RM.slots.forEach((s,i)=>{if(s.k==='h'&&s.cid)RM.link.send(s.cid,{k:'state',S,you:i})});
 const G=GAMES[S.g];if(!first&&RM.prevPhase!==S.phase&&(S.phase==='result'||S.phase==='over')&&G.mine){const m=G.mine(S,RM.me);sfx(m>0?'win':m<0?'lose':'turn')}
 RM.prevPhase=S.phase;pump()}
function pump(){clearTimeout(RM.pt);const S=RM.S;if(!S||RM.role==='client')return;const G=GAMES[S.g];const t=G.turn(S);if(t==null)return;
 if(t>=0&&S.bot[t]){RM.pt=setTimeout(()=>{if(RM.S!==S)return;const a=G.bot(S,t);sfx('card');if(!a||G.act(S,t,a)===false){console.warn('bot stuck',S.g,t,JSON.stringify(a));S.bot[t]=true;if(G.fallback){G.fallback(S,t);changed()}return}changed()},(G.delay||650)+rnd(350))}
 else if(t===-3||(t===-2&&S.auto&&G.auto)){RM.pt=setTimeout(()=>{if(RM.S!==S)return;sfx('card');G.auto(S);changed()},t===-3?(G.autoDelay||1000):(G.autoFast||650))}}
function hostAct(seat,a){const S=RM.S;if(!S)return;const G=GAMES[S.g];if(G.act(S,seat,a)===false){if(seat===RM.me)sfx('err');return}changed()}
function act(a){if(RM.role==='client'){if(RM.link)RM.link.send({k:'act',a})}else hostAct(RM.me,a)}

function playSolo(){RM.role='solo';RM.slots=[{k:'h',cid:null}];for(let i=0;i<RM.nbots;i++)RM.slots.push({k:'b'});startGame()}

function tryHost(n){const code=randCode();let link=null;
 link=RM.transport.host(code,{open(){RM.code=code;RM.status=''},error(e){if(e==='unavailable-id'&&n<6){try{link.close()}catch(x){}tryHost(n+1)}else RM.status='ERROR: '+e},
  join(cid){},data(cid,d){hostData(cid,d)},leave(cid){hostLeave(cid)}});RM.link=link}
function lobbySend(){if(RM.role!=='host')return;const names=mkNames(RM.slots);
 RM.slots.forEach((s,i)=>{if(s.k==='h'&&s.cid)RM.link.send(s.cid,{k:'lobby',game:RM.game,names,you:i,max:GAMES[RM.game].max,code:RM.code})})}
function hostData(cid,d){if(!d)return;const G=GAMES[RM.game];
 if(d.k==='join'){if(RM.started){RM.link.send(cid,{k:'err',m:'GAME IN PROGRESS'});return}
  if(RM.slots.some(s=>s.cid===cid))return;
  if(RM.slots.length>=G.max){const bi=RM.slots.map(s=>s.k).lastIndexOf('b');if(bi<0){RM.link.send(cid,{k:'err',m:'ROOM IS FULL'});return}RM.slots.splice(bi,1)}
  RM.slots.push({k:'h',cid});lobbySend()}
 else if(d.k==='act'){const seat=RM.slots.findIndex(s=>s.cid===cid);if(seat>=0&&RM.started)hostAct(seat,d.a)}
 else if(d.k==='leave')hostLeave(cid)}
function hostLeave(cid){const i=RM.slots.findIndex(s=>s.cid===cid);if(i<0)return;
 if(RM.started&&RM.S){RM.slots[i]={k:'b'};RM.S.bot[i]=true;RM.S.names[i]=RM.S.names[i]+'*';changed()}else{RM.slots.splice(i,1);lobbySend()}}
function joinRoom(code){RM.role='client';RM.status='CONNECTING...';RM.code=code;RM.screen='joining';
 getTransport(T=>{if(RM.role!=='client')return;if(!T){RM.status='NO NETWORK';return}
  RM.link=T.join(code,{open(){RM.status='JOINED ROOM';RM.link.send({k:'join'})},data(d){clientData(d)},
   close(){if(RM.role==='client')leaveRoom('HOST LEFT THE ROOM')},error(e){if(RM.role==='client'){RM.status=e==='peer-unavailable'?'ROOM NOT FOUND':'ERROR: '+e;RM.err=true}}})})}
function clientData(d){if(!d)return;
 if(d.k==='lobby'){RM.lobby=d;RM.game=d.game;RM.screen='lobby';RM.started=false;RM.S=null;RM.code=d.code||RM.code}
 else if(d.k==='state'){const first=!RM.S;RM.S=d.S;RM.me=d.you;if(RM.screen!=='play'){RM.screen='play';Object.keys(UI).forEach(k=>delete UI[k])}RM.game=d.S.g;
  const G=GAMES[d.S.g];if(RM.prevPhase!==d.S.phase&&(d.S.phase==='result'||d.S.phase==='over')&&G.mine){const m=G.mine(d.S,RM.me);sfx(m>0?'win':m<0?'lose':'turn')}RM.prevPhase=d.S.phase;sfx('card')}
 else if(d.k==='err'){RM.status=d.m;RM.err=true}
 else if(d.k==='end')leaveRoom('HOST CLOSED THE ROOM')}
function leaveRoom(notice){clearTimeout(RM.pt);
 try{if(RM.role==='host'&&RM.link){RM.slots.forEach(s=>{if(s.cid)RM.link.send(s.cid,{k:'end'})});setTimeout(()=>{try{RM.link.close()}catch(e){}},200)}
  else if(RM.role==='client'&&RM.link){RM.link.send({k:'leave'});const l=RM.link;setTimeout(()=>{try{l.close()}catch(e){}},200)}}catch(e){}
 RM.role='none';RM.S=null;RM.link=null;RM.started=false;RM.lobby=null;RM.code='';RM.status='';RM.err=false;RM.screen='menu';RM.notice=notice||''}

/* ---------- shared poker-family betting engine (draw / hold'em / stud) ---------- */
const potOf=S=>sum(S.contrib);
function pSetup(S,n,chips){S.chips=Array(n).fill(chips);S.rebuys=Array(n).fill(0);S.contrib=Array(n).fill(0);S.fold=Array(n).fill(false);S.allin=Array(n).fill(false);
 S.bet=Array(n).fill(0);S.acted=Array(n).fill(false);S.toCall=0;S.raises=0;S.minRaise=20;S.unit=20;S.turn=0}
function pRebuy(S,min){for(let i=0;i<S.n;i++)if(S.chips[i]<min){S.chips[i]+=500;S.rebuys[i]++}}
function pNewHand(S){S.contrib=Array(S.n).fill(0);S.fold=Array(S.n).fill(false);S.allin=Array(S.n).fill(false);S.bet=Array(S.n).fill(0);S.acted=Array(S.n).fill(false);S.toCall=0;S.raises=0;S.res=null}
const pCan=(S,i)=>!S.fold[i]&&!S.allin[i];
function pNext(S,from){for(let k=1;k<=S.n;k++){const j=(from+k)%S.n;if(pCan(S,j))return j}return -1}
function pPost(S,i,amt){amt=Math.max(0,Math.min(amt,S.chips[i]));S.chips[i]-=amt;S.bet[i]+=amt;S.contrib[i]+=amt;if(S.chips[i]===0)S.allin[i]=true;if(S.bet[i]>S.toCall)S.toCall=S.bet[i];return amt}
function pAnte(S,i,amt){amt=Math.min(amt,S.chips[i]);S.chips[i]-=amt;S.contrib[i]+=amt;if(S.chips[i]===0)S.allin[i]=true}
function pRound(S,first,unit,minRaise){S.bet=Array(S.n).fill(0);S.acted=Array(S.n).fill(false);S.toCall=0;S.raises=0;S.unit=unit||S.unit;S.minRaise=minRaise||S.unit;
 S.turn=pCan(S,first)?first:pNext(S,first);return range(S.n).filter(i=>pCan(S,i)).length}
function pDone(S){const act=range(S.n).filter(i=>pCan(S,i));if(!act.length)return true;if(act.every(i=>S.acted[i]&&S.bet[i]===S.toCall))return true;if(act.length===1&&S.bet[act[0]]>=S.toCall)return true;return false}
function pLive(S){return range(S.n).filter(i=>!S.fold[i])}
// returns false if illegal. a: {t:'fold'|'call'|'raise', to?}
function pApply(S,i,a){if(!pCan(S,i))return false;const need=S.toCall-S.bet[i],cap=S.bet[i]+S.chips[i];
 if(a.t==='fold'){S.fold[i]=true;S.acted[i]=true;return true}
 if(a.t==='call'){pPost(S,i,need);S.acted[i]=true;return true}
 if(a.t==='raise'){let to;
  if(S.nl){to=Math.min(Math.floor(a.to||0),cap);if(to<=S.toCall)return false;if(to-S.toCall<S.minRaise&&to<cap)return false}
  else{if(S.raises>=4)return false;to=Math.min(S.toCall+S.unit,cap);if(to<=S.toCall)return false}
  const by=to-S.toCall;if(by>S.minRaise&&S.nl)S.minRaise=by;
  pPost(S,i,to-S.bet[i]);S.raises++;S.acted=S.acted.map((v,j)=>j===i);return true}
 return false}
// after an action: returns 'fold' (one left), 'done' (round over) or 'next'
function pAfter(S){if(pLive(S).length===1)return'fold';if(pDone(S))return'done';S.turn=pNext(S,S.turn);return'next'}
function pSettle(S,score){const res=Array(S.n).fill(0);const lv=[...new Set(S.contrib.filter(c=>c>0))].sort((a,b)=>a-b);let prev=0;
 for(const l of lv){const part=range(S.n).filter(i=>S.contrib[i]>=l);const amt=(l-prev)*part.length;prev=l;let el=part.filter(i=>!S.fold[i]);if(!el.length)el=pLive(S);
  const b=Math.max(...el.map(i=>score[i]));const w=el.filter(i=>score[i]===b);const sh=Math.floor(amt/w.length);w.forEach(i=>res[i]+=sh);res[w[0]]+=amt-sh*w.length}
 res.forEach((v,i)=>S.chips[i]+=v);return res}
function pFoldWin(S,w){const p=potOf(S);S.chips[w]+=p;const res=Array(S.n).fill(0);res[w]=p;return res}
function pNet(S,res){return res.map((v,i)=>v-S.contrib[i])}

function strCat(cat,top){const t=[.16,.42,.62,.75,.82,.86,.92,.97,1][cat];return cat===0?.08+(top/12)*.12:cat===1?.36+(top/12)*.12:t}

 const canRaise=chips>need&&(S.nl||S.raises<4);
 const rz=()=>{if(!S.nl)return{t:'raise'};const sz=Math.max(S.minRaise,Math.round((pot*(.35+str*.6))/5)*5);const to=S.toCall+sz;return{t:'raise',to:Math.min(to,S.bet[i]+chips)}};
 if(need===0){if(canRaise&&str>.6&&Math.random()<.65)return rz();if(canRaise&&Math.random()<.07)return rz();return{t:'call'}}
 const odds=need/(pot+need);if(canRaise&&str>.84&&Math.random()<.6)return rz();
 if(str>odds+.1||Math.random()<.07||need<=S.unit*.3&&str>.2)return{t:'call'};return{t:'fold'}}

function warFlip(S){S.table=range(S.n).map(()=>[]);S.round++;S.war=0;
 let cont=range(S.n).filter(i=>S.piles[i].length>0);const pot=[];let winner=-1;
 for(let guard=0;guard<40;guard++){const up={};
  cont.forEach(i=>{const c=S.piles[i].shift();S.table[i].push({c,d:false});pot.push(c);up[i]=c});
  const mx=Math.max(...cont.map(i=>rk(up[i])));const tied=cont.filter(i=>rk(up[i])===mx);
  if(tied.length===1){winner=tied[0];break}
  S.war++;const nx=[];
  tied.forEach(i=>{const dn=Math.min(3,Math.max(0,S.piles[i].length-1));for(let k=0;k<dn;k++){const c=S.piles[i].shift();S.table[i].push({c,d:true});pot.push(c)}if(S.piles[i].length>0)nx.push(i)});
  if(nx.length<=1){winner=nx.length?nx[0]:tied[0];break}cont=nx}
 if(winner<0)winner=cont[0];
 S.piles[winner].push(...shuffle(pot));S.winner=winner;S.pc=pot.length;S.msg='';
 const alive=range(S.n).filter(i=>S.piles[i].length>0);
 if(alive.length===1){S.phase='over';S.msg='';S.champ=alive[0]}
 else if(S.round>=500){S.phase='over';S.champ=alive.sort((a,b)=>S.piles[b].length-S.piles[a].length)[0]}
 else S.phase='show'}

function dpDeal(S){S.hand++;S.dealer=(S.dealer+1)%S.n;pRebuy(S,40);pNewHand(S);S.deck=shuffle(range(52));S.hands=range(S.n).map(()=>S.deck.splice(0,5));S.drawn=Array(S.n).fill(false);

 const ord=h.map((c,i)=>i).sort((a,b)=>rk(h[b])-rk(h[a]));return ord.slice(2)}

GAMES.memory={id:'memory',name:'MEMORY',min:1,max:4,defBots:1,delay:900,autoDelay:1300,opts:[{key:'size',label:'CARDS',vals:[12,20,28],def:20}],
 rules:['CARDS ARE LAID FACE DOWN. ON YOUR TURN FLIP ANY TWO CARDS.','IF THEY MATCH IN RANK (LIKE TWO 7S) YOU KEEP THE PAIR AND GO AGAIN.','IF NOT, THEY FLIP BACK AND IT IS THE NEXT PLAYER\'S TURN. REMEMBER WHERE EVERYTHING IS!','THE PLAYER WITH THE MOST PAIRS WINS. SOLO MODE: TRY TO CLEAR THE BOARD IN THE FEWEST TURNS.'],
 init(n,o){const size=o.size||20;const ranks=shuffle(range(13)).slice(0,size/2);const cards=[];ranks.forEach(r=>{const ss=shuffle([0,1,2,3]).slice(0,2);ss.forEach(s=>cards.push(s*13+r))});shuffle(cards);
  return{n,size,cols:size===12?4:size===20?5:7,grid:cards,got:cards.map(()=>-1),up:[],phase:'play',turn:0,score:Array(n).fill(0),bm:range(n).map(()=>({})),tries:0,msg:''}},
 turn(S){return S.phase==='peek'?-3:S.phase==='over'?null:S.turn},
 act(S,seat,a){if(seat!==S.turn||S.phase!=='play'||a.t!=='flip')return false;const i=a.i;if(!(i>=0&&i<S.grid.length)||S.got[i]>=0||S.up.includes(i)||S.up.length>=2)return false;
  S.up.push(i);for(let b=0;b<S.n;b++)if(S.bot[b]&&Math.random()<.6)S.bm[b][i]=rk(S.grid[i]);
  if(S.up.length===2){S.tries++;const[x,y]=S.up;if(rk(S.grid[x])===rk(S.grid[y])){S.got[x]=S.got[y]=seat;S.score[seat]++;S.up=[];S.msg='MATCH!';
    if(S.got.every(v=>v>=0))S.phase='over'}else{S.phase='peek';S.msg='NO MATCH'}}return true},
 auto(S){S.up=[];S.turn=(S.turn+1)%S.n;S.phase='play';S.msg=''},
 bot(S,i){const m=S.bm[i];const un=range(S.grid.length).filter(k=>S.got[k]<0&&!S.up.includes(k));
  if(!S.up.length){const known=Object.keys(m).map(Number).filter(k=>S.got[k]<0);for(const a of known){const b=known.find(k=>k!==a&&m[k]===m[a]);if(b!==undefined)return{t:'flip',i:a}}
   const fresh=un.filter(k=>!(k in m));return{t:'flip',i:pick(fresh.length?fresh:un)}}
  const a=S.up[0];const r=rk(S.grid[a]);const j=Object.keys(m).map(Number).find(k=>k!==a&&S.got[k]<0&&m[k]===r);if(j!==undefined)return{t:'flip',i:j};
  const fresh=un.filter(k=>!(k in m));return{t:'flip',i:pick(fresh.length?fresh:un)}},
 mine(S,me){return S.score[me]===Math.max(...S.score)?1:-1},
 over(S,me){const o=range(S.n).sort((a,b)=>S.score[b]-S.score[a]);if(S.n===1)return['BOARD CLEARED IN '+S.tries+' TRIES'];return[nameFor(S,o[0],me)+' WINS WITH '+S.score[o[0]]+' PAIRS'].concat(o.map(i=>nameFor(S,i,me)+': '+S.score[i]))},
 draw(S,me){const cols=S.cols,rows=Math.ceil(S.grid.length/cols);const gw=cols*30-4,gh=rows*40-4;const x0=Math.round(192-gw/2)+14,y0=Math.round(112-gh/2)-6;const cc=[K.yl,K.rl,K.bl2,K.gn2];
  for(let i=0;i<S.n;i++){const y=24+i*30;T((S.turn===i&&S.phase!=='over'?'>':'')+nameFor(S,i,me),8,y,S.turn===i?K.yl:K.wh,{sh:K.bk});T(S.score[i]+' PAIRS',8,y+9,cc[i],{sh:K.bk})}
  T('TRIES '+S.tries,8,150,K.gy);
  S.grid.forEach((c,k)=>{const cx=x0+(k%cols)*30,cy=y0+((k/cols)|0)*40;const matched=S.got[k]>=0,up=S.up.includes(k);
   card(matched||up?c:-1,cx,cy,{dim:matched});if(matched)frame(cx-1,cy-1,CW+2,CH+2,cc[S.got[k]%4],1);
   if(up)frame(cx-1,cy-1,CW+2,CH+2,K.yl,1);
   if(!matched&&!up&&S.turn===me&&S.phase==='play'&&S.up.length<2)Hit(cx,cy,CW,CH,()=>act({t:'flip',i:k}))});
  msgBar(S.msg||(S.turn===me?'YOUR TURN - FLIP A CARD':nameFor(S,S.turn,me)+' IS PICKING...'),y0+gh+8>196?190:y0+gh+10,1)}};
/* ===================== SOLITAIRE (Klondike, draw 1) ===================== */
const sr=c=>(rk(c)+1)%13; // ace low
const fcount=P=>sum(P.found.map(f=>f.length));
function solBoard(deck){const d=deck.slice();const tab=[];for(let i=0;i<7;i++){const col=[];for(let j=0;j<=i;j++)col.push({c:d.pop(),up:j===i});tab.push(col)}
 return{stock:d,waste:[],found:[[],[],[],[]],tab,cyc:0,done:false,win:false,moves:0}}
function canFound(P,c){return sr(c)===P.found[su(c)].length}
function canTab(P,c,i){const col=P.tab[i];if(!col)return false;if(!col.length)return sr(c)===12;const t=col[col.length-1];return t.up&&isRed(t.c)!==isRed(c)&&sr(c)===sr(t.c)-1}
function solMove(P,from,to){let cards;
 if(from.k==='w'){if(!P.waste.length)return false;cards=[P.waste[P.waste.length-1]]}
 else if(from.k==='t'){const col=P.tab[from.i];if(!col||!(from.j>=0&&from.j<col.length)||!col[from.j].up)return false;cards=col.slice(from.j).map(x=>x.c);
  for(let k=1;k<cards.length;k++)if(!(sr(cards[k])===sr(cards[k-1])-1&&isRed(cards[k])!==isRed(cards[k-1])))return false}
 else if(from.k==='f'){const f=P.found[from.s];if(!f||!f.length)return false;cards=[f[f.length-1]]}else return false;
 if(to.k==='f'){if(cards.length!==1||!canFound(P,cards[0]))return false;if(from.k==='f')return false}
 else if(to.k==='t'){if(!canTab(P,cards[0],to.i))return false;if(from.k==='t'&&from.i===to.i)return false}else return false;
 if(from.k==='w')P.waste.pop();else if(from.k==='t'){const col=P.tab[from.i];col.splice(from.j);if(col.length&&!col[col.length-1].up)col[col.length-1].up=true}else P.found[from.s].pop();
 if(to.k==='f')P.found[su(cards[0])].push(cards[0]);else P.tab[to.i].push(...cards.map(c=>({c,up:true})));
 P.moves++;P.cyc=0;if(fcount(P)===52)P.win=true;return true}
function solDrawCard(P){if(P.stock.length)P.waste.push(P.stock.pop());else if(P.waste.length){P.stock=P.waste.reverse();P.waste=[];P.cyc++}else return false;return true}
function solAuto(P){let any=false;for(let g2=0;g2<60;g2++){let m=false;
  if(P.waste.length&&solMove(P,{k:'w'},{k:'f'}))m=true;
  else for(let i=0;i<7;i++){const col=P.tab[i];if(col.length&&solMove(P,{k:'t',i,j:col.length-1},{k:'f'})){m=true;break}}
  if(!m)break;any=true}return any}
function solBotMove(P){
 if(P.waste.length){const c=P.waste[P.waste.length-1];if(canFound(P,c))return{t:'mv',from:{k:'w'},to:{k:'f'}}}
 for(let i=0;i<7;i++){const col=P.tab[i];if(col.length){const c=col[col.length-1].c;if(canFound(P,c))return{t:'mv',from:{k:'t',i,j:col.length-1},to:{k:'f'}}}}
 for(let i=0;i<7;i++){const col=P.tab[i];const j0=col.findIndex(x=>x.up);if(j0<=0)continue;
  for(let k=0;k<7;k++){if(k===i)continue;if(canTab(P,col[j0].c,k))return{t:'mv',from:{k:'t',i,j:j0},to:{k:'t',i:k}}}}
 if(P.waste.length){const c=P.waste[P.waste.length-1];for(let k=0;k<7;k++)if(canTab(P,c,k))return{t:'mv',from:{k:'w'},to:{k:'t',i:k}}}
 // tableau stack moves that free an empty column for a king waiting in waste
 if(P.stock.length||(P.waste.length&&P.cyc<3))return{t:'draw'};
 return{t:'done'}}
function solCheck(S){const w=S.boards.findIndex(P=>P.win);if(w>=0){S.winner=w;S.phase='over';return}if(S.boards.every(P=>P.done)){S.winner=-1;S.phase='over'}}
GAMES.solitaire={id:'solitaire',name:'SOLITAIRE',min:1,max:4,defBots:0,delay:420,
 rules:['KLONDIKE SOLITAIRE, DRAW ONE. BUILD 4 FOUNDATION PILES FROM ACE UP TO KING, ONE PER SUIT.','TABLEAU: STACK CARDS DOWN IN ALTERNATING COLORS (RED 7 ON BLACK 8). ONLY KINGS CAN GO ON EMPTY COLUMNS.','CLICK A CARD TO PICK IT UP (AND THE CARDS ON TOP OF IT), THEN CLICK WHERE IT GOES. DOUBLE CLICK A CARD TO SEND IT HOME. CLICK THE STOCK TO DRAW.','MULTIPLAYER IS A RACE: EVERYONE GETS THE SAME DEAL. FIRST TO CLEAR THE BOARD WINS, OR MOST CARDS HOME WHEN EVERYONE IS STUCK. BOTS PLAY TOO.'],
 init(n){const deck=shuffle(range(52));return{n,boards:range(n).map(()=>solBoard(deck)),phase:'play',winner:-1}},
 turn(S){if(S.phase==='over')return null;for(let i=0;i<S.n;i++)if(S.bot[i]&&!S.boards[i].done&&!S.boards[i].win)return i;return null},
 act(S,seat,a){if(S.phase!=='play')return false;const P=S.boards[seat];if(!P||P.done||P.win)return false;let ok=false;
  if(a.t==='draw')ok=solDrawCard(P);else if(a.t==='mv')ok=solMove(P,a.from||{},a.to||{});else if(a.t==='auto')ok=solAuto(P);else if(a.t==='done'){P.done=true;ok=true}
  if(ok)solCheck(S);return ok},
 bot(S,i){return solBotMove(S.boards[i])},
 fallback(S,t){S.boards[t].done=true;solCheck(S)},
 mine(S,me){return S.winner===me?1:-1},
 over(S,me){const l=[];if(S.winner>=0)l.push(nameFor(S,S.winner,me)+' CLEARED THE BOARD!');else l.push(S.n>1?'NOBODY CLEARED IT - MOST CARDS HOME:':'NO MORE MOVES - CARDS HOME: '+fcount(S.boards[me]));
  if(S.n>1)range(S.n).sort((a,b)=>fcount(S.boards[b])-fcount(S.boards[a])).forEach(i=>l.push(nameFor(S,i,me)+': '+fcount(S.boards[i])+'/52'));return l},
 draw(S,me){const P=S.boards[me];const X=i=>12+i*32;const sel=UI.sel;
  const hlSel=(k)=>sel&&sel.k===k;
  // stock + waste
  if(P.stock.length)card(-1,X(0),14);else emptySlot(X(0),14,CW,CH,'O');Hit(X(0),14,CW,CH,()=>solClick(S,{k:'stock'}));
  if(P.waste.length){const c=P.waste[P.waste.length-1];card(c,X(1),14,{sel:hlSel('w')});Hit(X(1),14-5,CW,CH+5,()=>solClick(S,{k:'waste'}))}else emptySlot(X(1),14);
  T(String(P.stock.length),X(0)+13,52,K.gy,{al:'c'});
  for(let s=0;s<4;s++){const x=X(3+s);const f=P.found[s];if(f.length)card(f[f.length-1],x,14,{sel:hlSel('f')&&sel.s===s});else{emptySlot(x,14);g.drawImage(suitSpr(s,7,'#3a9a5a',1),x+9,28)}Hit(x,14,CW,CH,()=>solClick(S,{k:'found',s}))}
  // tableau
  for(let i=0;i<7;i++){const col=P.tab[i];const x=X(i);const ups=col.filter(c=>c.up).length,dns=col.length-ups;
   const maxh=152;let us=9;if(ups>1&&36+dns*2+(ups-1)*us>maxh)us=Math.max(4,Math.floor((maxh-36-dns*2)/(ups-1)));
   if(!col.length){emptySlot(x,60,CW,CH,'K');Hit(x,60,CW,CH,()=>solClick(S,{k:'tab',i,j:-1}));continue}
   let y=60;const ys=[];col.forEach((e,j)=>{ys.push(y);const selected=sel&&sel.k==='t'&&sel.i===i&&j>=sel.j;card(e.up?e.c:-1,x,y-(selected?3:0),{});if(selected)frame(x-1,y-4,CW+2,(j===col.length-1?CH:us)+2+(j===col.length-1?0:0),K.yl,1);y+=e.up?us:2});
   for(let j=col.length-1;j>=0;j--){const h=j===col.length-1?CH:(col[j].up?us:2);if(col[j].up||j===col.length-1)Hit(x,ys[j],CW,h,()=>solClick(S,{k:'tab',i,j}))}}
  // side panel
  const px=244;panel(px,18,132,86,'RACE');
  const order=S.n>1?range(S.n):[];order.forEach((i,k)=>{const y=29+k*14;T(nameFor(S,i,me),px+8,y,i===me?K.yl:K.wh);T(fcount(S.boards[i])+'/52',px+124,y,S.boards[i].win?K.gn2:K.gy,{al:'r'});const st=S.boards[i].done?'STUCK':S.boards[i].win?'WIN!':'';if(st)T(st,px+50,y,K.rl)});
  if(S.n===1){T('MOVES '+P.moves,px+8,30,K.gy);T('HOME '+fcount(P)+'/52',px+8,44,K.wh)}
  Btn('AUTO HOME',px,112,64,14,()=>act({t:'auto'}),{st:'blue'});Btn('GIVE UP',px+68,112,64,14,()=>{UI.sel=null;act({t:'done'})},{st:'red'});
  wrap('CLICK A CARD THEN CLICK WHERE IT GOES. DOUBLE CLICK SENDS IT HOME.',21).forEach((l,i)=>T(l,px+2,134+i*9,K.gy));
  if(P.done&&S.phase==='play')msgBar('YOU GAVE UP - WAITING FOR THE OTHERS...',200,1)}};
function solClick(S,tgt){const P=S.boards[RM.me];if(!P||P.done||P.win)return;const sel=UI.sel;
 if(tgt.k==='stock'){UI.sel=null;act({t:'draw'});return}
 if(!sel){if(tgt.k==='waste'){if(P.waste.length)UI.sel={k:'w'}}else if(tgt.k==='tab'&&tgt.j>=0){if(P.tab[tgt.i][tgt.j]&&P.tab[tgt.i][tgt.j].up)UI.sel={k:'t',i:tgt.i,j:tgt.j}}else if(tgt.k==='found'&&P.found[tgt.s].length)UI.sel={k:'f',s:tgt.s};return}
 const same=(sel.k==='w'&&tgt.k==='waste')||(sel.k==='t'&&tgt.k==='tab'&&tgt.i===sel.i&&tgt.j===sel.j)||(sel.k==='f'&&tgt.k==='found'&&tgt.s===sel.s);
 if(same){act({t:'mv',from:sel,to:{k:'f'}});UI.sel=null;return}
 if(tgt.k==='found'){act({t:'mv',from:sel,to:{k:'f'}});UI.sel=null;return}
 if(tgt.k==='tab'){act({t:'mv',from:sel,to:{k:'t',i:tgt.i}});UI.sel=null;return}
 if(tgt.k==='waste'&&P.waste.length){UI.sel={k:'w'};return}UI.sel=null}
