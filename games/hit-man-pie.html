function drawSky(w, tod) {
  const c = SKIES[tod]; const bh = Math.ceil(GROUND / c.length);
  for (let i = 0; i < c.length; i++) { P(0, i * bh, w, bh + 1, c[i]); if (i > 0) dither(0, i * bh - 2, w, 2, c[i - 1], 0); }

function bgSkyline(w, col, base, hmin, hmax, seed, lit) {
  const r = RNG(seed * 77 + 5); let x = -10;
  while (x < w + 10) {
    const bw = r.int(18, 44), bh = r.int(hmin, hmax);
    P(x, base - bh, bw, bh + 80, col);
    const top = r();
    if (top < 0.2) { P(x + bw / 2 - 1, base - bh - 14, 2, 14, col); }
    else if (top < 0.35) { P(x + 4, base - bh - 6, bw - 8, 6, col); P(x + 8, base - bh - 11, bw - 16, 5, col); }

    drawText('CONTINUE?', W / 2 - 30, 316, '#ffffff', 2, { align: 'center' });
    if (SCT > 1.5) drawText(String(Math.max(0, Math.ceil(BST.count))), W / 2 + 70, 312, '#ffe060', 3, { align: 'center' });
    drawText('Fire: retry the stage     Esc: give up', W / 2, 338, '#8a80a0', 1, { align: 'center' });
  }
};
SC.gameover = {
  enter() { AU.stop(); },
  update() { if (SCT > 1 && anyHit) go('title'); },
  draw() { P(0, 0, W, H, '#0c0818'); drawText('GAME OVER', W / 2, 120, '#fff', 4, { align: 'center', outline: OL, ow: 2, grad: ['#ffffff', '#c8b8e8', '#8a70c8'] }); drawText('Score ' + String(G.score).padStart(7, '0'), W / 2, 170, '#ffe060', 1, { align: 'center' }); drawText('Password for stage ' + (G.stage + 1) + ': ' + encodePW(G.stage), W / 2, 190, '#9af0ff', 1, { align: 'center' }); drawRaccoon(W / 2, 340, { t: SCT, face: 1, expr: 'sad', noGun: true }); }
};
SC.credits = {
  enter() { AU.play('ending'); G.hi = Math.max(G.hi, G.score); },
  update() { if (SCT > 3 && anyHit) go('title'); },
  draw() {
    X.drawImage(menuBackdrop(), 0, 0); X.globalAlpha = 0.5; P(0, 0, W, H, '#0c0818'); X.globalAlpha = 1;
    drawText('THE END', W / 2, 40, '#fff', 5, { align: 'center', outline: OL, ow: 2, grad: ['#fff8d0', '#ffe070', '#f8b830', '#e8841c'] });
    drawText('...or is it?', W / 2, 84, '#c8b8e8', 1, { align: 'center' });
    drawText('Final score ' + String(G.score).padStart(7, '0'), W / 2, 110, '#ffe060', 2, { align: 'center' });
    const cr = ['HIT-MAN PIE', "An RJ's Gamekade original", '', 'Starring Rocco Raccoon', 'with RJ, AJ and Sgt. Biscuits', '', '40 buildings. 26 faces. A lot of pie.', '', 'Thanks for playing!'];
    cr.forEach((s, i) => drawText(s, W / 2, 150 + i * 13, i === 0 ? '#ffe060' : '#e8e0f0', 1, { align: 'center', shadow: '#000' }));
    drawRaccoon(W - 70, 352, { t: SCT, face: -1, ang: -1.3, expr: 'grin', pies: 6, laugh: true });
    if (SCT > 3) drawText('Press any key', W / 2, H - 20, Math.floor(SCT * 2) % 2 ? '#8a80a0' : '#4a4060', 1, { align: 'center' });
  }
};
// ---------- BOOT ----------
SC.boot = {
  update() { if (SCT > 0.3 && (anyHit)) { AU.init(); SFX.select(); go('title'); } },
  draw() { P(0, 0, W, H, '#0c0818'); drawText("RJ'S GAMEKADE", W / 2, 140, '#ffe060', 3, { align: 'center', shadow: '#5a1a2a' }); drawText('presents', W / 2, 170, '#c8b8e8', 1, { align: 'center' }); drawText('Click or press any key to start', W / 2, 240, '#8a80a0', 1, { align: 'center' }); }
};
// ---------- MAIN LOOP ----------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; SCT += dt;
  setX(ctx); ctx.setTransform(1, 0, 0, 1, 0, 0);
  try { SC[SCN].update(dt); SC[SCN].draw(); } catch (e) { console.error(e); P(0, 0, W, 12, '#a00'); drawText('ERR ' + e.message.slice(0, 70), 2, 2, '#fff', 1); }
  if (SET.scan) ctx.drawImage(scanC, 0, 0);
  endFrameInput();
  requestAnimationFrame(frame);
}
window.HMP = { go, startStage, buildStage, G, SET, BLD, get PL() { return PL; } };
requestAnimationFrame(frame);

</script></body></html>
