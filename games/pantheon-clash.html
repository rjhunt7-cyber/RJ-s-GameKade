<!DOCTYPE html>

  BALANCE_REPORT:
  Round-robin: 72 legends x 120 matches each (4320 matches), difficulty-4 bots, ranked rules (3 stocks, 8:00, ranked maps, drops on, gadgets/hazards off), mirrored sides.
  Win rates: 46/72 within 45-55%, 53/72 within 42-58%. Range 31.7%-68.8%. Binomial noise at n=120 is about +/-4.6% (1 sd).
  Top 8: Nephthys 68.8, Apep 65.0, Ares 64.2, Nüwa 62.5, Surtr 60.8, Poseidon 60.0, Erlang Shen 60.0, Brynhild 58.3

  KO damage %: p10 70, median 140, p90 220. Credited KOs near the edge 8174, from center 10723; self-destructs 309.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantheon Clash</title>
<meta name="description" content="A 2D platform fighter of gods and heroes from Norse, Greek, Egyptian and Chinese myth.">
<style>
:root{--ink:#070a18;--night:#0e1533;--lapis:#1c2b60;--gilt:#d6a84a;--gilt2:#f4d98e;--parch:#efe4c8;--dim:#a99f86;--ember:#e0553a;--jade:#36b08a;--norse:#7fd3ff;--greek:#e8c66a;--egyptian:#d9b25c;--chinese:#e2452f;
--display:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;--ui:"Gill Sans","Gill Sans MT",Optima,Candara,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--parch);font-family:var(--ui);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#141a38 0%,#05060f 80%)}
#game{display:block;image-rendering:auto}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;overflow:hidden}
.screen.dim{background:linear-gradient(180deg,rgba(7,10,24,.78),rgba(7,10,24,.9))}
.screen.veil{background:linear-gradient(90deg,rgba(7,10,24,.88) 0%,rgba(7,10,24,.55) 42%,rgba(7,10,24,0) 70%)}
.wrap{width:min(1180px,94vw);margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1;padding:22px 0 18px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;color:var(--parch)}
h2{font-size:30px;letter-spacing:.01em}
h3{font-size:18px}
p{line-height:1.5;margin:0}
.muted{color:var(--dim)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-height:0}
.spread{justify-content:space-between}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;border-bottom:1px solid rgba(214,168,74,.35);padding-bottom:10px}
.head .crumb{font-size:14px;color:var(--dim)}
.backBtn{flex-shrink:0;margin-bottom:2px}
/* tablets (buttons) */
.btn{position:relative;font:600 16px/1.2 var(--ui);color:var(--parch);background:linear-gradient(180deg,rgba(38,46,92,.94),rgba(13,17,40,.96));border:1px solid rgba(214,168,74,.5);padding:10px 20px 10px 22px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);cursor:pointer;text-align:left;transition:transform .08s ease,background .12s ease;user-select:none}
.btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.btn:hover,.btn:focus-visible,.btn.focus{outline:none;background:linear-gradient(180deg,#3d3468,#19173a);border-color:var(--gilt2);transform:translateX(3px)}
.btn:hover::before,.btn:focus-visible::before,.btn.focus::before{background:var(--gilt2);box-shadow:0 0 12px var(--gilt2)}
.btn:active{transform:translateX(3px) scale(.985)}
.btn.primary{background:linear-gradient(180deg,#b9852f,#6e4614);border-color:var(--gilt2);color:#fff8e4;text-shadow:0 1px 0 #3a2208}
.btn.primary:hover,.btn.primary:focus-visible,.btn.primary.focus{background:linear-gradient(180deg,#d9a441,#8a5a1a)}
.btn.ghost{background:transparent;border-color:rgba(214,168,74,.3)}
.btn.small{font-size:13px;padding:6px 14px 6px 16px}
.btn.on{border-color:var(--gilt2);background:linear-gradient(180deg,#5a4a1e,#2a2010);color:#fff3c0}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .sub{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:2px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .btn{padding:7px 14px 7px 16px;font-size:14px}
/* frames */
.panel{background:rgba(9,11,27,.88);border:1px solid rgba(214,168,74,.42);box-shadow:inset 0 0 0 4px rgba(9,11,27,.9),inset 0 0 0 5px rgba(214,168,74,.2);padding:16px 18px}

.label{font-size:13px;color:var(--dim);margin-bottom:4px}

.logo .l1{display:block;font-size:clamp(56px,9vw,124px)}
.logo .l2{display:block;font-size:clamp(56px,9vw,124px);padding-left:.55em}
.tag{font-family:var(--display);font-style:italic;font-size:19px;color:#e8dcc0;margin-top:14px;text-shadow:0 2px 8px #000}
.press{margin-top:40px;font-size:15px;color:var(--gilt2);animation:pulse 2.4s ease-in-out infinite}

.emblems{display:flex;gap:14px;margin-top:22px}
.emb{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;border:1px solid currentColor;transform:rotate(45deg)}

.menuCol{position:absolute;left:clamp(24px,6vw,90px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;width:min(360px,80vw)}
.menuCol .btn{font-size:19px;padding:13px 22px 13px 26px}
.version{position:absolute;right:16px;bottom:12px;font-size:12px;color:rgba(239,228,200,.45)}
/* tabs */
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{font:600 14px var(--ui);color:var(--dim);background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer}
.tab.on{color:var(--parch);border-bottom-color:var(--accent,var(--gilt))}
.tab:focus-visible,.tab.focus,.tab:hover{outline:none;color:var(--parch)}
.m-norse{--accent:var(--norse)}.m-greek{--accent:var(--greek)}.m-egyptian{--accent:var(--egyptian)}.m-chinese{--accent:var(--chinese)}
/* character grid */
.cs{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;min-height:0;flex:1}

.tile canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:50% 0}
.tile .nm{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:2px 4px;background:linear-gradient(0deg,rgba(5,6,15,.95),rgba(5,6,15,0));color:var(--parch);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mb{position:absolute;top:3px;left:3px;width:8px;height:8px;background:var(--accent);transform:rotate(45deg)}
.tile:hover,.tile:focus-visible,.tile.focus{outline:none;border-color:var(--gilt2);box-shadow:inset 0 0 0 1px var(--gilt2)}
.tile.sel{border-color:var(--accent,var(--gilt2));box-shadow:inset 0 0 0 2px var(--accent,var(--gilt2))}
.tile.rand{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:34px;color:var(--gilt2)}
.detail{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.detail .confirmRow{position:sticky;bottom:-16px;margin:0 -18px -16px;padding:10px 18px 14px;background:linear-gradient(0deg,rgba(9,11,27,1) 70%,rgba(9,11,27,0))}
.detail .title{font-family:var(--display);font-style:italic;color:var(--accent,var(--gilt2));font-size:15px}
.statbar{display:grid;grid-template-columns:44px 1fr 22px;gap:8px;align-items:center;font-size:13px}
.bar{height:8px;background:rgba(255,255,255,.08);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a5a1a,var(--gilt2))}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
.bar i.up{background:linear-gradient(90deg,#1f6a4a,#6affb0)}.bar i.dn{background:linear-gradient(90deg,#6a1a14,#ff7a6a)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{width:26px;height:26px;border:1px solid rgba(255,255,255,.2);cursor:pointer;padding:0;position:relative}
.chip.on{outline:2px solid var(--gilt2);outline-offset:1px}
.chip:focus-visible,.chip.focus{outline:2px solid #fff}
.chip.lock{opacity:.3;cursor:not-allowed}
.skinBtn{padding:0;width:68px;height:68px;background:linear-gradient(180deg,#1a2148,#0b0e22);border:1px solid rgba(214,168,74,.3);cursor:pointer;position:relative}
.skinBtn.on{border-color:var(--gilt2);box-shadow:inset 0 0 0 2px var(--gilt2)}
.skinBtn:focus-visible,.skinBtn.focus{outline:2px solid #fff}
.skinBtn canvas{width:100%;height:100%}
.sigs{font-size:13px;line-height:1.55;color:#e8dcc0}

/* map select */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));grid-auto-rows:max-content;gap:10px;overflow-y:auto;padding:4px;align-content:start}

.mtile canvas{width:100%;display:block;aspect-ratio:16/9}
.mtile .mi{padding:6px 8px 8px}
.mtile .mn{font-family:var(--display);font-size:16px}
.mtile .me{font-size:11.5px;color:var(--dim);margin-top:2px}
.mtile:hover,.mtile:focus-visible,.mtile.focus{outline:none;border-color:var(--gilt2)}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--gilt);color:var(--gilt2);margin-left:6px;vertical-align:2px}
/* tables */
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{font-weight:600;color:var(--dim);text-align:left;border-bottom:1px solid rgba(214,168,74,.35);padding:6px 8px;font-size:13px}
table.t td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
table.t tr.me td{background:rgba(214,168,74,.1)}
.bindKey{min-width:96px;text-align:center;font:600 13px var(--ui);background:#141836;border:1px solid rgba(214,168,74,.35);color:var(--parch);padding:5px 8px;cursor:pointer}
.bindKey:hover,.bindKey:focus-visible,.bindKey.focus{outline:none;border-color:var(--gilt2)}
.bindKey.listen{background:#5a4a1e;color:#fff3c0;animation:pulse 1s infinite}
.warn{color:#ffb07a;font-size:13px}
input[type=text]{font:600 18px var(--ui);background:#0b0e22;color:var(--parch);border:1px solid rgba(214,168,74,.5);padding:9px 12px;outline:none}
input[type=text]:focus{border-color:var(--gilt2);box-shadow:0 0 0 2px rgba(244,217,142,.25)}
input[type=range]{accent-color:var(--gilt);width:200px}
textarea{width:100%;height:120px;background:#0b0e22;color:var(--parch);border:1px solid rgba(214,168,74,.4);font:12px monospace;padding:8px}
.code{font-family:var(--display);font-size:44px;letter-spacing:.18em;color:var(--gilt2);text-shadow:0 0 20px rgba(244,217,142,.3)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(9,11,27,.95);border:1px solid var(--gilt);padding:10px 18px;font-size:15px;z-index:9;pointer-events:none;transition:opacity .3s}
.modal{position:fixed;inset:0;background:rgba(3,4,10,.7);display:flex;align-items:center;justify-content:center;z-index:8;pointer-events:auto}
.modal .panel{max-width:520px;width:92vw}
.vs{display:flex;align-items:center;justify-content:center;gap:30px;flex:1}
.vsSide{display:flex;flex-direction:column;gap:10px;align-items:center}
.vsCard{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px}
.vsCard canvas{width:150px;height:150px;background:radial-gradient(circle,#2a2a5a,#0b0e22);border:1px solid var(--accent,var(--gilt))}
.vsWord{font-family:var(--display);font-size:72px;font-style:italic;color:var(--gilt2);text-shadow:0 0 30px rgba(244,217,142,.4)}
.results .win{font-family:var(--display);font-size:46px;color:var(--gilt2)}
.elo{font-family:var(--display);font-size:28px}
.elo .up{color:#7dff9a}.elo .dn{color:#ff7a6a}
.trainPanel{position:absolute;right:10px;top:10px;width:260px;pointer-events:auto;font-size:13px}
.tut{position:absolute;left:50%;top:12px;transform:translateX(-50%);pointer-events:none;text-align:center;font-size:17px;text-shadow:0 2px 6px #000;max-width:80vw}
.tut b{color:var(--gilt2)}
.lobbyRow{display:grid;grid-template-columns:52px 1fr 120px 110px 90px 80px;gap:10px;align-items:center;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.lobbyRow canvas{width:48px;height:48px;background:#141836}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.scroll{overflow-y:auto;min-height:0}
.kbd{display:inline-block;border:1px solid rgba(239,228,200,.4);padding:0 6px;font-size:12px;margin:0 2px;color:#fff}
@media (max-width:900px){.cs{grid-template-columns:1fr}.lobbyRow{grid-template-columns:44px 1fr 90px 80px}}
</style>

<script>
/* ---- 00_config.js ---- */
'use strict';
/* ===================== CONFIG ===================== */
const GAME_VERSION = '1.1.0';
const CONFIG = {
  unlockAll: true,
  viewW: 640, viewH: 360, zoomMin: 0.55, zoomMax: 1.2,
  hurtW: 22, hurtH: 44,
  buildScale: { slim: 0.92, average: 1.0, bulky: 1.1 },
  buildWeight: { slim: 1.04, average: 1.0, bulky: 0.95 },
  grav: 0.45, maxFall: 9.5, fastFall: 14,
  runAccel: 0.6, runMax: 3.4, friction: 0.82,
  airAccel: 0.28, airMax: 3.0, airFriction: 0.96,
  jumpV: -9.4, airJumpV: -8.6, airJumps: 2,
  dodgeDur: 22, dodgeInv0: 3, dodgeInv1: 15, dodgeCD: 50, dodgeSpeed: 5.2,
  hitlagBase: 3, hitlagDiv: 6, hitlagMax: 12,
  hitstunMult: 3.0, diDeg: 15,
  launchDecay: 0.966, launchGrav: 0.12, postLaunchDecay: 0.975,
  kbScale: 1.25, kbScaleLight: 0.9, blastSide: 250, blastTop: 210,
  chaseWindow: 14, chaseDur: 17, chaseSpeed: 6.6, chaseCancel: 20,
  comboStep: 0.04, comboMin: 0.6,
  respawnDelay: 90, respawnInv: 120, respawnMinStay: 60,
  stocks: 3, timerSec: 480,
  inputBuffer: 6, runAttackFrames: 10,
  dropEveryMin: 600, dropEveryMax: 840, dropMax: 2, dropUses: 8, dropLife: 900,
  emoteCD: 60, emoteShow: 100, chestFirst: 50, chestDelay: 110, chestLife: 1500,
  netSnapEvery: 2, netInputRedundancy: 6, netInputDelay: 2, netTimeoutMs: 12000,
  maxParticles: 900,
};
const BITS = { L: 1, R: 2, U: 4, D: 8, J: 16, LT: 32, SG: 64, DG: 128, TH: 256, TN: 512 };
// emote id 1..10 encoded in bits 10..13
const EMOTE_SHIFT = 10;
const BALANCE_REPORT = "Round-robin: 72 legends x 120 matches each (4320 matches), difficulty-4 bots, ranked rules (3 stocks, 8:00, ranked maps, drops on, gadgets/hazards off), mirrored sides.\nWin rates: 46/72 within 45-55%, 53/72 within 42-58%. Range 31.7%-68.8%. Binomial noise at n=120 is about +/-4.6% (1 sd).\nTop 8: Nephthys 68.8, Apep 65.0, Ares 64.2, Nüwa 62.5, Surtr 60.8, Poseidon 60.0, Erlang Shen 60.0, Brynhild 58.3\nBottom 8: Skadi 31.7, Tyr 33.3, Khonsu 34.2, Fuxi 40.0, Heimdall 40.0, Heracles 41.7, Hephaestus 41.7, Apollo 41.7\nMedian match length 105s (p10 67s, p90 161s).\nKO damage %: p10 70, median 140, p9";

/* ---- 01_util.js ---- */
/* ===================== UTIL ===================== */
const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  sign: v => v > 0 ? 1 : v < 0 ? -1 : 0,
  approach: (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t),
  deg: d => d * Math.PI / 180,
  dist: (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by),
  // mulberry32 stepping a 32-bit seed held in an object (state)
  rnd(o) { let t = (o.seed = (o.seed + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; },
  rint(o, a, b) { return a + Math.floor(U.rnd(o) * (b - a + 1)); },
  pick(o, arr) { return arr[Math.floor(U.rnd(o) * arr.length)]; },
  hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; },
  mkRng(seed) { return { seed: seed | 0 }; },
  shuffle(o, arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(U.rnd(o) * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
  rectHit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; },
  circRect(cx, cy, r, b) { const nx = U.clamp(cx, b.x, b.x + b.w), ny = U.clamp(cy, b.y, b.y + b.h); return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) <= r * r; },
  hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
  rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); },
  mix(h1, h2, t) { const a = U.hex2rgb(h1), b = U.hex2rgb(h2); return U.rgb2hex(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t); },
  shade(h, f) { return f >= 0 ? U.mix(h, '#ffffff', f) : U.mix(h, '#000000', -f); },
  rgba(h, a) { const c = U.hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; },
  lum(h) { const c = U.hex2rgb(h); return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255; },
  fmtTime(f) { const s = Math.max(0, Math.ceil(f / 60)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); },
  esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
};
// Storage with in-memory fallback (sandboxed previews block localStorage)
const Store = (() => {
  const mem = {}; let ok = false;
  try { const k = '__pc_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); ok = true; } catch (e) { ok = false; }
  return {
    get(k) { try { if (ok) return localStorage.getItem(k); } catch (e) { } return k in mem ? mem[k] : null; },
    set(k, v) { mem[k] = v; try { if (ok) localStorage.setItem(k, v); } catch (e) { } },
    del(k) { delete mem[k]; try { if (ok) localStorage.removeItem(k); } catch (e) { } },
    get persistent() { return ok; },
  };
})();

/* ---- 10_weapons.js ---- */

function resolveLook(li, skin, preset) {

// Layout archetypes -> geometry. World units = logical px, y down, main stage top = 0, symmetric about x = 0.
function buildLayout(arch, v) {
  v = v || 0;
  const L = { solids: [], softs: [], moving: [], cling: false };
  const S = (cx, y, w, h) => L.solids.push({ x: cx - w / 2, y, w, h: h || 60 });
  const P = (cx, y, w) => L.softs.push({ x: cx - w / 2, y, w });
  switch (arch) {
    case 'classic': S(0, 0, 440 - v * 30, 70); P(-128 + v * 8, -96, 118); P(128 - v * 8, -96, 118); if (v === 1) P(0, -178, 110); if (v === 2) { P(-60, -190, 90); P(60, -190, 90); } break;
    case 'twin': S(-160, 0, 200, 70); S(160, 0, 200, 70); P(0, -86, 110 - v * 10); if (v) { P(-160, -170, 90); P(160, -170, 90); } break;
    case 'tower': S(0, 0, 300, 80); P(-95, -84, 100); P(95, -84, 100); P(0, -166, 120); P(-95, -248, 100); P(95, -248, 100); if (v) P(0, -330, 110); break;
    case 'bridge': S(0, 0, 600 - v * 40, 16); if (v === 1) { P(-150, -100, 100); P(150, -100, 100); } break;
    case 'walls': S(0, 0, 380, 320); L.cling = true; P(-110, -96, 110); P(110, -96, 110); if (v) P(0, -176, 100); break;
    case 'trio': S(-180, 0, 150, 26); S(180, 0, 150, 26); S(0, -70, 150, 26); if (v) { P(-90, -150, 80); P(90, -150, 80); } break;
    case 'pit': S(-140, 0, 190, 80); S(140, 0, 190, 80); P(0, -92, 96); if (v) { P(-150, -170, 90); P(150, -170, 90); } break;
    case 'stairs': S(0, 0, 210, 70); S(-210, 52, 150, 60); S(210, 52, 150, 60); P(-118, -88, 96); P(118, -88, 96); if (v) P(0, -172, 96); break;
    case 'ring': { S(0, 0, 280, 70); const cy = -128, r = 128; [150, 90, 30, 210, 330].forEach((a, i) => { const rad = a * Math.PI / 180; P(Math.round(Math.cos(rad) * r * (i > 2 ? 1.35 : 1)), Math.round(cy - Math.sin(rad) * r * (i > 2 ? 0.25 : 1)), 84); }); break; }
    case 'moving': S(0, 0, 330, 70); L.moving.push({ w: 92, soft: 1, cx: -150, cy: -100, ax: 70, ay: 0, period: 360, phase: 0 }); L.moving.push({ w: 92, soft: 1, cx: 150, cy: -100, ax: -70, ay: 0, period: 360, phase: 0 }); if (v) L.moving.push({ w: 100, soft: 1, cx: 0, cy: -185, ax: 0, ay: 34, period: 300, phase: 0 }); break;
  }
  // extents
  let minX = 1e9, maxX = -1e9, minY = 1e9;
  L.solids.forEach(s => { minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x + s.w); minY = Math.min(minY, s.y); });
  L.softs.forEach(s => { minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x + s.w); minY = Math.min(minY, s.y); });
  L.moving.forEach(m => { minX = Math.min(minX, m.cx - Math.abs(m.ax) - m.w / 2); maxX = Math.max(maxX, m.cx + Math.abs(m.ax) + m.w / 2); minY = Math.min(minY, m.cy - Math.abs(m.ay)); });
  L.ext = { minX, maxX, minY };
  L.blast = { l: Math.round(minX - CONFIG.blastSide), r: Math.round(maxX + CONFIG.blastSide), t: Math.round(Math.min(-262, minY - CONFIG.blastTop)), b: 300 };
  // spawns: walk surfaces left->right, take symmetric pairs
  const surf = [];
  L.solids.forEach(s => surf.push({ x0: s.x, x1: s.x + s.w, y: s.y }));
  L.softs.forEach(s => surf.push({ x0: s.x, x1: s.x + s.w, y: s.y }));
  const pts = [];
  const main = surf.filter(s => s.y >= -10).sort((a, b) => a.x0 - b.x0);
  const lo = main[0].x0 + 30, hi = main[main.length - 1].x1 - 30;
  const onSurface = x => main.some(s => x > s.x0 + 8 && x < s.x1 - 8);
  for (const f of [0.18, 0.34, 0.06, 0.45]) {
    let x = Math.round(lo + (hi - lo) * f);
    let tries = 0; while (!onSurface(x) && tries++ < 40) x += 6;
    const s = main.find(m => x > m.x0 && x < m.x1) || main[0];
    pts.push({ x, y: s.y }, { x: -x, y: s.y });
  }
  L.spawns = pts.slice(0, 8);
  L.teamSpawns = [L.spawns.filter((p, i) => i % 2 === 0), L.spawns.filter((p, i) => i % 2 === 1)];
  L.respawn = { x: 0, y: Math.round(minY - 70) };
  const ws = L.softs.length >= 2 ? L.softs.slice(0, 2).map(s => ({ x: Math.round(s.x + s.w / 2), y: s.y })) : [{ x: -90, y: 0 }, { x: 90, y: 0 }];
  L.weaponSpawns = [ws[0], ws[1], { x: Math.round(lo + 40), y: main[0].y }, { x: -Math.round(lo + 40), y: main[0].y }];
  return L;
}

    case 'snow': c.fillStyle = 'rgba(255,255,255,0.8)'; for (let i = 0; i < 70 * n; i++) { const x = ((i * 89 + Math.sin(t / 50 + i) * 20 + t * 0.4) % W), y = (i * 41 + t * 0.9) % H; c.fillRect(x, y, 2, 2); } break;

    case 'petals': for (let i = 0; i < 40 * n; i++) { const x = ((i * 83 + t * 0.6 + Math.sin(t / 60 + i) * 30) % W), y = (i * 47 + t * 0.7) % H; c.fillStyle = 'rgba(255,170,200,0.85)'; c.beginPath(); c.ellipse(x, y, 3, 1.6, t / 20 + i, 0, PI * 2); c.fill(); } break;

    case 'bubbles': c.strokeStyle = 'rgba(200,240,255,0.5)'; c.lineWidth = 1; for (let i = 0; i < 30 * n; i++) { const x = (i * 97 + Math.sin(t / 30 + i) * 8) % W, y = H - ((i * 53 + t * 0.8) % (H + 20)); c.beginPath(); c.arc(x, y, 2 + (i % 3), 0, PI * 2); c.stroke(); } break;
    case 'dust': for (let i = 0; i < 50 * n; i++) { const x = (i * 71 + t * 1.6) % W, y = (i * 37 + Math.sin(t / 40 + i) * 10) % H; c.fillStyle = 'rgba(230,190,140,0.35)'; c.fillRect(x, y, 2, 1); } break;
    case 'mist': for (let i = 0; i < 4; i++) { const x = ((i * 300 + t * 0.3) % (W + 400)) - 200; glowCircle(c, x, H * 0.7 + i * 10, 160, pal.cloud, 0.12); } break;
    case 'ghosts': for (let i = 0; i < 5; i++) { const x = ((i * 190 + t * 0.25) % (W + 100)) - 50, y = 120 + Math.sin(t / 50 + i) * 20 + i * 30; c.fillStyle = 'rgba(180,220,255,0.12)'; c.beginPath(); c.arc(x, y, 12, PI, 0); c.lineTo(x + 12, y + 26); c.lineTo(x - 12, y + 26); c.fill(); } break;
