function hash(a,b,c){let h=(a*374761393+b*668265263+(c||0)*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}

function textW(str,s){return str.length*6*(s||1)-(s||1);}
function drawText(ctx,str,x,y,o){
  o=o||{};const s=o.s||1,col=o.c||'#fff',sh=o.sh;
  str=String(str).toUpperCase();
  if(o.al==='c')x=Math.round(x-textW(str,s)/2);else if(o.al==='r')x=Math.round(x-textW(str,s));
  const pass=(ox,oy,c)=>{ctx.fillStyle=c;
    for(let i=0;i<str.length;i++){const g=FONT[str[i]]||FONT['?'];
      for(let r=0;r<7;r++){const bits=g[r];if(!bits)continue;
        for(let b=0;b<5;b++)if(bits&(16>>b))ctx.fillRect(x+ox+(i*6+b)*s,y+oy+r*s,s,s);}}};
  if(o.ol){const k=Math.max(1,Math.ceil(s/2));for(const[dx,dy]of[[-k,0],[k,0],[0,-k],[0,k],[-k,-k],[k,k],[-k,k],[k,-k]])pass(dx,dy,o.ol);}
  if(sh)pass(s,s,sh);
  pass(0,0,col);
}

// ===== LEVELS =====
// legend: # solid  . empty  m mud(Cob safe)  q quicksand(Dune safe)  f fire  ^ spikes  S sieve  W wind vent
// A-D gates  a-d light plates  5-8 heavy plates  1-4 levers  k crate  O boulder  @ Cob spawn  % Dune spawn  [ Cob door  ] Dune door
function buildRows(fn){
  const g=[];
  for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<COLS;c++)row.push((r===0||r>=14||c===0||c===COLS-1)?'#':'.');g.push(row);}
  const B={s(c,r,ch){g[r][c]=ch;},f(c0,r0,c1,r1,ch){for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)g[r][c]=ch;}};
  fn(B);
  return g.map(r=>r.join(''));
}

// ===== WORLD RUNTIME =====
let L=null, S=null;
const GLIDE_MAX=26;
const CH=[
 {name:'COB', speed:1.5, accG:0.28, accA:0.20, fric:0.32, jump:5.2},
 {name:'DUNE',speed:1.9, accG:0.32, accA:0.24, fric:0.32, jump:6.0}
];
let evHook=null; // render/audio side hook for local events
function emit(n,x,y,k){ if(!S)return; if(S.ev.length<40)S.ev.push([n,Math.round(x),Math.round(y),k||0]); if(evHook)evHook(n,x,y,k||0); }

function parseLevel(idx){
  const def=LEVELS[idx];
  const rows=buildRows(def.build);
  const g=rows.map(r=>r.split(''));
  const o={idx,def,g,theme:def.theme,gates:[[],[],[],[]],plates:[],levers:[],doors:[],vents:[],boxes:[],sp:[null,null],gems:[],name:def.name,par:def.par,hint:def.hint,nomold:new Set()};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ch=g[r][c];
    if(ch==='@'){o.sp[0]={c,r};g[r][c]='.';}
    else if(ch==='%'){o.sp[1]={c,r};g[r][c]='.';}
    else if(ch>='A'&&ch<='D'){o.gates[ch.charCodeAt(0)-65].push({c,r});}
    else if(ch>='a'&&ch<='d'){o.plates.push({c,r,ch:ch.charCodeAt(0)-97,heavy:false});g[r][c]='.';o.nomold.add(r*COLS+c);}
    else if(ch>='5'&&ch<='8'){o.plates.push({c,r,ch:ch.charCodeAt(0)-53,heavy:true});g[r][c]='.';o.nomold.add(r*COLS+c);}
    else if(ch>='1'&&ch<='4'){o.levers.push({c,r,ch:ch.charCodeAt(0)-49});g[r][c]='.';o.nomold.add(r*COLS+c);}
    else if(ch==='['){o.doors.push({c,r,who:0});g[r][c]='.';o.nomold.add(r*COLS+c);o.nomold.add((r-1)*COLS+c);}
    else if(ch===']'){o.doors.push({c,r,who:1});g[r][c]='.';o.nomold.add(r*COLS+c);o.nomold.add((r-1)*COLS+c);}
    else if(ch==='k'||ch==='O'){o.boxes.push({c,r,k:ch==='O'?1:0});g[r][c]='.';}
    else if(ch==='W'){o.vents.push({c,r});o.nomold.add(r*COLS+c);}
  }
  for(const v of o.vents){let t=v.r-1;while(t>0&&g[t][v.c]!=='#'&&v.r-t<=12)t--;v.top=t+1;}
  o.gems=(def.gems||[]).map(a=>({c:a[0],r:a[1],k:a[2]}));
  return o;
}
function newPlayer(sp){return{x:sp.c*TS+3,y:sp.r*TS+2,vx:0,vy:0,face:1,onG:false,coy:0,jb:0,jumping:false,alive:true,sift:false,glide:false,wind:false,inDoor:false,pushing:false,pushMax:9,anim:0,tx:0,ty:0,landed:false,gl:GLIDE_MAX};}
function newState(i){
  return{lv:i,t:0,time:0,st:'play',stt:0,msg:'',winT:0,stars:0,
   ch:[false,false,false,false],pl:[newPlayer(L.sp[0]),newPlayer(L.sp[1])],
   boxes:L.boxes.map(b=>({x:b.c*TS,y:b.r*TS,vy:0,k:b.k})),molds:[],
   lvr:L.levers.map(()=>false),lvOv:L.levers.map(()=>false),gems:L.gems.map(()=>false),pr:L.plates.map(()=>false),ev:[],got:[0,0]};
}
function startLevel(i){L=parseLevel(i);S=newState(i);return S;}

// ---- collision helpers ----
function tileAt(c,r){if(c<0||c>=COLS||r<0||r>=ROWS)return '#';return L.g[r][c];}
function moldAt(c,r){for(const m of S.molds)if(m.c===c&&m.r===r)return true;return false;}
function solidCh(ch,who){
  if(ch==='#')return true;
  if(ch==='S')return !(who&&who.sift);
  if(ch>='A'&&ch<='D')return !S.ch[ch.charCodeAt(0)-65];
  return false;
}
function tileBlock(x,y,w,h,who){
  const c0=Math.floor(x/TS),c1=Math.floor((x+w-0.001)/TS),r0=Math.floor(y/TS),r1=Math.floor((y+h-0.001)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){if(solidCh(tileAt(c,r),who)||moldAt(c,r))return true;}
  return false;
}
function boxHit(x,y,w,h,ign){for(const b of S.boxes){if(b!==ign&&rectOverlap(x,y,w,h,b.x,b.y,TS,TS))return b;}return null;}
function playerHit(x,y,w,h,exc){for(let i=0;i<2;i++){if(i===exc)continue;const p=S.pl[i];if(p.alive&&rectOverlap(x,y,w,h,p.x,p.y,PW,PH))return true;}return false;}
function overlapTile(p,chr){
  const c0=Math.floor(p.x/TS),c1=Math.floor((p.x+PW-0.001)/TS),r0=Math.floor(p.y/TS),r1=Math.floor((p.y+PH-0.001)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(tileAt(c,r)===chr)return true;return false;
}
function canPush(i,b){return b.k===0||i===0;}
function pushSpeed(i,b){return b.k===1?0.7:(i===0?1.1:0.8);}
function pushBox(b,dx,who){
  const nx=b.x+dx;
  if(tileBlock(nx,b.y,TS,TS,null)||boxHit(nx,b.y,TS,TS,b)||playerHit(nx,b.y,TS,TS,who))return false;
  b.x=nx;return true;
}

// ===== PLAYER / BOX / MECHANISM STEPS =====
function movePlayerX(i,dx){
  const p=S.pl[i];if(!dx)return;
  const sg=dx>0?1:-1;let rem=Math.abs(dx);
  while(rem>0.0001){
    const st=Math.min(1,rem);rem-=st;
    const nx=p.x+sg*st;
    if(tileBlock(nx,p.y,PW,PH,p)){p.vx=0;break;}
    const b=boxHit(nx,p.y,PW,PH,null);
    if(b){
      if(canPush(i,b)&&pushBox(b,sg*st,i)){p.pushing=true;p.pushMax=pushSpeed(i,b);p.x=nx;continue;}
      p.vx=0;break;
    }
    p.x=nx;
  }
}
function movePlayerY(i,dy){
  const p=S.pl[i];if(!dy)return;
  const sg=dy>0?1:-1;let rem=Math.abs(dy);
  while(rem>0.0001){
    const st=Math.min(1,rem);rem-=st;
    const ny=p.y+sg*st;
    if(tileBlock(p.x,ny,PW,PH,p)||boxHit(p.x,ny,PW,PH,null)){if(sg>0)p.landed=true;p.vy=0;break;}
    p.y=ny;
  }
}
function sieveAboveHead(p){
  const cx=Math.floor((p.x+PW/2)/TS);
  for(const d of[2,10,18,26,34,40]){
    const ch=tileAt(cx,Math.floor((p.y-d)/TS));
    if(ch==='S')return true;
    if(solidCh(ch,p)||moldAt(cx,Math.floor((p.y-d)/TS)))return false;
  }
  return false;
}
function canMold(c,r){
  if(c<1||c>COLS-2||r<1||r>ROWS-2)return false;
  if(!'.mqf^'.includes(L.g[r][c])||L.nomold.has(r*COLS+c))return false;
  if(moldAt(c,r))return false;
  for(const p of S.pl)if(p.alive&&rectOverlap(p.x,p.y,PW,PH,c*TS,r*TS,TS,TS))return false;
  for(const b of S.boxes)if(rectOverlap(b.x,b.y,TS,TS,c*TS,r*TS,TS,TS))return false;
  return true;
}
function doMold(p,inp){
  const col=p.face>0?Math.floor((p.x+PW-0.01)/TS)+1:Math.floor(p.x/TS)-1;
  const br=Math.floor((p.y+PH-1)/TS);
  const rows=inp.u?[br-1]:inp.d?[br+1]:[br+1,br];
  for(const r of rows){
    const k=S.molds.findIndex(m=>m.c===col&&m.r===r);
    if(k>=0){S.molds.splice(k,1);emit('unmold',col*TS+8,r*TS+8);return;}
  }
  for(const r of rows){
    if(canMold(col,r)){S.molds.push({c:col,r:r,t:S.t});if(S.molds.length>2)S.molds.shift();emit('mold',col*TS+8,r*TS+8);return;}
  }
  emit('nope',p.x+5,p.y);
}
function stepPlayer(i,inp){
  const p=S.pl[i],C=CH[i];
  if(!p.alive)return;
  const wasPush=p.pushing;p.pushing=false;p.landed=false;
  const ov=(i===1)&&overlapTile(p,'S');
  p.sift=(i===1)&&(!!inp.a||ov);
  if(p.onG)p.coy=3;else if(p.coy>0)p.coy--;
  if(inp.uP)p.jb=7;else if(p.jb>0)p.jb--;
  if(i===0&&inp.aP)doMold(p,inp);
  // horizontal
  const dir=(inp.r?1:0)-(inp.l?1:0);
  let maxV=p.sift?0.95:C.speed;if(wasPush)maxV=Math.min(maxV,p.pushMax);
  const acc=p.onG?C.accG:C.accA;
  if(dir!==0){
    p.face=dir;const tg=dir*maxV;
    if(p.vx<tg)p.vx=Math.min(tg,p.vx+acc);else if(p.vx>tg)p.vx=Math.max(tg,p.vx-acc*1.5);
  }else{const f=p.onG?C.fric:0.07;if(Math.abs(p.vx)<=f)p.vx=0;else p.vx-=Math.sign(p.vx)*f;}
  // jump
  if(!p.sift&&p.jb>0&&p.coy>0){p.vy=-C.jump;p.jb=0;p.coy=0;p.onG=false;p.jumping=true;emit('jump',p.x+5,p.y+PH,i);}
  if(p.jumping){if(p.vy>=0)p.jumping=false;else if(!inp.u&&p.vy<-2.4)p.vy=-2.4;}
  // vertical
  const sieveHere=p.sift&&ov;
  if(sieveHere||(p.sift&&inp.u&&sieveAboveHead(p))){
    p.vy=inp.u?-0.9:(inp.d?1.0:0.35);p.jumping=false;
  }else p.vy=Math.min(p.vy+G,MAXFALL);
  p.glide=false;
  p.wind=false;
  if(i===1){for(const v of L.vents){if(rectOverlap(p.x,p.y,PW,PH,v.c*TS+2,v.top*TS,12,(v.r+1-v.top)*TS)){p.wind=true;break;}}}
  if(p.onG||p.wind)p.gl=GLIDE_MAX;
  if(i===1&&!p.sift&&!p.onG&&inp.u&&p.vy>0.9&&p.gl>0){p.vy=0.9;p.glide=true;p.gl--;}
  if(p.wind&&!p.sift){p.vy-=0.62;if(p.vy<-2.4)p.vy=-2.4;p.glide=false;}
  const preVy=p.vy;
  movePlayerX(i,p.vx);
  movePlayerY(i,p.vy);
  p.onG=(p.vy>=0)&&(tileBlock(p.x,p.y+1,PW,PH,p)||!!boxHit(p.x,p.y+1,PW,PH,null));
  if(p.landed&&preVy>3.2)emit('land',p.x+5,p.y+PH,i);
  p.anim+=Math.abs(p.vx)*0.16;
}
function stepBoxes(){
  for(const b of S.boxes){
    b.vy=Math.min(b.vy+G,MAXFALL);
    let rem=b.vy;
    while(rem>0.0001){
      const st=Math.min(1,rem);rem-=st;
      const ny=b.y+st;
      if(tileBlock(b.x,ny,TS,TS,null)||boxHit(b.x,ny,TS,TS,b)||playerHit(b.x,ny,TS,TS,-1)){b.vy=0;break;}
      b.y=ny;
    }
  }
}
function hazardFor(i){
  const p=S.pl[i];
  const c0=Math.floor(p.x/TS),c1=Math.floor((p.x+PW)/TS),r0=Math.floor(p.y/TS),r1=Math.floor((p.y+PH)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const ch=tileAt(c,r);
    if(ch!=='m'&&ch!=='q'&&ch!=='f'&&ch!=='^')continue;
    if(moldAt(c,r))continue;
    let hx,hy,hw,hh;
    if(ch==='^'){hx=c*TS+2;hy=r*TS+8;hw=12;hh=8;}
    else if(ch==='f'){hx=c*TS+2;hy=r*TS+5;hw=12;hh=11;}
    else{hx=c*TS+1;hy=r*TS+4;hw=14;hh=12;}
    if(!rectOverlap(p.x,p.y,PW,PH,hx,hy,hw,hh))continue;
    if(ch==='m'&&i===0)continue;
    if(ch==='q'&&i===1)continue;
    return ch;
  }
  return null;
}
function killPlayer(i,why){
  const p=S.pl[i];if(!p.alive||S.st!=='play')return;
  p.alive=false;S.st='dead';S.stt=0;
  const n=CH[i].name;
  S.msg=why==='q'?n+' SANK IN QUICKSAND!':why==='m'?n+' CLUMPED UP IN MUD!':why==='f'?n+' GOT TOASTED!':why==='^'?n+' HIT THE SPIKES!':n+' FELL OUT OF THE WORLD!';
  emit('die',p.x+5,p.y+7,i);
}
function stepMech(){
  const want=[false,false,false,false];
  L.plates.forEach((pl,k)=>{
    const hx=pl.c*TS+1,hy=pl.r*TS+10,hw=14,hh=6;let pr=false;
    for(let i=0;i<2&&!pr;i++){const p=S.pl[i];if(!p.alive||(pl.heavy&&i!==0))continue;if(rectOverlap(p.x,p.y,PW,PH,hx,hy,hw,hh))pr=true;}
    if(!pr)for(const b of S.boxes){if(pl.heavy&&b.k!==1)continue;if(rectOverlap(b.x,b.y,TS,TS,hx,hy,hw,hh)){pr=true;break;}}
    if(pr!==S.pr[k]){S.pr[k]=pr;emit('plate',pl.c*TS+8,pl.r*TS+12,pr?1:0);}
    if(pr)want[pl.ch]=true;
  });
  L.levers.forEach((lv,k)=>{
    let ov=false;
    for(const p of S.pl)if(p.alive&&rectOverlap(p.x,p.y,PW,PH,lv.c*TS+3,lv.r*TS+4,10,12))ov=true;
    if(ov&&!S.lvOv[k]){S.lvr[k]=!S.lvr[k];emit('lever',lv.c*TS+8,lv.r*TS+8,S.lvr[k]?1:0);}
    S.lvOv[k]=ov;
    if(S.lvr[k])want[lv.ch]=true;
  });
  for(let k=0;k<4;k++){
    if(!L.gates[k].length)continue;
    let open=want[k];
    if(!open&&S.ch[k]){
      for(const g of L.gates[k]){
        for(const p of S.pl)if(p.alive&&rectOverlap(p.x,p.y,PW,PH,g.c*TS,g.r*TS,TS,TS))open=true;
        for(const b of S.boxes)if(rectOverlap(b.x,b.y,TS,TS,g.c*TS,g.r*TS,TS,TS))open=true;
        if(open)break;
      }
    }
    if(open!==S.ch[k]){S.ch[k]=open;emit('gate',L.gates[k][0].c*TS+8,L.gates[k][0].r*TS+8,open?1:0);}
  }
}
function stepPickups(){
  L.gems.forEach((g,k)=>{
    if(S.gems[k])return;const p=S.pl[g.k];if(!p.alive)return;
    if(rectOverlap(p.x,p.y,PW,PH,g.c*TS+3,g.r*TS+3,10,10)){S.gems[k]=true;S.got[g.k]++;emit('gem',g.c*TS+8,g.r*TS+8,g.k);}
  });
}
function stepDoors(){
  let both=true;
  for(let i=0;i<2;i++){
    const p=S.pl[i],d=L.doors.find(d=>d.who===i);
    const was=p.inDoor;
    p.inDoor=p.alive&&Math.abs(p.x+PW/2-(d.c*TS+8))<=6&&p.y+PH>d.r*TS+8&&p.y+PH<=(d.r+1)*TS+1;
    if(p.inDoor&&!was)emit('door',d.c*TS+8,d.r*TS+8,i);
    if(!p.inDoor)both=false;
  }
  S.winT=both?S.winT+1:0;
  if(S.winT>=28&&S.st==='play'){
    S.st='win';S.stt=0;
    const allGems=S.got[0]+S.got[1]>=L.gems.length;
    S.stars=1+(allGems?1:0)+(S.time/60<=L.par?1:0);
    emit('win',W/2,H/2,0);
  }
}
function stepGame(inps){
  if(S.st==='play'){
    S.t++;S.time++;
    stepPlayer(0,inps[0]);stepPlayer(1,inps[1]);
    stepBoxes();stepMech();stepPickups();
    for(let i=0;i<2;i++){
      const p=S.pl[i];if(!p.alive)continue;
      if(p.y>H+16)killPlayer(i,'void');
      else{const h=hazardFor(i);if(h)killPlayer(i,h);}
    }
    stepDoors();
  }else{S.stt++;S.t++;}
}

function handleEvent(n,x,y,k){

  else if(n==='land'){burst(x,y,6,cols,1,0,14);Sfx.land();}
  else if(n==='mold'){burst(x,y,12,CLAYC,1.4,0.5,20);Sfx.mold();}
  else if(n==='unmold'){burst(x,y,10,CLAYC,1.2,0.3,18);Sfx.unmold();}
  else if(n==='nope'){Sfx.nope();}
  else if(n==='gem'){burst(x,y,14,k===0?CLAYC.concat(['#fff']):SANDC.concat(['#fff']),1.6,0.6,26);Sfx.gem(k);}
  else if(n==='plate'){Sfx.plate(k);}

  else if(n==='gate'){Sfx.gate(k);}
  else if(n==='door'){burst(x,y,10,['#fff6c8','#ffe27a'],1.2,0.4,24);Sfx.door();}

}

const Audio8={ac:null,master:null,musicGain:null,sfxGain:null,muted:false,track:-1,timer:null,step:0,nextT:0,started:false};
function audioInit(){

  Audio8.musicGain=ac.createGain();Audio8.musicGain.gain.value=0.16;Audio8.musicGain.connect(Audio8.master);

function setMuted(m){Audio8.muted=m;if(Audio8.master)Audio8.master.gain.value=m?0:0.9;}
function mtof(n){return 440*Math.pow(2,(n-69)/12);}

const Net={peer:null,conn:null,role:null,code:'',status:'idle',err:'',open:false,hostSide:0,mySide:0,remoteIn:{l:0,r:0,u:0,d:0,a:0},latch:{uP:0,aP:0},onEvent:null,tries:0,joinTimer:null,lastRecv:0};

function loadPeerJS(cb,fail){
  if(window.Peer){cb();return;}
  const urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
  let i=0;
  const tryNext=()=>{
    if(i>=urls.length){fail();return;}
    const s=document.createElement('script');s.src=urls[i++];
    s.onload=()=>{if(window.Peer)cb();else tryNext();};
    s.onerror=()=>tryNext();
    document.head.appendChild(s);
  };
  tryNext();
}
function netClose(silent){
  try{if(Net.conn){if(!silent&&Net.open)Net.conn.send({t:'bye'});Net.conn.close();}}catch(e){}
  try{if(Net.peer)Net.peer.destroy();}catch(e){}
  if(Net.joinTimer){clearTimeout(Net.joinTimer);Net.joinTimer=null;}
  Net.peer=null;Net.conn=null;Net.open=false;Net.role=null;Net.status='idle';
  Net.remoteIn={l:0,r:0,u:0,d:0,a:0};Net.latch={uP:0,aP:0};
}
function netSend(m){if(Net.conn&&Net.open){try{Net.conn.send(m);}catch(e){}}}
function netSetup(c){
  Net.conn=c;
  const onOpen=()=>{
    Net.open=true;Net.status='connected';Net.lastRecv=performance.now();
    if(Net.joinTimer){clearTimeout(Net.joinTimer);Net.joinTimer=null;}
    if(Net.role==='host'){netSend({t:'hello',side:Net.hostSide});}
    if(Net.onEvent)Net.onEvent({t:'connected'});
  };
  c.on('open',onOpen);if(c.open)onOpen();
  c.on('data',d=>{Net.lastRecv=performance.now();if(d&&Net.onEvent)Net.onEvent(d);});
  c.on('close',()=>{const was=Net.open;Net.open=false;if(was&&Net.onEvent)Net.onEvent({t:'closed'});});
  c.on('error',()=>{if(Net.onEvent)Net.onEvent({t:'closed'});});
}
function netHost(){
  netClose(true);Net.role='host';Net.status='starting';Net.err='';Net.tries=0;
  loadPeerJS(()=>{
    const make=()=>{
      Net.code=randCode();
      const p=new Peer('cobdune-'+Net.code,{debug:0});Net.peer=p;
      p.on('open',()=>{Net.status='waiting';});
      p.on('connection',c=>{if(Net.conn&&Net.open){try{c.close();}catch(e){}return;}netSetup(c);});
      p.on('error',e=>{
        if(e.type==='unavailable-id'&&Net.tries++<6){try{p.destroy();}catch(x){}make();}
        else{Net.status='error';Net.err=(e.type==='network'||e.type==='server-error'||e.type==='socket-error')?'CAN\'T REACH THE MATCH SERVER':'CONNECTION ERROR';}
      });

    };

function netJoin(code){
  netClose(true);Net.role='guest';Net.status='connecting';Net.err='';Net.code=code;

    const p=new Peer({debug:0});Net.peer=p;
    p.on('open',()=>{

    });

      if(Net.open)return;

      Net.err=e.type==='peer-unavailable'?'ROOM NOT FOUND. CHECK THE CODE.':(e.type==='network'||e.type==='server-error'||e.type==='socket-error')?'CAN\'T REACH THE MATCH SERVER':'CONNECTION ERROR';

}

  for(let i=0;i<4;i++){const bx=W/2-100+i*52;drawPanel(bx,84,44,52,'#1d1526',i===joinCode.length&&Net.status!=='connecting'&&((tick>>4)&1)?'#fff':'#e9c46a');
    if(joinCode[i])drawText(ctx,joinCode[i],bx+22,94,{s:5,al:'c',c:'#ffe27a',sh:'#5a3a10'});}
  const msg=Net.status==='connecting'?'CONNECTING...':Net.status==='error'?Net.err:joinCode.length===4?'PRESS ENTER TO JOIN':'';
  drawText(ctx,msg,W/2,152,{al:'c',c:Net.status==='error'?'#ff7a5a':'#fff',ol:'#1c3a58'});
  drawText(ctx,'BACKSPACE: DELETE   ESC: BACK',W/2,H-10,{al:'c',c:'#0d2438'});
}
function drawWait(){
  skyBG(0);drawBgAnim(tick,0);drawGroundStrip(0);
  drawText(ctx,'CONNECTED!',W/2,40,{s:4,al:'c',c:'#fff',ol:'#1c3a58'});
  const me=Net.mySide===0?'COB':'DUNE';
  drawText(ctx,'YOU PLAY AS',W/2,100,{al:'c',c:'#fff',ol:'#1c3a58'});
  drawText(ctx,me,W/2,114,{s:3,al:'c',c:me==='COB'?'#e8804e':'#f6dc84',ol:'#2a1410'});
  sprBig(Net.mySide===0?'cob_idle_1':'dune_idle_1',W/2-18,142,3);
  drawText(ctx,'WAITING FOR THE HOST TO PICK A LEVEL...',W/2,218,{al:'c',c:'#fff',ol:'#1c3a58'});
  drawText(ctx,'ESC: LEAVE ROOM',W/2,H-10,{al:'c',c:'#0d2438'});
}
function drawSelect(){
  skyBG(2);
  drawText(ctx,'SELECT A LEVEL',W/2,5,{s:2,al:'c',c:'#fbe6a2',sh:'#2a1410'});
  const sumSt=save.stars.reduce((a,b)=>a+b,0);
  drawText(ctx,'STARS '+sumSt+'/36',W-8,8,{al:'r',c:'#ffd24a'});
  if(mode!=='local')drawText(ctx,'ONLINE: YOU ARE '+(Net.mySide===0?'COB':'DUNE'),8,8,{c:'#8fe070'});
  for(let w=0;w<3;w++){
    const y0=26+w*76;
    drawText(ctx,WORLDS[w].name,12,y0,{c:'#fbe6a2',sh:'#2a1410'});
    for(let k=0;k<4;k++){
      const i=w*4+k,x0=12+k*92,y=y0+10,on=i===selLevel,t=TH[w],lift=on?-2:0;
      ctx.fillStyle='#000';ctx.fillRect(x0-1,y-1+lift,88,56);
      ctx.fillStyle=on?'#ffe27a':'#3a2f48';ctx.fillRect(x0,y+lift,86,54);
      ctx.fillStyle=t.sky[1];ctx.fillRect(x0+2,y+2+lift,82,50);
      ctx.fillStyle=t.base;ctx.fillRect(x0+2,y+38+lift,82,14);ctx.fillStyle=t.cap;ctx.fillRect(x0+2,y+38+lift,82,3);
      drawText(ctx,String(i+1),x0+8,y+7+lift,{s:3,c:'#fff',ol:'#2a1410'});
      const nm=LEVELS[i].name;drawText(ctx,nm,x0+43,y+30+lift,{al:'c',c:'#fff',ol:'#2a1410'});
      for(let s=0;s<3;s++)drawStarShape(ctx,x0+25+s*18,y+46+lift,6,s<save.stars[i]?'#ffd24a':'#4a4058');
      hot.push({x:x0,y:y,w:86,h:54,hover:()=>{selLevel=i;},fn:()=>{Sfx.select();selLevel=i;startFromSelect();}});
    }
  }
  const tip=mode==='guest'?'':'ARROWS: MOVE   ENTER: PLAY   ESC: BACK';
  drawText(ctx,tip,W/2,H+6-0,{al:'c',c:'#e9e2f4'});
}
function startFromSelect(){if(mode==='guest')return;beginLevel(selLevel);}
const HOWTO=[
 ()=>{
  drawText(ctx,'HOW TO PLAY',W/2,8,{s:3,al:'c',c:'#fff',ol:'#2a1410'});
  drawText(ctx,'GET BOTH HEROES TO THEIR OWN DOORS AT THE SAME TIME.',W/2,40,{al:'c',c:'#fbe6a2'});
  sprBig('cob_idle_1',22,64,4);sprBig('dune_idle_1',22,148,4);
  const c=['COB THE CLAY GOLEM','- STRONG: PUSHES BOULDERS AND CRATES','- WADES THROUGH MUD, SINKS IN QUICKSAND','- PRESS F TO MOLD A CLAY BLOCK AHEAD (MAX 2)','  W+F HIGH, S+F LOW, F AGAIN TO UNDO','- JUMPS 2 TILES, CANNOT GLIDE'];
  const d=['DUNE THE SAND SPRITE','- LIGHT: PUSHES CRATES, NOT BOULDERS','- SWIMS QUICKSAND, MUD RUINS HER','- HOLD UP IN THE AIR TO GLIDE, RIDE WIND VENTS','- HOLD ACTION TO SIFT THROUGH GRATES','  (ACTION + UP/DOWN TO RISE OR SINK)'];
  c.forEach((s,i)=>drawText(ctx,s,80,62+i*10,{c:i?'#e9e2f4':'#e8804e'}));
  d.forEach((s,i)=>drawText(ctx,s,80,146+i*10,{c:i?'#e9e2f4':'#f6dc84'}));
 },
 ()=>{
  drawText(ctx,'CONTROLS & GADGETS',W/2,8,{s:3,al:'c',c:'#fff',ol:'#2a1410'});
  const t=['COB (PLAYER 1):  A D MOVE   W OR SPACE JUMP   F ACTION','DUNE (PLAYER 2): ARROWS MOVE/JUMP   / OR . ACTION','ONLINE: EITHER KEY SET WORKS.   R RETRY   ESC MENU','',
   'PRESSURE PLATES OPEN GATES OF THE SAME COLOR WHILE HELD.','LEVERS FLIP A GATE OPEN. HEAVY (GREY) PLATES NEED COB','OR A BOULDER. CRATES CAN HOLD ANY PLATE DOWN.','',
   'FIRE AND SPIKES HURT BOTH. MUD HURTS DUNE. QUICKSAND','HURTS COB. CLAY BLOCKS CAN COVER ANY OF THEM!','',
   'EARN STARS: CLEAR THE LEVEL, GRAB ALL GEMS (ORANGE FOR','COB, GOLD FOR DUNE), AND BEAT THE PAR TIME.'];
  t.forEach((s,i)=>drawText(ctx,s,12,44+i*12,{c:i<3?'#ffe27a':'#e9e2f4'}));
 }
];
function drawHowto(){
  ctx.fillStyle='#1d1526';ctx.fillRect(0,0,CW,CVH);skyBG(2);ctx.fillStyle='rgba(20,10,28,.82)';ctx.fillRect(0,0,W,H);
  HOWTO[howPage]();
  drawText(ctx,(howPage+1)+'/'+HOWTO.length+'   LEFT/RIGHT: PAGE   ESC: BACK',W/2,H-10,{al:'c',c:'#8a7f94'});
}
function drawEnd(){
  skyBG(1);drawBgAnim(tick,1);drawGroundStrip(1);
  drawText(ctx,'THE END',W/2,24,{s:6,al:'c',c:'#fff',ol:'#2a1410',sh:'#5a3a10'});
  drawText(ctx,'COB AND DUNE REACHED THE HEART OF THE KILN.',W/2,76,{al:'c',c:'#fff',sh:'#5a3a10'});
  drawText(ctx,'CLAY AND SAND MAKE ONE STRONG BRICK. THANKS FOR PLAYING!',W/2,88,{al:'c',c:'#fff',sh:'#5a3a10'});
  const sumSt=save.stars.reduce((a,b)=>a+b,0);
  drawText(ctx,'STARS: '+sumSt+'/36',W/2,112,{s:2,al:'c',c:'#ffd24a',sh:'#5a3a10'});
  sprBig('cob_idle_1',W/2-70,H-32-14*5-((tick%60)<8?6:0),5);sprBig('dune_idle_-1',W/2+10,H-32-14*5-(((tick+30)%60)<8?6:0),5);
  if((tick>>4)&1)drawText(ctx,'PRESS ENTER',W/2,150,{al:'c',c:'#fff',sh:'#5a3a10'});
}
function drawPlay(){
  if(mode==='guest')smoothGuest();
  ctx.save();
  if(shake>0){ctx.translate(Math.round((Math.random()-0.5)*shake*0.6),Math.round((Math.random()-0.5)*shake*0.6));shake--;}
  drawWorld(tick,false);
  ctx.restore();
  drawHUD();drawOverlay(tick);
  if(mode==='guest'&&performance.now()-Net.lastRecv>3000){drawPanel(W/2-90,100,180,24,'#3a1218','#ff7a5a');drawText(ctx,'CONNECTION LOST?',W/2,108,{al:'c',c:'#fff'});}
}
// ---- update ----
function updatePlay(){
  if(mode==='guest'){
    const m=readMerged(),uP=edge.u1|edge.u2,aP=edge.a1|edge.a2;edge.u1=edge.u2=edge.a1=edge.a2=0;
    const sig=''+m.l+m.r+m.u+m.d+m.a;
    if(sig!==lastSig||uP||aP||tick%10===0){netSend({t:'in',i:m,uP:uP,aP:aP});lastSig=sig;}
    S.ev.length=0;
    return;
  }
  const ins=gatherInputs();
  stepGame(ins);
  if(S.st==='win')recordWin();
  if(mode==='host'){if((S.t&1)===0)netSend(makeSnap());}else S.ev.length=0;
}
function update(){
  tick++;
  if(scene==='play')updatePlay();
  if((scene==='create'||scene==='join')&&Net.status==='error'&&scene==='create'&&false){}
}
function draw(){
  hot=[];
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#100a14';ctx.fillRect(0,0,CW,CVH);
  switch(scene){
    case 'title':drawTitle();break;case 'online':drawOnline();break;case 'create':drawCreate();break;case 'join':drawJoin();break;
    case 'wait':drawWait();break;case 'select':drawSelect();break;case 'howto':drawHowto();break;case 'end':drawEnd();break;case 'play':drawPlay();break;
  }
}
// ---- input events ----
function menuNav(code){
  const items=curItems();if(!items)return false;
  if(code==='ArrowUp'||code==='KeyW'){sel=(sel+items.length-1)%items.length;Sfx.click();return true;}
  if(code==='ArrowDown'||code==='KeyS'){sel=(sel+1)%items.length;Sfx.click();return true;}
  if(code==='Enter'||code==='Space'){Sfx.select();items[sel].act();return true;}
  if(code==='Escape'&&scene==='online'){scene='title';sel=0;return true;}
  return false;
}
function onKeyDown(e){
  audioInit();
  const code=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash'].includes(code))e.preventDefault();
  if(!e.repeat){
    if(K1.u.includes(code))edge.u1=1;if(K2.u.includes(code))edge.u2=1;
    if(K1.a.includes(code))edge.a1=1;if(K2.a.includes(code))edge.a2=1;
  }
  keys.add(code);
  if(e.repeat&&scene==='play')return;
  if(code==='KeyM'&&scene!=='join'){setMuted(!Audio8.muted);return;}
  switch(scene){
    case 'title':case 'online':menuNav(code);break;
    case 'create':
      if(code==='Escape'){netClose();scene='online';sel=0;}
      else if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(code)){Net.hostSide=1-Net.hostSide;Sfx.click();}
      break;
    case 'join':
      if(code==='Escape'){netClose();scene='online';sel=1;}
      else if(Net.status==='connecting'){}
      else if(code==='Backspace'){joinCode=joinCode.slice(0,-1);Net.status='idle';Net.err='';}
      else if(code==='Enter'){if(joinCode.length===4)netJoin(joinCode);}
      else if(/^Key[A-Z]$/.test(code)&&joinCode.length<4){joinCode+=code[3];Net.status='idle';Net.err='';Sfx.click();}
      break;
    case 'wait':if(code==='Escape')leaveToTitle();break;
    case 'howto':
      if(code==='Escape'){scene='title';sel=2;}
      else if(code==='ArrowRight'||code==='KeyD'||code==='Enter'||code==='Space'){if(howPage<HOWTO.length-1){howPage++;Sfx.click();}else{scene='title';sel=2;}}
      else if(code==='ArrowLeft'||code==='KeyA'){if(howPage>0){howPage--;Sfx.click();}}
      break;
    case 'select':
      if(code==='Escape'){if(mode==='local')scene='title';else leaveToTitle();sel=0;}
      else if(mode==='guest'){}
      else if(code==='ArrowLeft'||code==='KeyA'){selLevel=(selLevel+11)%12;Sfx.click();}
      else if(code==='ArrowRight'||code==='KeyD'){selLevel=(selLevel+1)%12;Sfx.click();}
      else if(code==='ArrowUp'||code==='KeyW'){selLevel=(selLevel+8)%12;Sfx.click();}
      else if(code==='ArrowDown'||code==='KeyS'){selLevel=(selLevel+4)%12;Sfx.click();}
      else if(code==='Enter'||code==='Space'){Sfx.select();startFromSelect();}
      break;
    case 'end':if(code==='Enter'||code==='Space'||code==='Escape'){if(mode==='local')scene='title';else{scene=mode==='host'?'select':'wait';}sel=0;}break;
    case 'play':
      if(code==='KeyR'){if(mode==='guest')netSend({t:'req',c:'retry'});else beginLevel(S.lv);}
      else if(code==='Escape'){if(mode==='guest')netSend({t:'req',c:'menu'});else backToSelect();}
      else if(code==='Enter'){
        if(S.st==='win'){if(mode==='guest')netSend({t:'req',c:'next'});else nextLevel();}
        else if(S.st==='dead'){if(mode==='guest')netSend({t:'req',c:'retry'});else beginLevel(S.lv);}
      }
      break;
  }
}
function canvasXY(e){const r=cvs.getBoundingClientRect();return[(e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CVH/r.height];}
function onMouseMove(e){[mouseX,mouseY]=canvasXY(e);for(const h of hot){if(mouseX>=h.x&&mouseX<=h.x+h.w&&mouseY>=h.y&&mouseY<=h.y+h.h){if(h.hover)h.hover();break;}}}
function onMouseDown(e){audioInit();const [x,y]=canvasXY(e);for(const h of hot){if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();break;}}}
function resize(){let s=Math.min(innerWidth/CW,innerHeight/CVH);if(s>=2)s=Math.floor(s);cvs.style.width=Math.floor(CW*s)+'px';cvs.style.height=Math.floor(CVH*s)+'px';}
function boot(){
  cvs=document.getElementById('game');cvs.width=CW;cvs.height=CVH;ctx=cvs.getContext('2d');ctx.imageSmoothingEnabled=false;
  bakeSprites();loadSave();resize();
  addEventListener('resize',resize);
  addEventListener('keydown',onKeyDown);
  addEventListener('keyup',e=>{keys.delete(e.code);});
  addEventListener('blur',()=>keys.clear());
  addEventListener('paste',e=>{if(scene==='join'&&Net.status!=='connecting'){const t=((e.clipboardData||window.clipboardData).getData('text')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);if(t){joinCode=t;Net.status='idle';Net.err='';}}});
  cvs.addEventListener('mousemove',onMouseMove);cvs.addEventListener('mousedown',onMouseDown);
  let last=performance.now(),acc=0;
  const STEP=1000/60;
  function frame(now){
    let dt=now-last;last=now;if(dt>100)dt=100;acc+=dt;
    let n=0;while(acc>=STEP&&n<6){update();acc-=STEP;n++;}
    draw();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

window.addEventListener('load',boot);
</script></body></html>
