<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RJ's Rowdy Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f241a;--glass:rgba(11,26,19,.68);--glass-hi:rgba(11,26,19,.82);--line:rgba(255,255,255,.09);--txt:#f3f7ef;--mut:#9fb8a9;--gold:#ffd23f;--gold-d:#c99a12;--red:#ff5a63;--green:#5bd16a;--r:16px;--disp:"Lilita One","Arial Black",Impact,sans-serif;--body:"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1f17;font-family:var(--body);color:var(--txt);user-select:none;-webkit-user-select:none}
#view,#view canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
kbd{font-family:var(--body);font-weight:900;font-size:12px;line-height:1;background:var(--gold);color:var(--ink);border-radius:6px;padding:4px 7px;display:inline-block;box-shadow:0 2px 0 var(--gold-d)}
kbd.w{background:#fff;box-shadow:0 2px 0 #9bb3a3}
.glass{background:var(--glass);backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 0 0 1px var(--line)}
/* buzz overlays */
#fx{position:fixed;inset:0;pointer-events:none;transition:opacity .8s;opacity:0}
#fx.high{opacity:1;background:radial-gradient(ellipse at center,rgba(120,255,140,0) 50%,rgba(60,160,70,.3) 100%)}
#fx.drunk{opacity:1;background:radial-gradient(ellipse at center,rgba(255,210,80,0) 55%,rgba(255,170,40,.24) 100%)}
#fx.both{opacity:1;background:radial-gradient(ellipse at center,rgba(255,120,220,0) 50%,rgba(200,90,255,.28) 100%)}
#fx.sus{opacity:1;box-shadow:inset 0 0 110px rgba(255,40,40,.5)}
/* buttons + inputs */
.btn{font-family:var(--disp);font-size:20px;letter-spacing:.4px;color:var(--ink);background:#fff;border:0;border-radius:14px;padding:12px 18px;box-shadow:0 4px 0 #9bb3a3;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;text-align:center}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9bb3a3}
.btn.go{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}.btn.go:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--txt);box-shadow:none;font-family:var(--body);font-weight:800;font-size:14px;padding:10px 12px}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.red{background:#ff6b74;box-shadow:0 4px 0 #a8323a;color:#fff}
.btn.sm{font-size:15px;padding:8px 12px;border-radius:10px;box-shadow:0 3px 0 #9bb3a3}
.btn:disabled{opacity:.4;cursor:default;transform:none;filter:none}
.btn small{display:block;font-family:var(--body);font-weight:800;font-size:12px;opacity:.7;letter-spacing:0;margin-top:2px}
.link{background:none;border:0;color:var(--mut);font:800 12px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:#fff}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;font:900 14px var(--body);color:#cfe3d6;background:transparent;border:0;border-radius:9px;padding:8px 6px;cursor:pointer;transition:background .15s}
.seg button:hover{background:rgba(255,255,255,.06)}.seg button.on{background:#fff;color:var(--ink)}
.seg.dis{opacity:.35;pointer-events:none}
.lbl{font-weight:900;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin:16px 0 7px}
input[type=text]{width:100%;font:800 17px var(--body);padding:11px 13px;border-radius:12px;border:2px solid transparent;background:rgba(0,0,0,.28);color:#fff;outline:none}
input[type=text]:focus{border-color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
/* star badge */
.rjstar{width:74px;height:74px;flex:0 0 74px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
/* ---------- menu ---------- */
#menu{position:fixed;left:40px;top:50%;transform:translateY(-50%);width:400px;max-height:calc(100vh - 40px);overflow:auto;padding:24px;scrollbar-width:thin}
.title{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.title .big{font-family:var(--disp);font-size:52px;line-height:.86;color:#fff;text-shadow:0 4px 0 var(--ink)}
.title .big em{font-style:normal;color:var(--gold);display:block}
.tag{color:#cfe3d6;font-weight:700;font-size:15px;line-height:1.4;margin:4px 0 4px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.row{display:flex;gap:10px}.row>*{flex:1}
.big2{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px}.big2 .ic{font-size:26px;width:34px;text-align:center}
.small{font-size:13px;color:var(--mut);font-weight:700;line-height:1.5}
.head{display:flex;align-items:center;gap:10px;margin-bottom:4px}.head h3{font-family:var(--disp);font-weight:400;font-size:30px}
.back{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:#fff;font:900 20px var(--body);cursor:pointer}.back:hover{background:rgba(255,255,255,.15)}
.cards{display:flex;gap:10px}
.mcard{flex:1;border-radius:14px;padding:12px;background:rgba(0,0,0,.25);cursor:pointer;border:2px solid transparent;transition:border-color .15s,background .15s;color:var(--txt);text-align:left;font-family:var(--body)}
.mcard:hover{background:rgba(0,0,0,.35)}.mcard.on{border-color:var(--gold);background:rgba(255,210,63,.1)}
.mcard b{display:block;font-family:var(--disp);font-weight:400;font-size:21px}.mcard span{font-size:12px;color:var(--mut);font-weight:700}
.code{font-family:var(--disp);font-size:56px;letter-spacing:10px;color:var(--gold);text-align:center;padding:4px 0 0;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:12px;padding:9px 11px;font-weight:800;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.tagp{font-size:10px;font-weight:900;letter-spacing:1px;color:var(--ink);background:var(--mut);border-radius:6px;padding:2px 6px}
.prow .x{margin-left:auto;cursor:pointer;color:#ff8a92;font-weight:900;font-size:13px}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw b{width:28px;height:28px;border-radius:9px;cursor:pointer;border:3px solid transparent;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.25)}
.sw b.on{border-color:var(--gold)}
.ctl{display:grid;grid-template-columns:118px 1fr;gap:9px 12px;font-weight:700;font-size:14px;color:#dbeae0;align-items:start}
.ctl .k{display:flex;gap:4px;flex-wrap:wrap}
.join{display:flex;gap:8px}.join input{text-transform:uppercase;letter-spacing:6px;font-size:22px;text-align:center}.join .btn{flex:0 0 auto}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-weight:800}
#hHole{position:absolute;left:16px;top:16px;padding:12px 14px;min-width:236px}
.hc-top{display:flex;align-items:center;gap:11px}
.hc-no{font-family:var(--disp);font-size:34px;line-height:1;width:44px;height:44px;border-radius:12px;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.hc-t{font-size:11px;letter-spacing:1.4px;color:var(--mut);font-weight:900}.hc-n{font-family:var(--disp);font-size:20px;line-height:1.1}
.hc-st{display:flex;gap:16px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.hc-st div{font-size:10px;letter-spacing:1.2px;color:var(--mut);font-weight:900;text-transform:uppercase}
.hc-st b{display:block;font-family:var(--disp);font-weight:400;font-size:21px;letter-spacing:0;color:#fff;text-transform:none;line-height:1.15}
.hc-st b.s{font-family:var(--body);font-weight:900;font-size:14px;padding-top:4px}
.hc-st .pen{color:var(--red);font-size:14px}
.wind i{display:inline-block;width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0,100% 60%,64% 60%,64% 100%,36% 100%,36% 60%,0 60%);vertical-align:-1px;margin-right:4px}
#hBoard{position:absolute;right:16px;top:16px;padding:8px;min-width:210px}
#hBoard .r{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 8px;border-radius:9px}
#hBoard .r .n{color:var(--mut);width:14px;font-size:12px}#hBoard .r .s{margin-left:auto;font-family:var(--disp);font-size:17px;font-weight:400;min-width:28px;text-align:right}
#hBoard .r .c{color:var(--mut);font-size:12px}
#hBoard .r.me{background:rgba(255,210,63,.13)}#hBoard .r.me .s{color:var(--gold)}#hBoard .r.dn{opacity:.6}
#hTimer{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-family:var(--disp);font-size:20px;color:#fff;background:rgba(232,50,58,.92);padding:7px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#hBanner{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%) scale(.92);font-family:var(--disp);font-size:68px;color:#fff;text-shadow:0 5px 0 var(--ink),0 12px 30px rgba(0,0,0,.35);white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;text-align:center}
#hBanner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#hBanner small{display:block;font-family:var(--body);font-weight:900;font-size:19px;color:var(--gold);text-shadow:0 2px 0 var(--ink);margin-top:4px}
#hToasts{position:absolute;left:50%;top:68px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{background:var(--glass-hi);padding:8px 14px;border-radius:12px;font-size:14px;animation:tin .25s ease-out;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#hBottom{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#hPrompt{font-size:16px;padding:9px 16px 9px 10px;white-space:nowrap;display:flex;align-items:center;gap:10px}
#hPrompt span{display:flex;align-items:center;gap:8px}#hPrompt span+span{padding-left:10px;border-left:1px solid var(--line)}
#hSub{font-size:13px;color:#e4efe7;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
#hSwing{pointer-events:auto;padding:12px 14px;width:min(640px,92vw)}
.sw-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
#hClubs{display:flex;gap:5px}#hClubs div{background:rgba(0,0,0,.25);border-radius:9px;padding:6px 10px;font-size:13px;color:#cfe3d6;cursor:pointer}#hClubs div i{font-style:normal;opacity:.55;font-size:11px;margin-left:4px}#hClubs div.on{background:#fff;color:var(--ink)}
#pwrInfo{font-size:13px;color:#dbeae0;text-align:right;flex:1}#pwrInfo b{color:var(--gold)}#pwrInfo .bad{color:var(--red)}
.sw-mid{display:flex;align-items:stretch;gap:12px}
#pwrBar{position:relative;flex:1;height:46px;border-radius:13px;background:rgba(0,0,0,.42);cursor:pointer;touch-action:none;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
#pwrFill{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#3fae4a,#9bd24a 45%,#ffd23f 75%,#ff6b4a);opacity:.9}
#pwrTicks{position:absolute;inset:0;display:flex;justify-content:space-evenly;pointer-events:none}#pwrTicks i{width:1px;background:rgba(255,255,255,.22)}
#pwrKnob{position:absolute;top:4px;bottom:4px;width:52px;margin-left:-26px;left:50%;background:#fff;border-radius:10px;box-shadow:0 3px 0 #9bb3a3,0 0 0 3px rgba(11,26,19,.55);display:flex;align-items:center;justify-content:center;pointer-events:none}
#pwrKnob span{font-family:var(--disp);font-size:20px;color:var(--ink)}
#swingBtn{font-size:22px;padding:6px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}#swingBtn kbd{background:rgba(15,36,26,.16);color:var(--ink);box-shadow:none;font-size:10px;padding:2px 6px}
.sw-help{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--mut)}
#hBuff{position:absolute;left:16px;bottom:16px;padding:10px 12px;min-width:190px}
#hBuff .ln{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}#hBuff .ln .k{width:38px;color:var(--mut);font-weight:900;letter-spacing:.5px}
.pips{display:flex;gap:3px}.pips i{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.14)}.pips i.on{background:var(--gold)}
.inv{display:flex;gap:6px;margin-top:7px;align-items:center}.inv div{width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--green)}
#hSus{margin-top:6px;color:var(--red);font-family:var(--disp);font-weight:400;font-size:15px;animation:pulse .5s infinite alternate}
@keyframes pulse{to{opacity:.45}}
#hBR{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#hMap{border-radius:14px;background:rgba(11,26,19,.6);box-shadow:0 8px 24px rgba(0,0,0,.22),inset 0 0 0 1px var(--line);display:block}
#povBtn{pointer-events:auto;font:900 12px var(--body);color:var(--txt);background:var(--glass-hi);border:0;border-radius:10px;padding:7px 10px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}#povBtn:hover{background:rgba(30,60,44,.9)}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#intro{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center}
#intro .h{font-family:var(--disp);font-size:26px;color:var(--gold);text-shadow:0 3px 0 var(--ink);letter-spacing:1px}
#intro .n{font-family:var(--disp);font-size:68px;line-height:1;text-shadow:0 5px 0 var(--ink)}
#intro .p{display:inline-flex;gap:14px;font-weight:900;font-size:16px;margin-top:12px;background:var(--glass-hi);padding:8px 16px;border-radius:12px}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,16,11,.5)}
.sheet{background:#f4f8ef;color:var(--ink);border-radius:20px;padding:20px 22px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.sheet h2{font-family:var(--disp);font-weight:400;font-size:30px;margin-bottom:12px;display:flex;gap:14px;align-items:baseline}.sheet h2 small{font-family:var(--body);font-size:14px;font-weight:800;color:#5b7a66}
table.sc{border-collapse:separate;border-spacing:0;font-weight:800;font-size:14px}
table.sc td,table.sc th{padding:6px 7px;text-align:center;min-width:30px;border-bottom:1px solid #dbe8d6}
table.sc th{font-size:11px;color:#5b7a66;letter-spacing:.5px}table.sc td.nm{text-align:left;min-width:130px;white-space:nowrap}
table.sc tr.par td{color:#6d8a76;font-size:12px}
table.sc td.tot{font-family:var(--disp);font-weight:400;font-size:17px;background:#e7f0e2}
.b2,.b1,.bo,.bo2{border-radius:8px}.b2{background:#ffe27a}.b1{background:#c8efc0}.bo{background:#ffe0d9}.bo2{background:#ffc3b8}.cop{color:#c8202e}
#final .sheet{text-align:center;min-width:420px}
.pod{display:flex;flex-direction:column;gap:8px;margin:12px 0 16px}
.pod div{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:11px 14px;font-weight:900;font-size:17px;box-shadow:0 0 0 1px #dbe8d6}
.pod div.w{background:#fff3c2;box-shadow:0 0 0 2px #e9c446}.pod div .s{margin-left:auto;font-family:var(--disp);font-weight:400;font-size:22px}
.awards{font-weight:800;font-size:14px;color:#46614f;margin-bottom:14px;line-height:1.6}
#pause .glass,#msg .glass{width:390px;padding:22px}
#msg .glass{text-align:center}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1d4a33,#0d1f17 70%);gap:12px;z-index:50}
#loading .t{font-family:var(--disp);font-size:44px;text-shadow:0 4px 0 var(--ink)}#loading small{font-size:14px;color:var(--mut);font-weight:700}
@media (max-width:760px){#menu{left:12px;right:12px;width:auto}.title .big{font-size:42px}#hBoard{display:none}}
@media (max-height:640px){#hMap{width:140px!important}}
</style>
</head>
<body>
<div id="view"></div>
<div id="fx"></div>
<div id="loading"><svg class="rjstar" style="width:96px;height:96px" viewBox="0 0 100 100"><polygon points="50,3 61,36 96,36 68,57 79,92 50,71 21,92 32,57 4,36 39,36" fill="#ffd23f" stroke="#0f241a" stroke-width="4" stroke-linejoin="round"/><text x="50" y="59" text-anchor="middle" font-family="Lilita One, Arial Black, sans-serif" font-size="19" textLength="34" lengthAdjust="spacingAndGlyphs" fill="#0f241a">RJ's</text></svg><div class="t">Rowdy Links</div><small id="loadMsg">Loading the course…</small></div>
<div id="hud" class="hidden">
  <div id="hHole" class="glass"></div>
  <div id="hBoard" class="glass"></div>
  <div id="hTimer" class="hidden"></div>
  <div id="intro" class="hidden"></div>
  <div id="hBanner"></div>
  <div id="hToasts"></div>
  <div id="hBottom">
    <div id="hPrompt" class="glass hidden"></div>
    <div id="hSub"></div>
    <div id="hSwing" class="glass hidden">
      <div class="sw-top"><div id="hClubs"></div><div id="pwrInfo"></div></div>
      <div class="sw-mid"><div id="pwrBar"><div id="pwrFill"></div><div id="pwrTicks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div id="pwrKnob"><span id="pwrPct">50</span></div></div><button class="btn go" id="swingBtn">Swing<kbd>SPACE</kbd></button></div>
      <div class="sw-help"><span id="swHelp"></span><button class="link" id="awayBtn">Step away (E)</button></div>
    </div>
  </div>
  <div id="hBuff" class="glass hidden"></div>
  <div id="hBR"><button id="povBtn">3rd person · V</button><canvas id="hMap" width="170" height="210"></canvas></div>
  <div id="cross" class="hidden"></div>
</div>
<div id="card" class="ov hidden"><div class="sheet" id="cardSheet"></div></div>
<div id="final" class="ov hidden"><div class="sheet" id="finalSheet"></div></div>
<div id="pause" class="ov hidden"><div class="glass" id="pausePanel"></div></div>
<div id="msg" class="ov hidden"><div class="glass"><div id="msgText" style="font-weight:800;font-size:16px;line-height:1.5"></div><div class="stack"><button class="btn go" id="msgOk">OK</button></div></div></div>
<div id="menu" class="glass hidden"></div>
<script>
'use strict';
/* =====================================================================
   RJ'S ROWDY LINKS  —  3D golf + mini golf with friends (single file)
   01 core     utils, tuning, settings
   02 world    surfaces, 30 golf holes, 30 mini golf holes, generators
   03 phys     ball physics, clubs, shot preview
   04 move     golf carts (Ghost Road driving model), characters, cop AI
   05 game     rules, scoring, bots, party items, golf police, host sim
   06 net      PeerJS room codes (host / join)
   07 audio    synthesized sound
   08 view     three.js scene, models, camera, effects
   09 ui       menus, HUD, input, main loop
   ===================================================================== */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dampAng = (a, b, k, dt) => a + angDiff(a, b) * (1 - Math.exp(-k * dt));
const hyp = Math.hypot;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function RNG(seed) {

  else if (sc === 'controls') h = controlsHTML().replace('<div class="head"><h3>Controls</h3></div>', head('Controls')) + '<div class="stack"><button class="btn go" data-act="back">Got it</button></div>';
  m.innerHTML = h;
  const vol = $('sVol'); if (vol) { vol.oninput = e => { S.vol = +e.target.value; audioVol(); saveS(); }; $('sMus').oninput = e => { S.music = +e.target.value; audioVol(); saveS(); }; $('sSens').oninput = e => { S.sens = +e.target.value; saveS(); }; }
  const nm = $('iName'); if (nm) nm.oninput = e => { S.name = e.target.value.trim().slice(0, 14) || 'Golfer'; saveS(); };
  const cd = $('iCode'); if (cd) { cd.oninput = e => { UI.joinCode = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); e.target.value = UI.joinCode; }; cd.onkeydown = e => { if (e.key === 'Enter') menuAct('dojoin'); }; }
}
function menuAct(a, el) {
  SFX.ui();
  if (a === 'quick') menuShow('quick');
  else if (a === 'solo') { UI.nb = 0; startLocal(false); }
  else if (a === 'bots') { UI.nb = Math.max(1, UI.nb); menuShow('quick'); }
  else if (a === 'startquick' || a === 'startbots') { S.bots = UI.nb; S.botLvl = UI.botLvl; saveS(); startLocal(UI.nb > 0); }
  else if (a === 'back') { if (UI.screen === 'host') { NET.leave(); menuShow('online'); } else menuShow('main'); }
  else if (a === 'online' || a === 'look' || a === 'settings' || a === 'controls') menuShow(a);
  else if (a === 'join') menuShow('online');
  else if (a === 'host') { UI.lobby = { players: [{ id: 'host', name: S.name, look: S.look, bot: false }], mode: S.mode, holes: S.holes, party: S.party }; menuShow('host'); NET.host(UI.lobby, () => { if (UI.screen === 'host') menuShow('host'); }, err => { NET.reset(); menuShow('online'); showMsg(err); }); }
  else if (a === 'copy') { try { navigator.clipboard.writeText(NET.code); toastMenu('Copied ' + NET.code); } catch (e) { } }
  else if (a === 'addbot') { const L = UI.lobby; if (L.players.length < TUNE.maxPlayers) { const used = L.players.map(p => p.name); const nm = BOT_NAMES.find(n => !used.includes(n)) || 'Bot'; L.players.push({ id: 'b' + Date.now().toString(36), name: nm, look: randomLook(), bot: true, lvl: UI.botLvl }); NET.sendLobby(); menuShow('host'); } }
  else if (a === 'rmbot') { UI.lobby.players.splice(+el.dataset.i, 1); NET.sendLobby(); menuShow('host'); }
  else if (a === 'hoststart') { const L = UI.lobby; const cfg = { mode: L.mode, holes: L.holes, seed: (Math.random() * 1e9) >>> 0, roster: L.players.map(p => ({ id: p.id, name: p.name, look: p.look, bot: p.bot, lvl: p.lvl })), me: 'host', role: 'host', party: L.party }; NET.startGame(cfg); beginGame(cfg); }
  else if (a === 'hostleave' || a === 'joinleave') { NET.leave(); menuShow('online'); }
  else if (a === 'dojoin') { if (UI.joinCode.length < 5) { showMsg('Room codes are 5 letters or numbers.'); return; } menuShow('joining'); NET.join(UI.joinCode, { name: S.name, look: S.look }, () => { if (UI.screen === 'joining') menuShow('joinwait'); }, err => { NET.reset(); menuShow('online'); showMsg(err); }); }
  else if (a === 'rndlook') { S.look = randomLook(); saveS(); menuChars(); menuShow('look'); }
  else if (a === 'lookdone') { saveS(); menuShow('main'); }
}
function toastMenu(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; d.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%)'; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function bindMenu() {
  $('menu').addEventListener('click', e => {
    const sb = e.target.closest('[data-seg] button'); if (sb) { const k = sb.parentNode.dataset.seg, v = sb.dataset.v; SFX.ui(); if (k === 'view') S.view = v;
      if (k === 'mode') S.mode = v; else if (k === 'holes') S.holes = +v; else if (k === 'nb') UI.nb = +v; else if (k === 'botLvl') UI.botLvl = +v;
      else if (k === 'lmode') { UI.lobby.mode = v; NET.sendLobby(); } else if (k === 'lholes') { UI.lobby.holes = +v; NET.sendLobby(); }
      else if (k === 'party') S.party = v === '1'; else if (k === 'shadows') S.shadows = v === '1'; else if (k === 'quality') S.quality = v;
      else if (k === 'legs' || k === 'hat') { S.look[k] = v; menuChars(); } else if (k === 'shades') { S.look.shades = v === '1'; menuChars(); }
      saveS(); menuShow(UI.screen); return; }
    const lk = e.target.closest('[data-look]'); if (lk) { S.look[lk.dataset.look] = lk.dataset.v; saveS(); SFX.ui(); menuChars(); menuShow('look'); return; }
    const b = e.target.closest('[data-act]'); if (b && !b.disabled) menuAct(b.dataset.act, b);
  });
}
/* ---------- menu backdrop ---------- */
function menuEnter() {
  STATE = 'menu'; GS = null; const idx = RND.int(0, GOLF_HOLES.length - 1); W = buildGolf(idx, (Math.random() * 1e9) >>> 0); W.seed = idx + 7;
  buildHoleScene(W, idx + 1); clearEnts(); hidePath(); menuChars(); menuShow('main'); $('menu').classList.remove('hidden'); $('hud').classList.add('hidden'); if (AU.ready) musicStart(); CAM.init = false; UI.mt = 0;
}
function menuChars() {
  if (V.menuGroup) V.ents.remove(V.menuGroup); const g = V.menuGroup = new THREE.Group(); const t = W.tees[2];
  const ch = V.menuChar = makeCharacter(S.look); ch.position.set(t.x, groundH(W, t.x, t.z), t.z); ch.rotation.y = W.teeYaw + Math.PI * .8; g.add(ch);
  const s = W.cartSpots[1]; const cart = makeCart('#f4f4f4'); cart.position.set(s.x, groundH(W, s.x, s.z), s.z); cart.rotation.y = s.yaw; g.add(cart);
  const b = new THREE.Mesh(new THREE.SphereGeometry(W.ballR, 14, 10), new THREE.MeshPhongMaterial({ color: '#fff', shininess: 70 })); b.position.set(t.x + Math.sin(W.teeYaw) * .62, groundH(W, t.x, t.z) + W.ballR, t.z + Math.cos(W.teeYaw) * .62); g.add(b);
  V.ents.add(g);
}
function menuUpdate(dt) {
  V.t += dt; UI.mt = (UI.mt || 0) + dt; if (!V.menuChar) return; poseChar(V.menuChar, 'idle', 0, 0, dt, { club: 'driver' });
  const c = V.menuChar.position, look = UI.screen === 'look'; const a = look ? V.menuChar.rotation.y + .25 : W.teeYaw + Math.PI + Math.sin(UI.mt * .07) * 1.1, R = look ? 3.4 : 9;
  const px = c.x + Math.sin(a) * R, pz = c.z + Math.cos(a) * R, py = c.y + (look ? 1.4 : 3.2); const dx = c.x - px, dz = c.z - pz, dl = Math.hypot(dx, dz); const lx = c.x + (dz / dl) * (look ? 1.1 : 3.2), lz = c.z + (-dx / dl) * (look ? 1.1 : 3.2);
  if (!CAM.init) { CAM.p = { x: px, y: py, z: pz }; CAM.l = { x: lx, y: c.y + 1, z: lz }; CAM.init = true; }
  const f = 1 - Math.exp(-2.5 * dt); CAM.p.x += (px - CAM.p.x) * f; CAM.p.y += (py - CAM.p.y) * f; CAM.p.z += (pz - CAM.p.z) * f; CAM.l.x += (lx - CAM.l.x) * f; CAM.l.y += (c.y + (look ? .95 : 1.2) - CAM.l.y) * f; CAM.l.z += (lz - CAM.l.z) * f;
  V.cam.position.set(CAM.p.x, CAM.p.y, CAM.p.z); V.cam.lookAt(CAM.l.x, CAM.l.y, CAM.l.z); V.sky.position.copy(V.cam.position);
  placeSun(c.x, c.y, c.z);
  if (V.flag) { const P = V.flag.mesh.geometry.attributes.position, B = V.flag.base; for (let i = 0; i < P.count; i++) { const x = B[i * 3]; P.setZ(i, Math.sin(x * 9 - V.t * 4) * .06 * (x / V.flag.w)); } P.needsUpdate = true; }
  for (const w of V.water) if (w.material.map) w.material.map.offset.set(V.t * .012, V.t * .008); for (const cl of V.clouds) cl.position.x += cl.userData.v * dt;
}
/* ---------- main loop ---------- */
function ambience(dt) {
  LOC.birdT -= dt; if (LOC.birdT <= 0) { LOC.birdT = 4 + Math.random() * 7; if (!W.T.night && W.theme !== 'winter') birds(); }
  let near = 1e9; for (const k of GS.cops) { if (k.mode !== 'chase') continue; const c = GS.carts[k.ci]; if (c && CAM.p) near = Math.min(near, Math.hypot(c.x - CAM.p.x, c.z - CAM.p.z)); }
  if (near < 70) loopSet('siren', true, 0, 0.012 + 0.05 * (1 - near / 70)); else loopSet('siren', false);
}
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame); const dt = Math.min(.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  try {
    if (STATE === 'menu') menuUpdate(dt);
    else if (STATE === 'game' && GS) {
      if (GS.role === 'client') clientTick(dt);
      localUpdate(dt);
      if (GS.role !== 'client') hostTick(dt);
      if (GS && GS.role === 'host') NET.flushEvents(GS.events);
      if (GS) { const evs = GS.events; GS.events = []; for (const e of evs) handleEvent(e); }
      if (GS && GS.role !== 'solo') NET.tick(dt);
      if (GS && W && LOC.built !== -1) { viewUpdate(dt); camUpdate(dt); hudFrame(dt); ambience(dt); }
    }
  } catch (err) { console.error(err); }
  V.r.render(V.scene, V.cam);
}
async function boot() {
  try { await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'https://unpkg.com/three@0.128.0/build/three.min.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js']); }
  catch (e) { $('loadMsg').textContent = 'Could not load the 3D engine. Check your internet connection and refresh.'; return; }
  loadScript(['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js']).catch(() => { });
  try { viewInit($('view')); } catch (e) { $('loadMsg').textContent = 'Your browser could not start 3D graphics (WebGL).'; return; }
  bindInput(); bindMenu(); addEventListener('pointerdown', () => { audioInit(); if (STATE === 'menu') musicStart(); });
  addEventListener('keydown', () => { if (STATE === 'menu' && AU.ready) musicStart(); });
  menuEnter(); $('loading').classList.add('hidden'); requestAnimationFrame(t => { lastT = t; frame(t); });
}
boot();
</script>
