const TC=new Map();
function textCv(s,c){s=String(s);const k=c+'|'+s;let t=TC.get(k);if(t)return t;if(TC.size>600)TC.clear();
 t=mkC(Math.max(1,s.length*6-1),7);const g=t.getContext('2d');g.fillStyle=c;
 for(let i=0;i<s.length;i++){const gl=glyph(s[i]);for(let x=0;x<5;x++)for(let y=0;y<7;y++)if(gl[x]>>y&1)g.fillRect(i*6+x,y,1,1);}
 TC.set(k,t);return t;}
function txt(s,x,y,c='#fff',al=0,sc=1,shd='#000'){const t=textCv(s,c),w=t.width*sc;const dx=Math.round(al===1?x-w/2:al===2?x-w:x);

function bigCv(s,sc,pn='gold'){const k=s+'|'+sc+'|'+pn;let c=BT.get(k);if(c)return c;const b=textCv(s,'#fff'),bw=b.width*sc,bh=7*sc;
 c=mkC(bw+4,bh+5);const g=c.getContext('2d');g.imageSmoothingEnabled=false;const blk=textCv(s,'#000');
 for(let dy=-1;dy<=3;dy++)for(let dx=-1;dx<=1;dx++)g.drawImage(blk,2+dx,2+dy,bw,bh);
 const f=mkC(bw+4,bh+5),fg=f.getContext('2d');fg.imageSmoothingEnabled=false;fg.drawImage(b,2,2,bw,bh);fg.globalCompositeOperation='source-in';
 const P=MPAL[pn],gr=fg.createLinearGradient(0,2,0,2+bh);[0,.38,.62,.86,1].forEach((o,i)=>gr.addColorStop(o,P[i]));fg.fillStyle=gr;fg.fillRect(0,0,bw+4,bh+5);
 g.drawImage(f,0,0);BT.set(k,c);return c;}

/* ============ AUDIO ============ */
const AU={c:null};
function auInit(){if(AU.c)return;try{const c=new(window.AudioContext||window.webkitAudioContext)();AU.c=c;AU.m=c.createGain();AU.m.gain.value=.55;AU.m.connect(c.destination);
 AU.s=c.createGain();AU.s.connect(AU.m);AU.mu=c.createGain();AU.mu.gain.value=.28;AU.mu.connect(AU.m);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=nb;}catch(e){}}
function tone(f,d,ty,v,f2,dl,dst){const c=AU.c;if(!c)return;const t=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=ty||'square';
 o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(dst||AU.s);o.start(t);o.stop(t+d+.03);}
function noise(d,v,ff,ty,f2,dl,dst){const c=AU.c;if(!c)return;const t=c.currentTime+(dl||0),s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
 s.buffer=AU.nb;fl.type=ty||'lowpass';fl.frequency.setValueAtTime(ff||1000,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(dst||AU.s);s.start(t,Math.random()*.5);s.stop(t+d+.03);}
function sfx(k){if(!OPT.sfx||!AU.c)return;switch(k){
 case'hit':noise(.12,.55,1000,'lowpass',200);tone(130,.14,'sine',.6,45);break;
 case'hit2':noise(.2,.65,800,'lowpass',150);tone(95,.22,'sine',.75,35);tone(240,.05,'square',.15,80);break;
 case'blk':tone(1500,.05,'square',.1,700);noise(.06,.25,3000,'highpass');break;
 case'whoosh':noise(.13,.16,500,'bandpass',2600);break;
 case'jump':tone(180,.12,'triangle',.15,380);break;
 case'land':noise(.08,.25,300);break;
 case'thud':noise(.28,.6,260,'lowpass',60);tone(70,.3,'sine',.55,30);break;
 case'proj':tone(300,.25,'sawtooth',.11,900);noise(.2,.1,1500,'bandpass',3000);break;
 case'zap':tone(900,.35,'sawtooth',.13,110);noise(.3,.2,4000,'highpass');break;
 case'boom':noise(.7,.75,700,'lowpass',40);tone(60,.6,'sine',.7,25);break;
 case'pop':tone(600,.08,'square',.2,1600);noise(.12,.35,2000,'highpass');break;
 case'freeze':tone(1800,.4,'triangle',.12,2600);tone(2400,.4,'sine',.08,1200,.05);break;
 case'move':tone(660,.04,'square',.07);break;
 case'sel':tone(440,.08,'square',.12,880);tone(880,.12,'square',.1,1320,.06);break;
 case'ko':noise(.5,.6,500,'lowpass',60);tone(110,.5,'sawtooth',.2,40);break;
 case'wah':[300,280,260,200].forEach((f,i)=>tone(f,.38,'sawtooth',.14,f*.93,i*.36));break;
 case'coin':tone(990,.07,'square',.1);tone(1320,.18,'square',.1,0,.07);break;
 case'suck':noise(.8,.4,200,'bandpass',4000);break;
}}
const TRK={menu:{bpm:84,b:[45,0,45,0,48,0,47,0,45,0,45,0,43,0,44,0],l:[69,0,0,72,0,71,0,0,69,0,0,67,0,68,0,0],d:'k...s...k.k.s...'},

 f1:{bpm:136,b:[38,38,50,38,41,41,53,41,36,36,48,36,43,43,41,40],l:[62,0,65,62,0,69,0,67,0,65,64,0,62,0,60,0],d:'k.hks.h.k.hks.hh'},
 f2:{bpm:120,b:[33,33,45,33,36,36,48,35,33,33,45,33,40,40,38,36],l:[69,72,0,76,0,74,72,0,69,0,67,69,0,64,0,0],d:'k..hs..hk.k.s.hh'}};
const MUS={tr:null,st:0,nx:0};
function mf(m){return 440*Math.pow(2,(m-69)/12);}
function musPlay(n){MUS.tr=TRK[n]||null;MUS.st=0;if(AU.c)MUS.nx=AU.c.currentTime+.05;}
setInterval(()=>{const c=AU.c,T=MUS.tr;if(!c||!T||!OPT.music)return;const sp=60/T.bpm/4;
 if(MUS.nx<c.currentTime-.1)MUS.nx=c.currentTime+.05;while(MUS.nx<c.currentTime+.15){const i=MUS.st%16,t=MUS.nx-c.currentTime;const b=T.b[i],l=T.l[i],dr=T.d[i];
  if(b)tone(mf(b),sp*1.8,'sawtooth',.16,0,t,AU.mu);if(l&&MUS.st%32<16)tone(mf(l),sp*2.5,'square',.05,0,t,AU.mu);
  if(dr==='k')tone(140,.18,'sine',.5,40,t,AU.mu);if(dr==='s')noise(.14,.25,1800,'bandpass',900,t,AU.mu);if(dr==='h')noise(.04,.1,7000,'highpass',0,t,AU.mu);
  MUS.st++;MUS.nx+=sp;}},40);
const VOX={it:null,en:null};
function pickV(){try{const v=speechSynthesis.getVoices();VOX.it=v.find(x=>/^it/i.test(x.lang))||null;VOX.en=v.find(x=>/^en/i.test(x.lang)&&/male|david|daniel|fred|alex|george/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickV();speechSynthesis.onvoiceschanged=pickV;}
function say(s,it){if(!OPT.voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(it?s.toLowerCase():s);
 const v=it?VOX.it:VOX.en;if(v)u.voice=v;u.lang=it?'it-IT':'en-US';u.pitch=it?1.15:.3;u.rate=it?1.05:.82;speechSynthesis.speak(u);}catch(e){}}

/* ============ INPUT ============ */
const U=1,DN=2,LF=4,RT=8,LP=16,HP=32,LK=64,HK=128,BL=256;
const BTN={LP,HP,LK,HK};
const K={};let KP=[],KU=[],MX=-99,MY=-99,MMOVED=0,MGATE=0;
addEventListener('keydown',e=>{auInit();if(!K[e.code])KP.push(e);K[e.code]=1;if(/Arrow|Space|Tab|Slash|Quote|Backspace|Backquote/.test(e.code))e.preventDefault();});
addEventListener('keyup',e=>{K[e.code]=0;KU.push(e.code);});
addEventListener('blur',()=>{for(const k in K)K[k]=0;});
function mpos(e){const r=cv.getBoundingClientRect();if(r.width){MX=(e.clientX-r.left)/r.width*SW;MY=(e.clientY-r.top)/r.height*SH;}}
const MBIT=[1,4,2,8,16];
addEventListener('mousedown',e=>{auInit();try{window.focus();}catch(_){}mpos(e);MMOVED=1;const c='Mouse'+e.button;if(!K[c])KP.push({code:c,shiftKey:e.shiftKey,mouse:1,button:e.button});K[c]=1;e.preventDefault();});
addEventListener('mouseup',e=>{const c='Mouse'+e.button;K[c]=0;KU.push(c);if(e.button>2)e.preventDefault();});
addEventListener('mousemove',e=>{mpos(e);MMOVED=1;for(let b=0;b<5;b++)if(!(e.buttons&MBIT[b]))K['Mouse'+b]=0;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('auxclick',e=>e.preventDefault());
const mouseDown=()=>!!(K.Mouse0||K.Mouse1||K.Mouse2||K.Mouse3||K.Mouse4);
const BACT=['U','D','L','R','LP','HP','LK','HK','BL'];
const BNAME={U:'UP / JUMP',D:'DOWN / DUCK',L:'LEFT',R:'RIGHT',LP:'LIGHT PUNCH',HP:'HEAVY PUNCH',LK:'LIGHT KICK',HK:'HEAVY KICK',BL:'BLOCK'};
const BDEF={p1:{U:['KeyW',null],D:['KeyS',null],L:['KeyA',null],R:['KeyD',null],LP:['Mouse0',null],HP:['Shift+Mouse0','KeyQ'],LK:['Mouse2',null],HK:['Shift+Mouse2','KeyE'],BL:['Space','Mouse1']},
 p2:{U:['ArrowUp',null],D:['ArrowDown',null],L:['ArrowLeft',null],R:['ArrowRight',null],LP:['KeyK','Numpad4'],HP:['KeyI','Numpad5'],LK:['KeyL','Numpad1'],HK:['KeyO','Numpad2'],BL:['KeyP','Numpad0']}};
const BINDS=JSON.parse(JSON.stringify(BDEF)),SHIFTED={p1:new Set(),p2:new Set()};
function bindsChanged(){for(const s in BINDS){SHIFTED[s]=new Set();for(const a of BACT)for(const b of BINDS[s][a])if(b&&b.startsWith('Shift+'))SHIFTED[s].add(b.slice(6));}}
bindsChanged();
const BMAP={U,D:DN,L:LF,R:RT,LP,HP,LK,HK,BL};
function bindOn(b,s,sh){if(!b)return false;if(MGATE&&b.includes('Mouse'))return false;if(b.startsWith('Shift+'))return sh&&!!K[b.slice(6)];return!!K[b]&&!(sh&&SHIFTED[s].has(b));}
const KN={Space:'SPACE',ShiftLeft:'L SHIFT',ShiftRight:'R SHIFT',ControlLeft:'L CTRL',ControlRight:'R CTRL',AltLeft:'L ALT',AltRight:'R ALT',Enter:'ENTER',NumpadEnter:'NUM ENTER',Backspace:'BKSP',Tab:'TAB',CapsLock:'CAPS',
 ArrowUp:'UP ARROW',ArrowDown:'DOWN ARROW',ArrowLeft:'LEFT ARROW',ArrowRight:'RIGHT ARROW',Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',Backslash:'\\',BracketLeft:'[',BracketRight:']',Minus:'-',Equal:'=',Backquote:'TILDE',
 Mouse0:'L-CLICK',Mouse1:'M-CLICK',Mouse2:'R-CLICK',Mouse3:'MOUSE 4',Mouse4:'MOUSE 5',NumpadAdd:'NUM +',NumpadSubtract:'NUM -',NumpadMultiply:'NUM *',NumpadDivide:'NUM /',NumpadDecimal:'NUM .',
 Delete:'DEL',Insert:'INS',Home:'HOME',End:'END',PageUp:'PG UP',PageDown:'PG DN',MetaLeft:'L META',MetaRight:'R META',ContextMenu:'MENU KEY'};
function keyName(b){if(!b)return'-';if(b.startsWith('Shift+'))return'SHIFT+'+keyName(b.slice(6));if(KN[b])return KN[b];return b.replace(/^Key/,'').replace(/^Digit/,'').replace(/^Numpad/,'NUM ').toUpperCase().slice(0,13);}
function bindName(s,a){const B=BINDS[s][a];return keyName(B[0]||B[1]);}
function padBits(i){const ps=navigator.getGamepads?navigator.getGamepads():[];const p=ps&&ps[i];if(!p)return 0;const b=n=>p.buttons[n]&&p.buttons[n].pressed;let v=0;
 const ax=p.axes[0]||0,ay=p.axes[1]||0;if(b(12)||ay<-.5)v|=U;if(b(13)||ay>.5)v|=DN;if(b(14)||ax<-.5)v|=LF;if(b(15)||ax>.5)v|=RT;
 if(b(2))v|=LP;if(b(3))v|=HP;if(b(0))v|=LK;if(b(1))v|=HK;if(b(4)||b(5)||b(6)||b(7))v|=BL;return v;}
function bits(s,pad){const S=BINDS[s],sh=!!(K.ShiftLeft||K.ShiftRight);let v=0;for(const a of BACT)if(bindOn(S[a][0],s,sh)||bindOn(S[a][1],s,sh))v|=BMAP[a];if(pad!=null)v|=padBits(pad);return v;}
let PADPREV=[0,0];
function padPress(){const out=[];for(let i=0;i<2;i++){const ps=navigator.getGamepads?navigator.getGamepads():[];const p=ps&&ps[i];if(!p){PADPREV[i]=0;continue;}
 let v=padBits(i);if(p.buttons[9]&&p.buttons[9].pressed)v|=512;if(p.buttons[8]&&p.buttons[8].pressed)v|=1024;const pr=v&~PADPREV[i];PADPREV[i]=v;out.push([i,pr]);}return out;}
/* ============ DIGITIZED SPRITE PAINTER ============ */
let DK=0;const HXC=new Map();
function hx(c){let v=HXC.get(c);if(v)return v;let s=c.slice(1);if(s.length===3)s=s.replace(/./g,'$&$&');const n=parseInt(s,16);v=[n>>16&255,n>>8&255,n&255];HXC.set(c,v);return v;}
function col(c,f=0){let[r,g,b]=hx(c);if(DK){r*=1+DK;g*=1+DK;b*=1+DK*.85;}if(f>0){r+=(255-r)*f;g+=(250-g)*f;b+=(236-b)*f;}else if(f<0){r*=1+f*1.06;g*=1+f;b*=1+f*.84;}return`rgb(${r|0},${g|0},${b|0})`;}
function limb(g,x1,y1,x2,y2,w1,w2,c){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||.001;let nx=-dy/L,ny=dx/L;if(nx*-.45+ny*-.9<0){nx=-nx;ny=-ny;}
 const mx=(x1+x2)/2,my=(y1+y2)/2,w=Math.max(w1,w2)/2,gr=g.createLinearGradient(mx+nx*w,my+ny*w,mx-nx*w,my-ny*w);
 gr.addColorStop(0,col(c,.42));gr.addColorStop(.3,col(c,.06));gr.addColorStop(.72,col(c,-.3));gr.addColorStop(1,col(c,-.62));g.fillStyle=gr;
 const a=Math.atan2(dy,dx);g.beginPath();g.arc(x1,y1,w1/2,a+PI/2,a+PI*1.5);g.arc(x2,y2,w2/2,a-PI/2,a+PI/2);g.closePath();g.fill();}
function ball(g,x,y,rx,ry,c,hi=.5){if(rx<=0||ry<=0)return;const m=Math.max(rx,ry),gr=g.createRadialGradient(x-rx*.35,y-ry*.4,m*.05,x,y,m*1.1);
 gr.addColorStop(0,col(c,hi));gr.addColorStop(.45,col(c,0));gr.addColorStop(.85,col(c,-.36));gr.addColorStop(1,col(c,-.58));g.fillStyle=gr;g.beginPath();g.ellipse(x,y,rx,ry,0,0,PI*2);g.fill();}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function slab(g,x,y,w,h,c,r=2){const gr=g.createLinearGradient(x,y,x+w,y+h*.5);gr.addColorStop(0,col(c,.4));gr.addColorStop(.35,col(c,.05));gr.addColorStop(.8,col(c,-.3));gr.addColorStop(1,col(c,-.52));g.fillStyle=gr;rr(g,x,y,w,h,Math.min(r,w/2,h/2));g.fill();}
function poly(g,p,c,hi=.35){let a=1e9,b=1e9,e=-1e9,f=-1e9;for(let i=0;i<p.length;i+=2){a=Math.min(a,p[i]);e=Math.max(e,p[i]);b=Math.min(b,p[i+1]);f=Math.max(f,p[i+1]);}
 const gr=g.createLinearGradient(a,b,e,f);gr.addColorStop(0,col(c,hi));gr.addColorStop(.5,col(c,0));gr.addColorStop(1,col(c,-.45));g.fillStyle=gr;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill();}
function ln(g,p,c,w){g.strokeStyle=col(c);g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.stroke();}
function dot(g,x,y,rx,ry,c){g.fillStyle=col(c);g.beginPath();g.ellipse(x,y,rx,ry,0,0,PI*2);g.fill();}
function glow(g,x,y,r,c1,c2){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,PI*2);g.fill();}

function poseOf(G,f){const fr=G.frame;switch(f.st){
 case'idle':return['st1','st2','st3','st2'][(fr>>3)%4];
 case'walk':{const k=(f.t>>3)%4;return'wk'+(f.wd>0?k+1:4-k);}
 case'crouch':case'pre':case'land':return'cr';case'block':return'bk';case'cblock':return'cbk';case'bs':return(f.ip&DN)?'cbk':'bk';
 case'jump':if(f.jd&&f.t>2&&f.t<44){const k=(f.t>>2)%4;return'tk'+(f.jd>0?k:3-k);}return'ju';
 case'atk':{const Mv=MV[f.mv];if(Mv.air)return Mv.p[1];if(f.t<Mv.su)return Mv.p[0];if(f.t<Mv.su+Mv.ac+(Mv.rc>>1))return Mv.p[1];return Mv.p[0];}
 case'hit':return f.crh?'hc':f.hsT>=18?'hl':'hh';
 case'air':return'kn';case'down':return'ly';case'getup':return f.t<7?'gu':'cr';
 case'thr':return f.t<12?'gb':'ts';case'held':case'frozen':return'hh';
 case'stun':case'dizzy':return(fr>>4)%2?'dz2':'dz1';

 case'sp':return spPose(f);case'fin':return finPoseW(G);case'victim':return finPoseV(G);}
 return'st1';}

 case'dash':if(f.roll)return'tk'+((t>>2)%4);if(t<4)return'ca1';if(!f.me)return s.low?'sl':/K/.test(s.b)?'hk2':'hp2';return'st1';
 case'spin':return t>=4&&t<4+s.f?'tp':'st1';case'rise':return f.me?'st1':'ri';case'dive':return f.dv?'jk':'ju';
 case'tele':return t<20?'ts':s.d&&t<28?'hk2':'st1';case'grab':return f.gs?(t<34?'gb':'ts'):(t<14?'gb':'st1');
 case'aoe':return t<20?'ts':'st1';case'flurry':return(t>>1)%2?'lp2':'lp1';case'counter':return f.cn?(t<f.cn+10?'hp2':'st1'):'bk';}

 if(G.ph==='finishit'){if(G.mw!==i)return 0;if(A.q.length)return A.q.shift();if(A.fw===null)A.fw=R()<.25+lv*.6;if(!FREE.has(me.st)||op.st!=='dizzy')return 0;const F=d.fin;
  if(A.fw){if(F.r==='close'&&dist>48)return fw;if(F.r==='far'&&dist<86)return bk;if(R()<.05){A.q=seqQ(me,F.in,F.b);if(R()<.3)A.fw=false;}return 0;}
  if(dist>34)return fw;return R()<.05?(DN|HP):0;}
 if(G.ph!=='fight'){A.q=[];A.fw=null;A.hold=0;A.w=0;return 0;}
 if(['hit','air','down','held','stun','frozen','getup'].includes(me.st)){A.q=[];A.w=0;A.hold=0;}
 if(A.q.length)return A.q.shift();
 if(A.hold>0){A.hold--;return A.hb;}
 if(!FREE.has(me.st))return 0;
 for(const p of G.pj){if(p.o===i||A.seen.has(p))continue;const tw=p.vx===0?Math.abs(p.x-me.x)<40:Math.sign(me.x-p.x)===Math.sign(p.vx);if(!tw)continue;const pd=Math.abs(me.x-p.x);if(p.vx!==0&&pd>60+lv*50)continue;A.seen.add(p);
  if(R()<.2+lv*.65){A.hb=BL|(p.ht==='low'?DN:0);A.hold=Math.min(60,Math.round(pd/Math.max(1,Math.abs(p.vx)))+10);return A.hb;}}
 const st0=G.frame-op.t,key=op.st==='atk'?'a'+st0:op.st==='sp'?'s'+st0:op.st==='jump'?'j'+st0:'';
 if(key&&key!==A.th&&dist<90){const early=op.st==='atk'?op.t<=MV[op.mv].su:op.st==='sp'?op.t<10:op.vy>-1.5;
  if(early){A.th=key;
   if(op.st==='jump'){if(dist<64&&R()<.1+lv*.55){A.q=Array(Math.max(0,3-Math.round(lv*3))).fill(0).concat([DN|HP,DN,0]);return A.q.shift();}}
   else if(R()<.12+lv*.62){const low=(op.st==='atk'&&MV[op.mv].ht==='low')||(op.st==='sp'&&CH[op.ci].sp[op.sp].low);A.hb=BL|(low?DN:0);A.hold=16+(R()*12|0);const dl=Math.round((1-lv)*4);if(dl>0)A.q=Array(dl).fill(0);return 0;}}}
 if(A.w>0){A.w--;return A.wb;}
 const ag=.3+lv*.6,r=R();
 if(op.st==='down'||op.st==='getup'){A.w=8;A.wb=dist>60?fw:0;return A.wb;}
 if(dist>115){

   {const lb=lab(p),lw2=lb.length*6+1;X.fillStyle='#000';X.fillRect(p?x+30-lw2:x,y,lw2,8);txt(lb,p?x+30:x+1,y+1,p?'#80a8ff':'#ff8080',p?2:0,1,null);}
   const ci=c,nm=CH[ci].n;if(p===0)txt(nm,4,195,lk?'#ffd040':'#ff9090');else txt(nm,252,205,lk?'#ffd040':'#90b0ff',2);}
  const hint=ar?'CLICK OR ENTER TO PICK     ESC: BACK':this.mode==='vs'?'1P: MOUSE OR WASD+SPACE   2P: ARROWS+K':(this.lock[this.me]>=0?(this.lock[1-this.me]>=0?'GET READY!':'WAITING FOR YOUR RIVAL...'):'CLICK OR ENTER TO PICK    ESC: LEAVE');
  txt(hint,128,215,'#a08060',1);}};

 tick(){if(!JOBS.length&&(this.t>=150||(this.mode!=='online'&&this.t>40&&okA())))startFight(this);},

  if(JOBS.length){const q=1-JOBS.length/this.n;X.fillStyle='#401010';X.fillRect(98,122,60,3);X.fillStyle='#e0a020';X.fillRect(98,122,Math.round(60*q),3);}}};
const M={G:null,mode:'',alt:[0,0],lv:0,paused:0,quit:0};

function endFight(){const w=M.G.mw;RB.G=null;

const PAUSE={i:0,mv:-1,
 tick(){if(this.mv>=0){for(const a of ACTS){if(a.p!==-1)continue;if(a.a==='back'||a.a==='ok'||a.a==='rclick'||(a.a==='click'&&M.mode!=='vs')){this.mv=-1;return;}if((a.a==='l'||a.a==='r'||a.a==='click')&&M.mode==='vs'){this.mv=1-this.mv;sfx('move');}}return;}
  const r=navList(this,4,94,22);if(r==='back'){M.paused=0;MGATE=1;return;}if(r!=='ok')return;sfx('sel');
  if(this.i===0){M.paused=0;MGATE=1;}else if(this.i===1)this.mv=0;else if(this.i===2)go(KEYS,{back:FIGHT});else{M.paused=0;go(MENU);}},
 draw(){X.fillStyle='rgba(0,0,0,.78)';X.fillRect(0,0,SW,SH);if(this.mv>=0){drawMoves(M.G.f[this.mv].ci,M.mode==='vs'&&this.mv?'p2':'p1');txt((M.mode==='vs'?'{ } SWITCH PLAYER    ':'')+'ESC: BACK',128,214,'#a08060',1);return;}
  big('PAUSED',128,48,3,1,'gold');listMenu(['RESUME','MOVE LIST','CONTROLS','QUIT TO MENU'],this.i,94,22);}};
const RNGN={close:'UP CLOSE',far:'FAR AWAY',any:'ANY RANGE'};

 txt('"'+d.q+'"',128,44,'#c8a870',1);let y=60;for(const s of d.sp){txt(s.nm,8,y,'#ffd060');txt(inStr(s.in,s.b),248,y,'#ffffff',2);y+=12;}
 y+=6;txt('BRAINROTALITY',8,y,'#ff5050');txt(d.fin.nm,248,y,'#ff9090',2);y+=11;txt(inStr(d.fin.in,d.fin.b),8,y,'#ffffff');txt(RNGN[d.fin.r],248,y,'#c0b090',2);y+=11;txt('DO IT WHEN YOU SEE FINISH IT!',8,y,'#8a7a60');
 y+=14;for(const[a,b]of[['THROW','F OR B + LP UP CLOSE'],['UPPERCUT','D + HP'],['SWEEP / ROUNDHOUSE','B + LK  /  B + HK'],['STAGE FINISH','UPPERCUT AT THE BRIDGE']]){txt(a,8,y,'#a0c0ff');txt(b,248,y,'#d0d0d0',2);y+=10;}
 txt('F TOWARD RIVAL  B AWAY  D DOWN  U UP',128,178,'#8a7a60',1);
 txt('LP '+bindName(bs,'LP')+'   HP '+bindName(bs,'HP'),128,189,'#c0b090',1);txt('LK '+bindName(bs,'LK')+'   HK '+bindName(bs,'HK'),128,199,'#c0b090',1);}
const MOVES={init(o){this.ci=o.ci||0;this.back=o.back||MENU;},
 tick(){for(const a of ACTS){if(a.p!==-1)continue;if(a.a==='l'){this.ci=(this.ci+CH.length-1)%CH.length;sfx('move');}else if(a.a==='r'){this.ci=(this.ci+1)%CH.length;sfx('move');}else if(a.a==='click'){this.ci=(this.ci+1)%CH.length;sfx('move');}else if(a.a==='back'||a.a==='ok'||a.a==='rclick'){go(this.back);return;}}},
 draw(){bgDraw(.3);drawMoves(this.ci);txt('{ } OR CLICK: NEXT FIGHTER   ESC: BACK',128,214,'#a08060',1);}};
const KEYS={set:'p1',r:1,c:0,ls:null,msg:'',
 init(o){this.back=(o&&o.back)||MENU;this.ls=null;this.msg='';this.r=1;this.c=0;},
 rowY(i){return i===0?28:i<=9?50+(i-1)*12:i===10?162:174;},
 hit(x,y){if(y>=25&&y<36&&x>=16&&x<240)return[0,-1];for(let i=1;i<=9;i++){const yy=this.rowY(i);if(y>=yy-2&&y<yy+9)return[i,x>=172?1:x>=88?0:-1];}
  if(y>=159&&y<170&&x>=50&&x<206)return[10,-1];if(y>=171&&y<182&&x>=90&&x<166)return[11,-1];return null;},
 toggle(){this.set=this.set==='p1'?'p2':'p1';this.msg='';sfx('move');},
 activate(){const r=this.r;if(r===0)this.toggle();else if(r<=9){this.ls={armed:!mouseDown(),sh:null};this.msg='';sfx('sel');}
  else if(r===10){BINDS[this.set]=JSON.parse(JSON.stringify(BDEF[this.set]));bindsChanged();this.msg='DEFAULT CONTROLS RESTORED';sfx('coin');}else go(this.back);},
 assign(b){const S=BINDS[this.set],a=BACT[this.r-1];for(const k of BACT)for(let i=0;i<2;i++)if(S[k][i]===b)S[k][i]=null;S[a][this.c]=b;bindsChanged();this.ls=null;sfx('sel');
  const o=this.set==='p1'?'p2':'p1';this.msg=BACT.some(k=>BINDS[o][k].includes(b))?keyName(b)+' IS ALSO USED BY '+(o==='p1'?'PLAYER 1':'PLAYER 2'):'';},
 tick(){const L=this.ls;
  if(L){if(!L.armed&&!mouseDown())L.armed=1;
   for(const e of KP){const c=e.code;if(c==='Escape'){this.ls=null;sfx('move');return;}if(e.mouse&&!L.armed)continue;if(c==='ShiftLeft'||c==='ShiftRight'){L.sh=c;continue;}this.assign((e.shiftKey?'Shift+':'')+c);return;}
   if(L.sh&&KU.includes(L.sh))this.assign(L.sh);return;}
  if(MMOVED){const h=this.hit(MX,MY);if(h&&(h[0]!==this.r||(h[1]>=0&&h[1]!==this.c))){this.r=h[0];if(h[1]>=0)this.c=h[1];sfx('move');}}
  for(const a of ACTS){if(a.p!==-1)continue;
   if(a.a==='u'){this.r=(this.r+11)%12;sfx('move');}else if(a.a==='d'){this.r=(this.r+1)%12;sfx('move');}
   else if(a.a==='l'||a.a==='r'){if(this.r===0)this.toggle();else if(this.r<=9){this.c=1-this.c;sfx('move');}}
   else if(a.a==='back'||a.a==='rclick'){go(this.back);return;}
   else if(a.a==='ok'){this.activate();return;}
   else if(a.a==='click'){const h=this.hit(MX,MY);if(h){this.r=h[0];if(h[1]>=0)this.c=h[1];this.activate();return;}}}
  for(const e of KP)if((e.code==='Delete'||e.code==='Backspace')&&this.r>=1&&this.r<=9){BINDS[this.set][BACT[this.r-1]][this.c]=null;bindsChanged();this.msg='';sfx('blk');}},
 draw(){bgDraw(.5);big('CONTROLS',128,4,2,1,'gold');const p1=this.set==='p1',s0=this.r===0&&!this.ls;
  txt((s0?'{ ':'')+(p1?'PLAYER 1  KEYBOARD + MOUSE':'PLAYER 2  KEYBOARD')+(s0?' }':''),128,28,s0?'#ffd040':'#e0d0b0',1);
  txt(p1?'ARCADE, ONLINE AND VERSUS PLAYER 1':'VERSUS PLAYER 2 ON THE SAME KEYBOARD',128,38,'#8a7a60',1);
  for(let i=0;i<9;i++){const a=BACT[i],y=this.rowY(i+1),on=this.r===i+1;txt(BNAME[a],8,y,on?'#ffd040':'#c0b090');
   for(let c=0;c<2;c++){const x=c?172:90,sel=on&&this.c===c,b=BINDS[this.set][a][c];if(sel){X.fillStyle=this.ls?'#6a1a10':'#4a2a10';X.fillRect(x-2,y-2,82,11);}
    let t=sel&&this.ls?((FRAME>>3)%2?'PRESS A KEY':''):keyName(b);if(t.length>13)t=t.slice(0,13);txt(t,x,y,sel?'#ffffff':b?'#e0d8c8':'#5a4a3a');}}
  txt('RESET TO DEFAULTS',128,162,this.r===10?'#ffd040':'#a89880',1);txt('BACK',128,174,this.r===11?'#ffd040':'#a89880',1);
  const m=this.ls?'PRESS A KEY OR MOUSE BUTTON  ESC: CANCEL':this.msg;if(m)txt(m,128,188,this.ls?'#ffffff':'#ff9060',1);
  txt(this.ls?'HOLD SHIFT FIRST FOR A SHIFT COMBO':'CLICK/ENTER CHANGE  DEL CLEAR  ESC BACK',128,200,'#a08060',1);
  txt('PAD  X LP  Y HP  A LK  B HK  LB/RB BLOCK',128,212,'#80b080',1);}};
const OPTIONS={i:0,rows:[['DIFFICULTY','diff',['EASY','NORMAL','HARD']],['MUSIC','music',['OFF','ON']],['SOUND FX','sfx',['OFF','ON']],['ANNOUNCER','voice',['OFF','ON']],['SCANLINES','crt',['OFF','ON']]],
 yOf(i){return i<this.rows.length?64+i*20:72+this.rows.length*20;},
 over(){if(MX<24||MX>=232)return -1;for(let i=0;i<=this.rows.length;i++){const y=this.yOf(i);if(MY>=y-4&&MY<y+11)return i;}return -1;},
 cyc(i,d){const r=this.rows[i],k=r[1],m=r[2].length;OPT[k]=(OPT[k]+d+m)%m;sfx('move');if(k==='crt')fit();},
 tick(){const n=this.rows.length+1;if(MMOVED){const h=this.over();if(h>=0&&h!==this.i){this.i=h;sfx('move');}}

  else if(a.a==='back'||a.a==='rclick'||(a.a==='ok'&&this.i===n-1)){go(MENU);return;}
  else if(a.a==='click'){const h=this.over();if(h===n-1){go(MENU);return;}if(h>=0){this.i=h;this.cyc(h,1);}}
  else if(this.i<n-1&&(a.a==='l'||a.a==='r'||a.a==='ok'))this.cyc(this.i,a.a==='l'?-1:1);}},
 draw(){bgDraw(.3);big('OPTIONS',128,16,3,1,'gold');this.rows.forEach((r,i)=>{const on=i===this.i,y=64+i*20;txt(r[0],40,y,on?'#ffd040':'#a89880');txt((on?'{ ':'')+r[2][OPT[r[1]]]+(on?' }':''),216,y,on?'#ffffff':'#c0b090',2);});
  const b=this.rows.length;txt('BACK',128,72+b*20,this.i===b?'#ffd040':'#a89880',1);}};
const CONT={init(){this.n=9;this.over=0;MUS.tr=null;},
 tick(){if(this.over){if(this.t>200)go(TITLE);return;}if(this.t>0&&this.t%60===0){this.n--;sfx('move');if(this.n<0){this.over=1;this.t=0;say('GAME OVER');}}
  if(this.t>20&&(okA()||anyA('start'))){sfx('coin');ladFight();}},
 draw(){bgDraw(.3);if(this.over){big('GAME OVER',128,90,3,1,'red');return;}big('CONTINUE?',128,56,3,1,'gold');big(String(Math.max(0,this.n)),128,96,5,1,'red');txt('PRESS ENTER',128,160,'#ffffff',1);}};
const ENDING={init(){musPlay('menu');say('Congratulations');this.c=LAD.pc;},tick(){if(this.t>90&&okA())go(TITLE);},
 draw(){bgDraw();big('CONGRATULATIONS',128,8,2,1,'gold');blit(frame(this.c,0,'wn1'),56,168,1);
  ['YOU DEFEATED','CERVELLONE SUPREMO!','',CH[this.c].s,'IS THE NEW','SUPREME BRAINROT'].forEach((l,i)=>txt(l,172,56+i*12,i===3?'#ffd040':'#e0d0b0',1));
  txt('"'+CH[this.c].q+'"',128,184,'#c8a870',1);if(this.t>90)txt('PRESS ENTER',128,204,'#ffffff',1);}};

/* ============ MAIN LOOP ============ */
let last=performance.now(),acc=0;
function step(){FRAME++;gatherActs();try{if(SC.tick)SC.tick();}catch(e){console.error(e);}SC.t++;KP=[];KU=[];MMOVED=0;if(MGATE&&!mouseDown())MGATE=0;runJobs();if(NET.st==='conn'&&FRAME%90===0)netSend({t:'ping',s:performance.now()});}
function loop(now){acc+=Math.min(120,now-last);last=now;let n=0;while(acc>=1000/60){acc-=1000/60;if(n<5)step();n++;}
 try{SC.draw();}catch(e){console.error(e);}requestAnimationFrame(loop);}
fit();go(BOOT);requestAnimationFrame(loop);
