(function () {
'use strict';
/* ==========================================================================
   GRAVE RUSH  -  one-screen 8-bit zombie arcade
   ========================================================================== */
const W = 320, H = 264, TS = 16, MW = 20, MH = 14, PLAYH = 224;

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
cvs.width = W; cvs.height = H;
ctx.imageSmoothingEnabled = false;

function fit() {
  let s = Math.min(window.innerWidth / W, window.innerHeight / H);
  if (s >= 2) s = Math.floor(s * 4) / 4;
  cvs.style.width = Math.floor(W * s) + 'px';
  cvs.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ---------------------------------------------------------------- helpers */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = Math.round;
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

/* ---------------------------------------------------------------- assets */
const atlas = new Image();
const mapsImg = new Image();
let loadedN = 0;
function onAsset() { if (++loadedN === 2) boot(); }
atlas.onload = onAsset; mapsImg.onload = onAsset;
atlas.src = DATA.atlas; mapsImg.src = DATA.mapsImg;
const S = DATA.sprites;

function spr(name, x, y, flip) {
  const r = S[name]; if (!r) return;
  if (flip) {
    ctx.save(); ctx.translate(rnd(x) + r[2], rnd(y)); ctx.scale(-1, 1);
    ctx.drawImage(atlas, r[0], r[1], r[2], r[3], 0, 0, r[2], r[3]); ctx.restore();
  } else ctx.drawImage(atlas, r[0], r[1], r[2], r[3], rnd(x), rnd(y), r[2], r[3]);
}
function sprSize(name) { const r = S[name]; return [r[2], r[3]]; }

/* ---------------------------------------------------------------- map / collision */
function solidAt(px, py) {
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return true;
  return SOLID[ty][tx];
}
function blockedBox(x, y, r) {
  return solidAt(x - r, y - r) || solidAt(x + r, y - r) || solidAt(x - r, y + r) || solidAt(x + r, y + r);
}
function moveEnt(e, dx, dy, r) {
  r = r || 5;
  const nx = e.x + dx; if (!blockedBox(nx, e.y, r)) e.x = nx;
  const ny = e.y + dy; if (!blockedBox(e.x, ny, r)) e.y = ny;
}
function los(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy);
  if (d < 1) return true;
  const n = Math.ceil(d / 4), nx = -dy / d * 5, ny = dx / d * 5;
  for (let i = 1; i < n; i++) {
    const t = i / n, x = x0 + dx * t, y = y0 + dy * t;
    if (solidAt(x, y) || solidAt(x + nx, y + ny) || solidAt(x - nx, y - ny)) return false;
  }
  return true;
}
function computeField() {
  FIELD.fill(-1);
  const sx = clamp(Math.floor(P.x / TS), 0, MW - 1), sy = clamp(Math.floor(P.y / TS), 0, MH - 1);
  const q = [sx + sy * MW]; FIELD[q[0]] = 0;
  for (let h = 0; h < q.length; h++) {
    const cur = q[h], cx = cur % MW, cy = (cur / MW) | 0, cd = FIELD[cur];
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      if (!ox && !oy) continue;
      const nx = cx + ox, ny = cy + oy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH || SOLID[ny][nx] || FIELD[nx + ny * MW] >= 0) continue;
      if (ox && oy && (SOLID[cy][nx] || SOLID[ny][cx])) continue;
      FIELD[nx + ny * MW] = cd + 1; q.push(nx + ny * MW);
    }
  }

  const tx = clamp(Math.floor(z.x / TS), 0, MW - 1), ty = clamp(Math.floor(z.y / TS), 0, MH - 1);
  const cur = FIELD[tx + ty * MW];
  if (cur < 0) return null;
  let bv = cur, bx = -1, by = -1;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    if (!ox && !oy) continue;
    const nx = tx + ox, ny = ty + oy;
    if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
    const v = FIELD[nx + ny * MW];
    if (v < 0 || v >= bv) continue;
    if (ox && oy && (SOLID[ty][nx] || SOLID[ny][tx])) continue;
    bv = v; bx = nx; by = ny;
  }
  return bx < 0 ? null : [(bx + 0.5) * TS, (by + 0.5) * TS];
}

function makeRound(n) {

    if (n >= 3) w.runner = Math.min(35, (n - 2) * 6);
    if (n >= 4) w.bloater = Math.min(14, (n - 3) * 3 + 3);

  const keysW = Object.keys(w), total = keysW.reduce((a, k) => a + w[k], 0), list = [];

    let r = Math.random() * total, t = keysW[0];

/* ---------------------------------------------------------------- update */
function updatePlayer(dt) {
  // timers
  if (P.fireT > 0) P.fireT -= dt;
  if (P.meleeT > 0) P.meleeT -= dt;
  if (P.swing > 0) P.swing -= dt;
  if (P.flash > 0) P.flash -= dt;
  if (P.clickT > 0) P.clickT -= dt;
  if (P.inv > 0) P.inv -= dt;
  if (P.regenT > 0) P.regenT -= dt; else if (P.hp < P.maxHp) P.hp = Math.min(P.maxHp, P.hp + 18 * dt);

  // movement
  let ix = 0, iy = 0;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp) iy -= 1;
  if (keys.KeyS || keys.ArrowDown) iy += 1;
  const moving = ix !== 0 || iy !== 0;
  const wants = keys.ShiftLeft || keys.ShiftRight;
  const sprinting = wants && moving && !P.exhausted && P.stam > 0;
  if (sprinting) {
    P.stam -= dt;
    if (P.stam <= 0) { P.stam = 0; P.exhausted = true; }
  } else if (P.exhausted) {
    P.stam += (P.stamMax / 4) * dt;                  // full refill takes 4s after a burnout
    if (P.stam >= P.stamMax) { P.stam = P.stamMax; P.exhausted = false; }
  } else {
    P.stam = Math.min(P.stamMax, P.stam + dt);       // refill time == time spent sprinting
  }
  P.sprint = sprinting; P.moving = moving;
  if (moving) {
    const l = Math.hypot(ix, iy);
    const sp = (sprinting ? 98 : 56) * (has('speedy') ? 1.15 : 1);
    moveEnt(P, ix / l * sp * dt, iy / l * sp * dt);
    P.anim += dt * (sprinting ? 11 : 7);
  }
  P.aim = Math.atan2(mouse.y - P.y, mouse.x - P.x);

  // actions
  if (mouse.leftP) P.buf = 0.2;
  if (P.buf > 0) P.buf -= dt;
  if (WEAPONS[P.gun.type].auto) { if (mouse.left) fireGun(false); }
  else if (P.buf > 0 && fireGun(true)) P.buf = 0;
  if (mouse.rightP || pressed.KeyF) doMelee();
  if (pressed.KeyG || pressed.Space) throwBomb();
  const near = findNear(); P.near = near;
  if (pressed.KeyE) interact(near);
  if (pressed.KeyR && near && near.kind === 'upgrade') upgrade('knife');
  if (pressed.KeyQ && near && near.kind === 'perk') { G.perkOffer = (G.perkOffer + 1) % PERKS.length; sfx('swap'); }
}
function updateRound(dt) {
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  if (G.fade > 0 && G.phase !== 'fadeout') G.fade = Math.max(0, G.fade - dt * 2);
  if (G.phase === 'fadeout') {
    G.fade += dt * 2;
    if (G.fade >= 1) {
      G.fade = 1;
      startMap(pickMap());
      startRound(G.round + 1);
    }
    return;
  }
  if (G.phase === 'inter') {
    G.inter -= dt;
    if (G.inter <= 0) {
      if (G.round % 10 === 0) G.phase = 'fadeout';
      else startRound(G.round + 1);
    }
    return;
  }
  const alive = G.zombies.length;
  const maxAlive = Math.min(40, 12 + G.round * 2);
  G.spawnT -= dt;
  if (G.toSpawn.length && alive < maxAlive && G.spawnT <= 0) {
    spawnZombie(G.toSpawn.shift());
    G.spawnT = Math.max(0.35, 1.3 - 0.05 * G.round);
  }
  if (!G.toSpawn.length && alive === 0) {
    G.phase = 'inter'; G.inter = 4;
    G.banner = { text: 'ROUND CLEARED', t: 0, dur: 3.6, sub: (G.round % 10 === 0) ? 'NEW AREA INCOMING' : 'GET READY', sub2: null };
    sfx('clear');
  }
  // pickups
  G.pickT -= dt;
  if (G.pickT <= 0) { spawnPickup(); G.pickT = rand(16, 28); }
}
function updateWorld(dt) {
  G.t += dt;
  if (G.groanT > 0) G.groanT -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 22);
  if (G.hurtFlash > 0) G.hurtFlash -= dt;

  // flow field
  G.fieldT -= dt;
  const key = Math.floor(P.x / TS) + Math.floor(P.y / TS) * MW;
  if (key !== fieldKey || G.fieldT <= 0) { fieldKey = key; G.fieldT = 0.25; computeField(); }

  for (const z of G.zombies) if (!z.dead) updateZombie(z, dt);
  // separation
  const zs = G.zombies;
  for (let i = 0; i < zs.length; i++) {
    const a = zs[i]; if (a.dead) continue;
    for (let j = i + 1; j < zs.length; j++) {
      const b = zs[j]; if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 < 81 && d2 > 0.01) {
        const d = Math.sqrt(d2), push = (9 - d) * 0.5, ux = dx / d, uy = dy / d;
        moveEnt(a, -ux * push, -uy * push); moveEnt(b, ux * push, uy * push);
      } else if (d2 <= 0.01) { a.x += rand(-1, 1); a.y += rand(-1, 1); }
    }
  }

  // bullets
  for (const b of G.bullets) {
    const steps = Math.max(1, Math.ceil(Math.hypot(b.vx, b.vy) * dt / 3));
    const sx = b.vx * dt / steps, sy = b.vy * dt / steps, sl = Math.hypot(sx, sy);
    for (let s = 0; s < steps && !b.dead; s++) {
      b.x += sx; b.y += sy; b.dist += sl;
      if (solidAt(b.x, b.y)) {
        b.dead = true;
        for (let i = 0; i < 3; i++) G.parts.push({ x: b.x, y: b.y, vx: rand(-40, 40), vy: rand(-40, 40), life: 0.2, max: 0.2, col: '#fcd838', sz: 1, g: 0 });
        break;
      }
      let hz = null, hd = 56;
      for (const z of zs) {
        if (z.dead) continue;
        const d2 = (z.x - b.x) * (z.x - b.x) + (z.y - b.y) * (z.y - b.y);
        if (d2 <= hd) { hd = d2; hz = z; }
      }
      if (hz) {
        b.dead = true;
        for (let i = 0; i < 3; i++) G.parts.push({ x: b.x, y: b.y, vx: rand(-50, 50) - b.vx * 0.1, vy: rand(-50, 50) - b.vy * 0.1, life: 0.3, max: 0.3, col: '#e43828', sz: 1, g: 120 });
        dmgZ(hz, b.dmg);
        break;
      }
      if (b.dist > b.range) { b.dead = true; break; }
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);

  // bombs
  for (const b of G.bombs) {
    b.t -= dt; b.age += dt; b.tickT -= dt;
    if (b.tickT <= 0) { sfx('tick'); b.tickT = 0.25; }
    if (b.t <= 0) { b.done = true; explodeBomb(b); }
  }
  G.bombs = G.bombs.filter(b => !b.done);
  for (const f of G.fx) f.t += dt;
  G.fx = G.fx.filter(f => f.t < f.dur);

  // cleanup dead zombies
  G.zombies = G.zombies.filter(z => !z.dead);

  // pickups age
  for (const p of G.pickups) { p.age += dt; }
  G.pickups = G.pickups.filter(p => p.age < p.ttl);
  if (G.dropped && G.pickups.indexOf(G.dropped) < 0) G.dropped = null;

  // particles
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const f of G.floats) { f.t -= dt; f.y -= 16 * dt; }
  G.floats = G.floats.filter(f => f.t > 0);
}
function update(dt) {
  if (mode === 'title') {
    if (pressed.Enter || pressed.Space || mouse.leftP) newGame();
  } else if (mode === 'play') {
    if (pressed.KeyP || pressed.Escape) { mode = 'pause'; }
    else {
      updatePlayer(dt);
      updateWorld(dt);
      updateRound(dt);
    }
  } else if (mode === 'pause') {
    if (pressed.KeyP || pressed.Escape || pressed.Enter || mouse.leftP) mode = 'play';
  } else if (mode === 'swap') {
    if (pressed.Digit1 || pressed.Numpad1) confirmSwap(0);
    else if (pressed.Digit2 || pressed.Numpad2) confirmSwap(1);
    else if (pressed.Digit3 || pressed.Numpad3) confirmSwap(2);
    else if (pressed.Escape || pressed.KeyQ) { mode = 'play'; }
  } else if (mode === 'over') {
    G.over.t += dt;
    for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
    G.parts = G.parts.filter(p => p.life > 0);
    if (G.over.t > 0.8 && (pressed.Enter || pressed.Space || mouse.leftP)) newGame();
  }
  if (pressed.KeyM) musicOn = !musicOn;
}

  ctx.fillStyle = 'rgba(40,0,0,0.6)'; ctx.fillRect(0, 0, W, PLAYH);
  panel(50, 36, 220, 146);
  textC('YOU DIED', W / 2, 46, '#e43828', 3);
  const rows = [['ROUND REACHED', G.round], ['ZOMBIES KILLED', G.kills], ['POINTS EARNED', G.earned], ['BEST ROUND', best.round], ['TOP POINTS', best.score]];
  let y = 80;
  for (const r of rows) { text(r[0], 70, y, '#8c84b0'); const v = String(r[1]); text(v, 250 - textW(v), y, '#fff'); y += 12; }
  if (G.newBest) textC('NEW PERSONAL BEST!', W / 2, 144, '#fcd838', 1);
  if (G.over.t > 0.8 && Math.floor(performance.now() / 500) % 2 === 0) textC('CLICK OR ENTER TO TRY AGAIN', W / 2, 164, '#fff', 1);
}
function render() {
  if (mode === 'title') { drawTitle(); drawCrosshair(); return; }
  drawWorld();
  if (G.hurtFlash > 0) {
    ctx.fillStyle = 'rgba(228,56,40,' + clamp(G.hurtFlash * 1.4, 0, 0.45) + ')';
    ctx.fillRect(0, 0, W, PLAYH);
  }
  if (P.hp < P.maxHp * 0.3 && mode === 'play') {
    ctx.fillStyle = 'rgba(160,0,0,' + (0.18 + 0.12 * Math.sin(G.t * 8)) + ')';
    ctx.fillRect(0, 0, W, 3); ctx.fillRect(0, PLAYH - 3, W, 3); ctx.fillRect(0, 0, 3, PLAYH); ctx.fillRect(W - 3, 0, 3, PLAYH);
  }
  if (G.fade > 0) { ctx.fillStyle = '#000'; ctx.globalAlpha = clamp(G.fade, 0, 1); ctx.fillRect(0, 0, W, PLAYH); ctx.globalAlpha = 1; }
  drawPrompt();
  drawBanner();
  drawHUD();
  if (mode === 'pause') drawPause();
  if (mode === 'swap') drawSwap();
  if (mode === 'over') drawOver();
  if (mode === 'play' || mode === 'pause' || mode === 'swap') drawCrosshair();
  if (mode === 'over') drawCrosshair();
}

/* ---------------------------------------------------------------- main loop */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
  update(dt); render();
  for (const k in pressed) delete pressed[k];
  mouse.leftP = mouse.rightP = false;
  requestAnimationFrame(frame);
}
function boot() {
  fit();
  requestAnimationFrame(frame);
}

// handy hooks for automated testing
window.__GR = {
  update, render, newGame,
  get G() { return G; }, get P() { return P; }, get mode() { return mode; }, set mode(v) { mode = v; },
  keys, pressed, mouse, MAPS, startMap, startRound, hpOf, baseHp, shotsNeeded, upCost, spawnZombie, spawnPickup,
  tickFrame(dt) { update(dt); render(); for (const k in pressed) delete pressed[k]; mouse.leftP = mouse.rightP = false; },
};
})();

</script>
