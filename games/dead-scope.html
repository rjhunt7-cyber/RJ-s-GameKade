<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEAD SCOPE</title>
<style>html,body{margin:0;height:100%;background:#0c0b0a}#dead-scope{width:100vw;height:100vh}</style>
<style>/* All rules are scoped under .ds-root so the game never leaks styles into the host website. */
.ds-root { position: relative; width: 100%; height: 100%; min-height: 360px; overflow: hidden; background: #0c0b0a; color: #f2ead8;
  font-family: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif; user-select: none; -webkit-user-select: none; contain: layout paint; }
.ds-root * { box-sizing: border-box; }
.ds-root canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ds-root .ds-gl { image-rendering: auto; }
.ds-root .ds-hud { pointer-events: none; }
.ds-root .ds-ui { position: absolute; inset: 0; display: flex; overflow: auto; }
.ds-root .ds-ui.hidden { display: none; }
.ds-root .ds-ui.dim { background: radial-gradient(ellipse at center, rgba(10,8,6,0.55), rgba(5,4,3,0.88)); }
.ds-root .ds-ui.menu { background: linear-gradient(90deg, rgba(8,6,4,0.92) 0%, rgba(8,6,4,0.55) 45%, rgba(8,6,4,0.05) 100%); }
.ds-root .ds-center { margin: auto; padding: 24px; max-width: 100%; }
.ds-root .ds-main { margin: auto auto auto 6%; display: flex; flex-direction: column; gap: 6px; }
.ds-root .ds-logo { font-size: clamp(44px, 8vw, 96px); font-weight: 900; letter-spacing: 0.06em; line-height: 0.9; color: #f2ead8;
  text-shadow: 0 3px 0 #7a2e12, 0 6px 18px rgba(0,0,0,0.8); transform: skewX(-6deg); }
.ds-root .ds-logo.small { font-size: 42px; text-align: center; }
.ds-root .ds-tag { letter-spacing: 0.35em; font-size: 13px; color: #d6782a; margin: 4px 0 26px 4px; font-weight: 800; }
.ds-root .ds-nav { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.ds-root button { font: inherit; font-weight: 800; letter-spacing: 0.12em; font-size: 15px; color: #f2ead8; background: rgba(28,24,20,0.82);
  border: 0; border-left: 4px solid #d6782a; padding: 11px 22px; cursor: pointer; min-width: 220px; text-align: left; transition: background .12s, transform .12s; }
.ds-root button:hover { background: rgba(120,46,18,0.9); transform: translateX(4px); }
.ds-root button.big { background: #b8501f; border-left-color: #f2ead8; font-size: 18px; }
.ds-root button.big:hover { background: #d6612a; }
.ds-root .ds-ver { margin-top: 28px; font-size: 11px; color: #8a8274; letter-spacing: 0.1em; }
.ds-root .ds-panel { background: rgba(16,13,11,0.94); border-top: 4px solid #d6782a; min-width: min(560px, 92vw); max-width: 980px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.ds-root .ds-head { padding: 16px 24px 4px; }
.ds-root .ds-head h2 { margin: 0; font-size: 30px; letter-spacing: 0.08em; font-weight: 900; transform: skewX(-6deg); }
.ds-root .ds-body { padding: 10px 24px 18px; font-size: 15px; line-height: 1.45; color: #e3dac6; }
.ds-root .ds-foot { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; padding: 12px 24px 20px; }
.ds-root .ds-foot button { min-width: 140px; }
.ds-root p.warn { color: #ffb347; font-weight: 800; }
.ds-root p.hint { color: #a99f8b; font-size: 13px; }
.ds-root .ds-label { font-size: 12px; letter-spacing: 0.2em; color: #d6782a; font-weight: 800; margin: 14px 0 6px; }
.ds-root .ds-maps, .ds-root .ds-guns { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.ds-root .ds-map, .ds-root .ds-gun { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 14px; border-left-width: 4px; text-transform: none; letter-spacing: 0.04em; }
.ds-root .ds-map b, .ds-root .ds-gun b { font-size: 18px; letter-spacing: 0.08em; }
.ds-root .ds-map em, .ds-root .ds-gun em { font-style: normal; font-weight: 600; color: #cfc5ae; font-size: 13px; }
.ds-root .ds-map small, .ds-root .ds-gun small { font-weight: 600; color: #8f8573; font-size: 12px; }
.ds-root .ds-map .sw { display: flex; height: 34px; }
.ds-root .ds-map .sw i { flex: 1; }
.ds-root .sel { background: rgba(140,52,20,0.92) !important; border-left-color: #f2ead8 !important; }
.ds-root .ds-row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
.ds-root .ds-seg { display: flex; gap: 4px; }
.ds-root .ds-seg button { min-width: 0; padding: 8px 14px; font-size: 13px; }
.ds-root input[type=range] { width: 220px; accent-color: #d6782a; }
.ds-root input[type=text] { font: inherit; font-weight: 700; background: #1c1814; color: #f2ead8; border: 1px solid #4a3f33; padding: 8px 10px; width: 200px; }
.ds-root .ds-stats { display: grid; grid-template-columns: 96px 1fr; gap: 4px 8px; align-items: center; font-size: 12px; font-weight: 700; color: #bdb29c; }
.ds-root .ds-stat { height: 6px; background: rgba(255,255,255,0.1); display: block; }
.ds-root .ds-stat i { display: block; height: 100%; background: #e8e2d0; }
.ds-root .ds-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.ds-root .ds-tabs button { min-width: 0; font-size: 13px; padding: 8px 14px; }
.ds-root .ds-setlist { max-height: 56vh; overflow: auto; padding-right: 6px; }
.ds-root .ds-set { display: flex; align-items: center; gap: 14px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.ds-root .ds-set label { flex: 1; font-weight: 700; font-size: 14px; }
.ds-root .ds-set span { width: 44px; text-align: right; font-weight: 800; }
.ds-root .ds-set button.tog, .ds-root .ds-set button.key { min-width: 110px; text-align: center; padding: 7px 10px; font-size: 13px; }
.ds-root .ds-set button.tog.on { background: #2f5a2a; }
.ds-root .ds-set button.wait { background: #7a2e12; }
.ds-root .ds-cols { display: flex; gap: 28px; flex-wrap: wrap; }
.ds-root .ds-keys { border-collapse: collapse; font-size: 14px; }
.ds-root .ds-keys td { padding: 4px 10px 4px 0; }
.ds-root td.key { font-weight: 900; color: #ffb347; min-width: 90px; }
.ds-root .ds-tips { max-width: 380px; font-size: 14px; }
.ds-root .ds-tips h3 { color: #d6782a; letter-spacing: 0.15em; font-size: 13px; margin: 10px 0 4px; }
.ds-root .ds-tips p { margin: 4px 0 8px; }
.ds-root .ds-quick div { padding: 6px 0; font-size: 16px; }
.ds-root .ds-quick b { color: #ffb347; }
.ds-root .ds-loading { text-align: center; margin-top: 14px; letter-spacing: 0.2em; font-size: 13px; color: #c8bfa8; font-weight: 700; }
.ds-root .ds-bar { width: 260px; height: 4px; background: rgba(255,255,255,0.1); margin: 12px auto; overflow: hidden; }
.ds-root .ds-bar i { display: block; width: 40%; height: 100%; background: #d6782a; animation: ds-load 1s infinite linear; }
@keyframes ds-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.ds-root .ds-win { font-size: 18px; margin-bottom: 14px; }
.ds-root .ds-podium { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 18px; }
.ds-root .ds-pod { flex: 1; background: rgba(40,32,26,0.9); padding: 12px; display: flex; flex-direction: column; gap: 2px; border-top: 3px solid #8a8274; }
.ds-root .ds-pod.p1 { border-top-color: #ffcf5a; padding-top: 26px; }
.ds-root .ds-pod.p2 { border-top-color: #d8d8d8; padding-top: 18px; }
.ds-root .ds-pod.me { background: rgba(140,52,20,0.8); }
.ds-root .ds-pod span { font-size: 26px; font-weight: 900; }
.ds-root .ds-pod em { font-style: normal; color: #c8bfa8; font-weight: 700; }
.ds-root .ds-mystats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ds-root .ds-mystats div { background: rgba(255,255,255,0.04); padding: 10px; text-align: center; }
.ds-root .ds-mystats b { display: block; font-size: 28px; font-weight: 900; }
.ds-root .ds-mystats span { font-size: 11px; letter-spacing: 0.2em; color: #a99f8b; font-weight: 800; }

.ds-root .ds-mpgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
.ds-root .ds-mpcard { background: rgba(255,255,255,0.04); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ds-root .ds-mpcard b { font-size: 18px; letter-spacing: 0.1em; }
.ds-root .ds-mpcard em { font-style: normal; color: #bdb29c; font-size: 13px; }
.ds-root input.ds-code { font-size: 30px; letter-spacing: 0.4em; text-transform: uppercase; width: 100%; text-align: center; font-weight: 900; }
.ds-root input.bad { border-color: #d0392b; }
.ds-root .ds-roomcode { display: flex; align-items: center; gap: 14px; background: rgba(214,120,40,0.15); padding: 10px 14px; }
.ds-root .ds-roomcode span { font-size: 12px; letter-spacing: 0.25em; color: #d6782a; font-weight: 800; }
.ds-root .ds-roomcode b { font-size: 40px; letter-spacing: 0.3em; font-weight: 900; }
.ds-root button.mini { min-width: 0; padding: 4px 10px; font-size: 11px; margin-left: auto; }
.ds-root button[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.ds-root .ds-teams { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.ds-root .ds-lp { background: rgba(255,255,255,0.05); padding: 7px 10px; margin: 3px 0; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.ds-root .ds-lp i { font-style: normal; font-size: 10px; color: #d6782a; letter-spacing: 0.2em; }
.ds-root .ds-lp.empty { color: #6a6256; }
.ds-root .ds-label.t0 { color: #ffb060; } .ds-root .ds-label.t1 { color: #7fb8ff; }
.ds-root .ds-seg.wrap { flex-wrap: wrap; }
@media (max-width: 760px) { .ds-root .ds-mpgrid, .ds-root .ds-teams { grid-template-columns: 1fr; } }
